async function analyzeAI(){
  const text=document.getElementById('ai-text')?.value?.trim();
  const b64=aiPhoto?aiPhoto.split(',')[1]:null;
  if(!text&&!b64)return showToast('Foto aufnehmen oder Text eingeben.');
  const btn=document.getElementById('ai-analyze-btn');
  if(btn){btn.disabled=true;btn.innerHTML=`<span style="display:inline-block;animation:spin 1s linear infinite;margin-right:6px">🧠</span> Analysiere...`;}
  let result=null,source='';
  try{
    if(getClaudeKey()){try{result=await analyzeWithClaude(text,b64);source='Claude';}catch(e){if(e.message!=='no_claude_key')console.warn(e.message);}}
    if(!result&&S.geminiKey){try{result=await analyzeWithGemini(text,b64);source='Gemini';}catch(e){console.warn(e.message);}}
    if(!result&&!b64&&getGroqKey()){try{result=await analyzeWithGroq(text);source='Groq';}catch(e){console.warn(e.message);}}
    if(!result&&text){const local=analyzeLocally(text);if(local){result=local;source='Lokal';}}
    if(!result){if(btn){btn.disabled=false;btn.innerHTML='✨ KI Analyse erneut starten';}showToast('Kein API-Key – nutze "Manuell" oder hinterlege einen Key im Profil.');return;}
    addMeal({name:result.name||'Mein Gericht',calories:result.calories||0,protein:result.protein||0,carbs:result.carbs||0,fat:result.fat||0,mealType:tempMealType});
    closeModal();const note=source==='Lokal'?'(Lokale DB – ggf. anpassen)':`(${source} Schätzung)`;setTimeout(()=>{showToast(`✓ Eingetragen! ${note}`);},400);
  }catch(e){showToast('Fehler: '+e.message);if(btn){btn.disabled=false;btn.innerHTML='✨ KI Analyse erneut starten';}}
}

async function runDBSearch(){
  const inp=document.getElementById('db-search-inp');if(!inp)return;
  const q=inp.value.trim();if(!q)return showToast('Bitte etwas eintippen.');
  const resultsEl=document.getElementById('db-results');if(!resultsEl)return;
  resultsEl.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;padding:20px 0;">
    ${[1,2,3,4,5].map(()=>`<div class="skeleton" style="height:74px;border-radius:16px;"></div>`).join('')}
  </div>`;
  try{
    const products=await searchFoodDB(q);
    window._dbSearchResults=products;
    if(!products.length){resultsEl.innerHTML=`<div class="food-empty fade-up"><div class="food-empty-icon">👀</div><p style="font-weight:600;color:var(--text)">Nichts zu "<strong>${q}</strong>" gefunden.</p></div>`;return;}
    resultsEl.innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;padding-left:4px">${products.length} Ergebnisse</div>`+products.map((p,i)=>{const kcal=getKcalPer100(p);const n100=getNutrientsPer100(p);const name=getProductName(p);const brand=p.brands&&p.brands!=='USDA'?p.brands.split(',')[0].trim():'';const imgSrc=p.image_thumb_url||'';return`<div class="food-result-item" onclick="selectDBProduct(${i})" style="animation:fadeUp ${0.05+i*0.02}s ease-out both">${imgSrc?`<img class="food-result-img" src="${imgSrc}" onerror="this.style.display='none'" loading="lazy">`:`<div class="food-result-img" style="display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--card2)">🛒</div>`}<div class="food-result-info"><div class="food-result-name">${name}</div>${brand?`<div class="food-result-brand">${brand}</div>`:''}<div style="font-size:11px;color:var(--muted);margin-top:4px">P ${n100.protein}g | C ${n100.carbs}g | F ${n100.fat}g / 100g</div></div><div class="food-result-kcal" style="padding-left:12px;border-left:1px solid var(--border)">${kcal}<br><span style="font-size:11px;font-weight:600;color:var(--muted)">kcal</span></div></div>`;}).join('');
  }catch(e){resultsEl.innerHTML=`<div class="food-empty fade-up"><div class="food-empty-icon">📵</div><p style="font-weight:700;color:var(--fat)">${e.message}</p></div>`;}
}

function selectDBProduct(idx){const p=window._dbSearchResults?.[idx];if(!p)return;selectedProduct=p;showAmountSelector(p);}

function showAmountSelector(product){
  stopBarcodeScanner();
  const mc=document.getElementById('modal-container');
  const name=getProductName(product);
  const brand=product.brands?product.brands.split(',')[0].trim():'';
  const imgSrc=product.image_thumb_url||'';
  const per100=getNutrientsPer100(product);
  const servingG=getServingGrams(product);
  const qty=product.quantity||'';
  let chips=[{label:'100g Standard',grams:100}];
  if(servingG&&servingG!==100)chips.push({label:`1 Portion (${Math.round(servingG)}g)`,grams:Math.round(servingG)});
  chips.push({label:'50g',grams:50},{label:'150g',grams:150},{label:'250g',grams:250});
  const chipsHTML=chips.map((c,i)=>`<div onclick="setAmountChip(${c.grams},${i})" class="amount-chip ${i===0?'active':''}" data-chip-idx="${i}">${c.label}</div>`).join('');
  const mealPillsHTML=MEAL_TYPES.map(t=>`<div onclick="selectMealType('${t.id}')" class="pill ${tempMealType===t.id?'active':''}" style="font-size:13px;padding:8px 14px">${t.emoji} ${t.label}</div>`).join('');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box scale-in"><div style="display:flex;align-items:center;gap:10px;margin-bottom:24px"><button onclick="backToAddModal()" style="background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:18px;font-weight:800;cursor:pointer;padding:4px 10px">←</button><h2 style="flex:1">Feinanpassung</h2></div><div class="amount-header">${imgSrc?`<img class="amount-product-img" src="${imgSrc}" onerror="this.style.display='none'">`:`<div class="amount-product-img" style="display:flex;align-items:center;justify-content:center;font-size:32px">🛒</div>`}<div style="flex:1;min-width:0"><div class="amount-product-name">${name}</div>${brand?`<div class="amount-product-brand">${brand}</div>`:''} ${qty?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${qty}</div>`:''}<div style="font-size:11px;color:var(--dim);margin-top:4px;font-weight:600;display:inline-block;padding:3px 8px;background:var(--card2);border-radius:6px;border:1px solid var(--border)">Je 100g • ${per100.calories} kcal</div></div></div><div style="font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px">Vorlagen</div><div class="amount-chips">${chipsHTML}</div><div style="font-size:13px;color:var(--muted);font-weight:700;margin-top:8px;margin-bottom:8px">Individuelles Gewicht</div><div class="amount-input-row"><input type="number" id="amount-grams-inp" class="inp" value="100" min="1" max="9999" oninput="updateMacroPreview()" style="flex:1;font-size:24px;font-weight:800;text-align:center;border-radius:16px;"><div style="background:var(--card);border:2px solid var(--border);border-radius:16px;padding:12px 18px;font-weight:800;font-size:16px;color:var(--dim)">g</div></div><div class="macro-preview"><div class="macro-preview-title">Tatsächliche Makros</div><div class="macro-preview-grid" id="macro-preview-grid"><div><div class="macro-preview-val" id="prev-kcal" style="color:var(--accent)">-</div><div class="macro-preview-label">kcal</div></div><div><div class="macro-preview-val" id="prev-prot" style="color:var(--protein)">-</div><div class="macro-preview-label">Protein</div></div><div><div class="macro-preview-val" id="prev-carbs" style="color:var(--carbs)">-</div><div class="macro-preview-label">Carbs</div></div><div><div class="macro-preview-val" id="prev-fat" style="color:var(--fat)">-</div><div class="macro-preview-label">Fett</div></div></div></div><div style="font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px">Mahlzeit</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px" id="amount-meal-pills">${mealPillsHTML}</div><button onclick="confirmAddDBMeal()" class="btn" style="width:100%;font-size:16px" id="confirm-add-btn">+ Übernehmen</button><button onclick="window.saveAsFavorite()" class="btn btn-ghost" style="width:100%;margin-top:10px;font-size:14px">⭐ Favorisieren</button></div></div>`;
  window._amountChips=chips;updateMacroPreview();
}

window.saveAsFavorite=function(){if(!selectedProduct)return;S.saveFavorite(selectedProduct);showToast('Favorit gespeichert! ⭐');};
function setAmountChip(grams,idx){document.querySelectorAll('.amount-chip').forEach((el,i)=>el.classList.toggle('active',i===idx));const inp=document.getElementById('amount-grams-inp');if(inp){inp.value=grams;updateMacroPreview();}}
function updateMacroPreview(){const inp=document.getElementById('amount-grams-inp');if(!inp||!selectedProduct)return;const grams=parseFloat(inp.value)||0;const n=calcForGrams(selectedProduct,grams);const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};set('prev-kcal',n.calories);set('prev-prot',n.protein+'g');set('prev-carbs',n.carbs+'g');set('prev-fat',n.fat+'g');const chipGrams=(window._amountChips||[]).map(c=>c.grams);const matched=chipGrams.indexOf(grams);document.querySelectorAll('.amount-chip').forEach((el,i)=>el.classList.toggle('active',i===matched));}
function confirmAddDBMeal(){if(!selectedProduct)return;const grams=parseFloat(document.getElementById('amount-grams-inp')?.value)||100;if(grams<=0)return showToast('Mehr als 0g eingeben.');const n=calcForGrams(selectedProduct,grams);const name=getProductName(selectedProduct);const brandRaw=selectedProduct.brands?selectedProduct.brands.split(',')[0].trim():'';const brand=brandRaw&&brandRaw!=='USDA'&&brandRaw.length<24?' – '+brandRaw:'';addMeal({name:name+brand,calories:n.calories,protein:n.protein,carbs:n.carbs,fat:n.fat,mealType:tempMealType});closeModal();}
function backToAddModal(){stopBarcodeScanner();selectedProduct=null;_renderAddModal();if(currentAddTab==='ki')setTimeout(_renderMealPills,50);}

// ====================== REZEPTE ======================
const MEALDB_BASE='https://www.themealdb.com/api/json/v1/1';
let _currentRecipe=null;

function _buildRezepteTabHTML(){return`<div class="search-row"><input id="recipe-search-inp" class="inp" placeholder="Rezept suchen (Englisch z.B. Chicken...)" onkeydown="if(event.key==='Enter')runRecipeSearch()" style="flex:1;border-radius:18px;"><button onclick="runRecipeSearch()" class="btn" style="padding:12px 18px;flex-shrink:0;border-radius:16px;">🔍</button></div><div style="display:flex;gap:8px;flex-wrap:nowrap;margin-bottom:14px;overflow-x:auto;padding-bottom:6px" id="recipe-category-pills">${['Chicken','Beef','Pasta','Vegetarian','Seafood','Dessert','Breakfast'].map(c=>`<div onclick="searchRecipeByCategory('${c}')" class="pill" style="font-size:12px;padding:6px 14px;white-space:nowrap">${c}</div>`).join('')}</div><div id="recipe-results" style="max-height:45vh;overflow-y:auto;padding-right:4px"><div class="food-empty" style="padding:24px 0"><div class="food-empty-icon">🍽️</div><p style="color:var(--text);font-weight:600">Kategorie wählen oder suchen</p></div></div><button onclick="closeModal()" class="btn btn-ghost" style="width:100%;margin-top:10px">Schließen</button>`;}

async function runRecipeSearch(){const q=document.getElementById('recipe-search-inp')?.value.trim();if(!q)return showToast('Bitte etwas eingeben.');const el=document.getElementById('recipe-results');if(!el)return;el.innerHTML=`<div class="food-loading" style="padding:40px 0">✨ Suche...</div>`;try{const data=await fetchWithRetry(`${MEALDB_BASE}/search.php?s=${encodeURIComponent(q)}`);_renderRecipeResults(data.meals||[]);}catch(e){el.innerHTML=`<div class="food-empty"><div class="food-empty-icon">❌</div><p>${e.message}</p></div>`;}}
async function searchRecipeByCategory(cat){const el=document.getElementById('recipe-results');if(!el)return;el.innerHTML=`<div class="food-loading" style="padding:40px 0">✨ Lade ${cat} Rezepte...</div>`;try{const data=await fetchWithRetry(`${MEALDB_BASE}/filter.php?c=${encodeURIComponent(cat)}`);_renderRecipeResults((data.meals||[]).slice(0,25),true);}catch(e){el.innerHTML=`<div class="food-empty"><p>${e.message}</p></div>`;}}
function _renderRecipeResults(meals,minimal=false){const el=document.getElementById('recipe-results');if(!el)return;if(!meals.length){el.innerHTML=`<div class="food-empty"><div class="food-empty-icon">🫠</div><p style="font-weight:700">Nichts gefunden.</p></div>`;return;}el.innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;padding-left:4px">${meals.length} Rezepte</div>`+meals.map((m,i)=>`<div class="recipe-card" onclick="openRecipeDetail('${m.idMeal}')" style="animation:fadeUp ${0.05+i*0.03}s ease-out both"><img class="recipe-card-img" src="${m.strMealThumb||''}${minimal?'/preview':''}" onerror="this.style.display='none'" loading="lazy"><div class="recipe-card-info"><div class="recipe-card-name">${m.strMeal||'Gericht'}</div><div class="recipe-card-meta">${m.strCategory||''} ${m.strArea?'• '+m.strArea:''}</div><div style="font-size:11px;color:var(--accent);margin-top:6px;font-weight:700">Details &rarr;</div></div></div>`).join('');}

async function openRecipeDetail(id){
  const mc=document.getElementById('modal-container');
  mc.innerHTML=`<div class="modal-overlay"><div class="modal-box"><div class="food-loading" style="padding:40px 0">🍳 Lade Rezept...</div></div></div>`;
  try{
    const data=await fetchWithRetry(`${MEALDB_BASE}/lookup.php?i=${id}`);
    const m=data.meals?.[0];if(!m)throw new Error('Rezept nicht gefunden.');
    _currentRecipe=m;
    const ingredients=[];
    for(let i=1;i<=20;i++){const ing=m[`strIngredient${i}`]?.trim();const measure=m[`strMeasure${i}`]?.trim();if(ing)ingredients.push({name:ing,measure:measure||''});}
    const estKcal=m.strCategory==='Dessert'?280:m.strCategory==='Breakfast'?350:550;
    const ingHTML=ingredients.map(ing=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="font-weight:600">${ing.name}</span><span style="color:var(--muted)">${ing.measure}</span></div>`).join('');
    const mealPillsHTML=MEAL_TYPES.map(t=>`<div onclick="selectMealType('${t.id}')" class="pill ${tempMealType===t.id?'active':''}" style="font-size:13px;padding:8px 12px">${t.emoji} ${t.label}</div>`).join('');
    mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this){currentAddTab='rezepte';_renderAddModal()}"><div class="modal-box scale-in"><div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><button onclick="currentAddTab='rezepte';_renderAddModal()" style="background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:18px;font-weight:800;cursor:pointer;padding:4px 10px">←</button><h3 style="flex:1;font-size:17px;line-height:1.3">${m.strMeal}</h3></div>${m.strMealThumb?`<img src="${m.strMealThumb}" style="width:100%;border-radius:20px;max-height:220px;object-fit:cover;margin-bottom:18px">`:''}<div style="font-weight:800;font-size:15px;margin-bottom:8px">📜 Zutaten (${ingredients.length})</div><div style="max-height:160px;overflow-y:auto;margin-bottom:20px">${ingHTML}</div><div style="background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:16px"><div style="font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600">Kalorien Schätzung pro Portion</div><div style="display:flex;align-items:center;gap:10px"><input type="number" id="recipe-kcal-inp" class="inp" value="${estKcal}" style="flex:1;font-size:24px;font-weight:800;text-align:center;border-radius:14px"><span style="color:var(--muted);font-size:15px;font-weight:700">kcal</span></div></div><div style="font-size:13px;font-weight:600;margin-bottom:8px">Mahlzeit</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">${mealPillsHTML}</div><button onclick="addRecipeMeal()" class="btn" style="width:100%;font-size:16px;padding:15px">Ins Tagebuch</button><button onclick="currentAddTab='rezepte';_renderAddModal()" class="btn btn-ghost" style="width:100%;margin-top:10px">Zurück</button></div></div>`;
  }catch(e){showToast(e.message);currentAddTab='rezepte';_renderAddModal();}
}

function addRecipeMeal(){if(!_currentRecipe)return;const kcal=parseInt(document.getElementById('recipe-kcal-inp')?.value)||400;if(kcal<=0)return showToast('Kalorien eingeben.');addMeal({name:'Rezept '+_currentRecipe.strMeal,calories:kcal,protein:Math.round(kcal*0.20/4),carbs:Math.round(kcal*0.45/4),fat:Math.round(kcal*0.35/9),mealType:tempMealType});_currentRecipe=null;closeModal();}

// ====================== MODALS & TOAST ======================
function closeModal(){
  stopBarcodeScanner();stopCamera();aiPhoto=null;selectedProduct=null;_currentRecipe=null;currentBarcodeSubTab='camera';
  const overlay=document.querySelector('.modal-overlay');
  if(overlay){overlay.style.opacity='0';const box=document.querySelector('.modal-box');if(box)box.style.transform='translateY(100px)';setTimeout(()=>{document.getElementById('modal-container').innerHTML='';},250);}
  else document.getElementById('modal-container').innerHTML='';
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  t.style.animation='none';void t.offsetWidth;t.style.animation='fadeUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2)';
  clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>{t.style.animation='fadeOut 0.25s ease-out forwards';setTimeout(()=>{t.style.display='none';t.style.animation='';},250);},2800);
}

// ====================== MEAL MANAGEMENT ======================
function addMeal(meal){const log=S.dayLog;log.meals=[...log.meals,{...meal,id:uid()}];S.saveDayLog(log);if(currentView==='dashboard')renderView('dashboard');const msgs=['Klasse!','Top!','Gespeichert!','Eingetragen!','Super!'];const randomMsg=msgs[Math.floor(Math.random()*msgs.length)];showToast(`${randomMsg} +${meal.calories} kcal 🔥`);}
function removeMeal(id){const log=S.dayLog;log.meals=log.meals.filter(m=>m.id!==id);S.saveDayLog(log);renderView(currentView);}

function openEditMealModal(id){
  const log=S.dayLog;const meal=log.meals.find(m=>m.id===id);if(!meal)return;
  const mc=document.getElementById('modal-container');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box scale-in"><h2 style="margin-bottom:18px;display:flex;align-items:center;gap:10px"><span>📝</span> Bearbeiten</h2><div style="font-weight:700;margin-bottom:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px;background:var(--card2);border-radius:12px">${meal.name}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px"><div style="background:var(--card2);padding:10px;border-radius:14px"><label style="font-size:12px;color:var(--accent);display:block;margin-bottom:4px;font-weight:700">Kalorien</label><input type="number" id="edit-cal" class="inp" value="${meal.calories}" style="text-align:center;font-weight:800;font-size:20px;border-color:var(--accent);padding:10px"></div><div style="background:var(--card2);padding:10px;border-radius:14px"><label style="font-size:12px;color:var(--protein);display:block;margin-bottom:4px;font-weight:700">Protein (g)</label><input type="number" id="edit-prot" class="inp" value="${meal.protein}" style="text-align:center;font-weight:600;padding:10px"></div><div style="background:var(--card2);padding:10px;border-radius:14px"><label style="font-size:12px;color:var(--carbs);display:block;margin-bottom:4px;font-weight:700">Kohlenhydrate (g)</label><input type="number" id="edit-carbs" class="inp" value="${meal.carbs}" style="text-align:center;font-weight:600;padding:10px"></div><div style="background:var(--card2);padding:10px;border-radius:14px"><label style="font-size:12px;color:var(--fat);display:block;margin-bottom:4px;font-weight:700">Fett (g)</label><input type="number" id="edit-fat" class="inp" value="${meal.fat}" style="text-align:center;font-weight:600;padding:10px"></div></div><div style="margin-bottom:20px"><label style="font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:8px">Mahlzeit-Kategorie</label><div style="display:flex;gap:8px;flex-wrap:wrap" id="edit-meal-pills">${MEAL_TYPES.map(t=>`<div onclick="document.querySelectorAll('#edit-meal-pills .pill').forEach(p=>p.classList.remove('active'));this.classList.add('active');this.dataset.id='${t.id}'" class="pill ${meal.mealType===t.id?'active':''}" data-id="${t.id}" style="font-size:13px;padding:8px 14px">${t.emoji} ${t.label}</div>`).join('')}</div></div><button onclick="saveEditedMeal('${id}')" class="btn" style="width:100%;font-size:16px;padding:14px">Speichern</button><button onclick="closeModal()" class="btn btn-ghost" style="width:100%;margin-top:10px">Abbrechen</button></div></div>`;
}

function saveEditedMeal(id){
  const log=S.dayLog;const idx=log.meals.findIndex(m=>m.id===id);if(idx<0)return;
  const activePill=document.querySelector('#edit-meal-pills .pill.active');
  log.meals[idx]={...log.meals[idx],calories:parseInt(document.getElementById('edit-cal')?.value)||0,protein:parseFloat(document.getElementById('edit-prot')?.value)||0,carbs:parseFloat(document.getElementById('edit-carbs')?.value)||0,fat:parseFloat(document.getElementById('edit-fat')?.value)||0,mealType:activePill?.dataset?.id||log.meals[idx].mealType};
  S.saveDayLog(log);closeModal();renderView('dashboard');showToast('Gespeichert ✓');
}

// ====================== BOOT ======================
function boot(){
  const urlParams=new URLSearchParams(window.location.search);
  if(urlParams.has('steps')){const steps=parseInt(urlParams.get('steps'))||0;const log=S.dayLog;log.steps=steps;S.saveDayLog(log);window.history.replaceState({},document.title,window.location.pathname);setTimeout(()=>{showToast(`👟 ${steps} Schritte synchronisiert!`);if(currentView==='dashboard')renderView('dashboard');},800);}

  S.chats=load('chats')||[];S.activeChatId=load('activeChatId')||null;
  if(S.chats.length===0)createNewChat('Willkommen zur KI Session!');
  if(!S.activeChatId||!getCurrentChat()){S.activeChatId=S.chats[0].id;saveChats();}

  const oldHistory=load('chatHistory');
  if(oldHistory&&Array.isArray(oldHistory)&&oldHistory.length>0){const currentChat=getCurrentChat();if(currentChat&&currentChat.messages.length===0){currentChat.messages=oldHistory.map(m=>({...m}));if(oldHistory[0]&&oldHistory[0].text){currentChat.title=(oldHistory[0].text||'').substring(0,30)+'...';}saveChats();}store('chatHistory',null);}

  function updateNavProfile(){
  const btn=document.getElementById('nav-profile-btn');
  if(!btn)return;
  const content=fbUser && !fbUser.isAnonymous && fbUser.photoURL 
    ? `<img src="${fbUser.photoURL}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);margin-bottom:2px">PROFIL`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>PROFIL`;
  btn.innerHTML=content;
}

// Auth state listener – runs after firebase is initialized
if (fbAuth) {
  fbAuth.onAuthStateChanged(user => {
    fbUser = user;
    updateNavProfile();
    if (user) {
        fbUID = user.uid;
        fbReady = true;
        console.log('Auth State:', user.isAnonymous ? 'Anonym' : 'Angemeldet als ' + (user.email || user.displayName), 'UID:', fbUID);
        syncFromFirebase(fbUID);

        document.getElementById('login-screen').style.display = 'none';
        S.profile = S.loadProfile();
        if (!S.profile) {
          document.getElementById('onboarding').style.display = 'flex';
          renderOnboarding();
        } else {
          document.getElementById('app').style.display = 'flex';
          applyTheme(S.profile);
          if (!window.booted) navigate('dashboard');
        }
        window.booted = true;

        if (user.isAnonymous) {
          setTimeout(() => showToast('🔥 Daten werden lokal gespeichert'), 1200);
        } else {
          setTimeout(() => showToast('☁️ Angemeldet – Daten werden synchronisiert'), 1200);
        }
      } else {
        fbReady = false;
        fbUID = null;
        window.booted = true;
        renderLoginScreen();
      }
    });
  } else {
    window.booted = true;
    S.profile = S.loadProfile();
    if (!S.profile) {
      document.getElementById('onboarding').style.display = 'flex';
      renderOnboarding();
    } else {
      document.getElementById('app').style.display = 'flex';
      applyTheme(S.profile);
      navigate('dashboard');
    }
  }

  if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(r=>console.log('SW aktiv',r.scope)).catch(e=>console.log('SW Info:',e));});}
}
