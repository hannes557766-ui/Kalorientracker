<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kalorify • Personal Coach Edition</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalorify">
<link rel="apple-touch-icon" href="https://placehold.co/192x192/AADF3C/000000.png?text=K">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- FIREBASE INTEGRATION -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#07070F;--card:#0F0F1A;--card2:#161625;--border:#1E1E32;
  --accent:#AADF3C;--accent-dim:rgba(170,223,60,0.12);--accent-glow:rgba(170,223,60,0.25);
  --text:#EFEFFA;--muted:#52526E;--dim:#8888A8;
  --protein:#60A5FA;--carbs:#FBBF24;--fat:#F87171;--success:#4ADE80;
  --shadow: none;
}

.theme-oled{--bg:#000000;--card:#000000;--card2:#111111;--border:#222222;--text:#FFFFFF;--muted:#666666;--dim:#999999;}
.theme-navy{--bg:#0B1120;--card:#111827;--card2:#1E293B;--border:#374151;--text:#F8FAFC;--muted:#94A3B8;--dim:#64748B;}
.theme-light{--bg:#F8F9FA;--card:#FFFFFF;--card2:#F1F3F5;--border:#E9ECEF;--text:#212529;--muted:#6C757D;--dim:#ADB5BD;--shadow: 0 8px 30px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.02);}
.theme-creamy{--bg:#FAF9F6;--card:#FFFFFF;--card2:#F2F0EA;--border:#E2DFD6;--text:#1D1C1A;--muted:#6A6863;--dim:#9A9893;--shadow: 0 4px 18px rgba(0, 0, 0, 0.04);}
.theme-mint{--bg:#F2FAF5;--card:#FFFFFF;--card2:#E6F3EA;--border:#CEE5D8;--text:#112117;--muted:#577464;--dim:#84A593;--shadow: 0 4px 16px rgba(11, 35, 21, 0.03);}
.theme-ice{--bg:#F0F4FA;--card:#FFFFFF;--card2:#E4EAF2;--border:#CBD5E4;--text:#111928;--muted:#546279;--dim:#8292AD;--shadow: 0 4px 16px rgba(13, 32, 54, 0.04);}
.theme-sepia{--bg:#F7F1E6;--card:#FEFCFA;--card2:#EEE5D6;--border:#DFD4C2;--text:#382B21;--muted:#806D5E;--dim:#AE9F90;--shadow: 0 4px 14px rgba(71, 43, 18, 0.05);}
.theme-pearl{--bg:#FBFBFD;--card:#FFFFFF;--card2:#F3F5FA;--border:#E3E7EF;--text:#1C2430;--muted:#667285;--dim:#97A3B5;--shadow: 0 4px 16px rgba(17, 24, 39, 0.04);}
.theme-cloud{--bg:#F6F8FC;--card:#FFFFFF;--card2:#EEF3FA;--border:#D9E2EE;--text:#172033;--muted:#66758C;--dim:#90A0B4;--shadow: 0 4px 16px rgba(20, 34, 66, 0.04);}
.theme-lavender{--bg:#F7F4FF;--card:#FFFFFF;--card2:#ECE7FA;--border:#D9D0EF;--text:#26213B;--muted:#6D678A;--dim:#9A94B3;--shadow: 0 4px 16px rgba(47, 24, 94, 0.04);}
.theme-sand{--bg:#FFF8EF;--card:#FFFFFF;--card2:#F6EBDD;--border:#E8D8C2;--text:#33261A;--muted:#7A6655;--dim:#B09B87;--shadow: 0 4px 16px rgba(88, 58, 28, 0.04);}

html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow:hidden;transition:background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1)}
h1,h2,h3{font-family:'DM Sans',sans-serif !important;letter-spacing:-0.04em !important;font-weight:800 !important;}
::-webkit-scrollbar{display:none}
input,textarea,button,select{font-family:inherit;outline:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{resize:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.skeleton{background:linear-gradient(90deg, var(--card2) 25%, var(--border) 50%, var(--card2) 75%);background-size:200% 100%;animation:skeletonLoading 1.5s infinite;border-radius:12px;}
@keyframes skeletonLoading{from{background-position:200% 0}to{background-position:-200% 0}}
.fade-up{animation:fadeUp .28s ease-out forwards}
.scale-in{animation:scaleIn .4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards}

#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;background:var(--bg)}
#views{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:90px;transition: opacity 0.2s}

#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:color-mix(in srgb, var(--card) 85%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:12px 0 24px;z-index:50;transition:background-color 0.3s;}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 14px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.5px;transition:all 0.2s;}
.nav-btn.active{color:var(--accent)}
.nav-btn:active{transform:scale(0.9);}
#add-fab{width:60px;height:60px;border-radius:22px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px var(--accent-glow);margin-top:-20px;flex-shrink:0;transition:all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);position:relative;z-index:100;}
#add-fab:active{transform:scale(.88) rotate(-8deg);}
#add-fab::after{content:'';position:absolute;inset:0;border-radius:22px;background:var(--accent);z-index:-1;opacity:0.4;animation:fabPulse 2s infinite;}
@keyframes fabPulse{0%{transform:scale(1);opacity:0.4}70%{transform:scale(1.4);opacity:0}100%{transform:scale(1.4);opacity:0}}

.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);box-shadow:var(--shadow)}
.card:active{transform: scale(0.98);}
.inp{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px 16px;color:var(--text);font-size:14px;width:100%;transition:all 0.2s;box-shadow:inset 0 1px 3px rgba(0,0,0,0.02)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.btn{border:none;border-radius:16px;cursor:pointer;font-weight:800;padding:16px 20px;background:var(--accent);color:#000;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow: 0 4px 12px var(--accent-glow);}
.btn:active{transform:scale(.96);box-shadow: 0 2px 6px var(--accent-glow);}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:active{transform:scale(.95);background:var(--border)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition: opacity 0.25s;}
.modal-box{background:color-mix(in srgb, var(--card) 98%, transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:32px 32px 0 0;padding:24px;width:100%;max-height:94vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;box-shadow:0 -10px 50px rgba(0,0,0,0.1);}

#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--success);color:#000;border-radius:20px;padding:12px 24px;font-weight:700;z-index:300;display:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 12px 36px rgba(0,0,0,0.4);animation:fadeUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);}
.pill{background:var(--card2);border:1px solid var(--border);border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;user-select:none;}
.pill:active{transform:scale(0.93);}
.pill.active{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 4px 12px var(--accent-glow);}
.chat-bubble{max-width:85%;padding:14px 18px;border-radius:24px;margin-bottom:8px;line-height:1.5;font-size:15px;transition:all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2);}
.chat-bubble.user{background:var(--accent);color:#000;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:0 4px 14px var(--accent-glow);font-weight:600;}
.chat-bubble.bot{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:var(--shadow);}
.onboarding-screen{display:flex;flex-direction:column;height:100vh;padding:20px;background:var(--bg);color:var(--text)}

.macro-bar{height:8px;background:var(--border);border-radius:9999px;overflow:hidden;margin-top:4px}
.macro-fill{height:100%;transition:width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)}
.bg-grad-prot{background: linear-gradient(90deg, var(--protein), #93C5FD);}
.bg-grad-carb{background: linear-gradient(90deg, var(--carbs), #FDE68A);}
.bg-grad-fat{background: linear-gradient(90deg, var(--fat), #FCA5A5);}

.compact-mode .card{padding:14px;border-radius:18px;}
.compact-mode .inp{padding:10px 14px;font-size:13px;border-radius:10px;}
.compact-mode .btn{padding:12px 16px;border-radius:12px;}
.compact-mode h1{font-size:24px;margin-bottom:12px;}

.color-dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2);box-shadow:0 4px 10px rgba(0,0,0,0.15);}
.color-dot:active{transform:scale(0.9);}
.color-dot.active{border-color:var(--text);transform:scale(1.15);}
.accent-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;justify-items:center;max-width:420px;margin:0 auto;}

.water-btn{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px 0;font-size:13px;font-weight:700;cursor:pointer;color:var(--text);flex:1;text-align:center;transition:all .15s}
.water-btn:active{transform:scale(0.94);background:var(--accent-dim);border-color:var(--accent)}

.weight-dot{cursor:pointer;transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);transform-origin:center;stroke:var(--card)}
.weight-dot:hover{transform:scale(1.5);}

.recipe-card{background:var(--card2);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:0;transition:transform 0.15s, box-shadow 0.2s;box-shadow:var(--shadow);}
.recipe-card:active{transform:scale(0.98);border-color:var(--accent);}
.recipe-card-img{width:80px;height:80px;object-fit:cover;flex-shrink:0;background:var(--border)}
.recipe-card-info{padding:12px;flex:1;min-width:0}
.recipe-card-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe-card-meta{font-size:12px;color:var(--muted);margin-top:4px}

.toggle-switch{position:relative;display:inline-block;width:52px;height:28px}
.toggle-switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:9999px;transition:.3s}
.slider:before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background:var(--text);border-radius:50%;transition:.3s}
input:checked + .slider{background:var(--accent)}
input:checked + .slider:before{transform:translateX(24px);background:#000}

.add-tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--card2);border-radius:16px;padding:6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.add-tab{flex-shrink:0;border:none;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:var(--muted);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.add-tab.active{background:var(--accent);color:#000;box-shadow:0 4px 10px var(--accent-glow);}
.add-tab:active:not(.active){transform:scale(0.95);background:var(--border)}

.search-row{display:flex;gap:8px;margin-bottom:12px}
.food-result-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card2);border:1px solid var(--border);border-radius:16px;margin-bottom:8px;cursor:pointer;transition:transform .15s, border-color .15s;box-shadow:var(--shadow)}
.food-result-item:active{transform:scale(0.98);border-color:var(--accent)}
.food-result-img{width:54px;height:54px;border-radius:14px;object-fit:cover;background:var(--border);flex-shrink:0}
.food-result-info{flex:1;min-width:0}
.food-result-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-result-brand{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-result-kcal{font-size:14px;color:var(--accent);font-weight:800;flex-shrink:0;text-align:right}
.food-loading{text-align:center;padding:30px;color:var(--muted);animation:pulse 1.2s infinite;font-weight:600;}
.food-empty{text-align:center;padding:40px 20px;color:var(--muted)}
.food-empty-icon{font-size:48px;margin-bottom:12px}

.amount-header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.amount-product-img{width:68px;height:68px;border-radius:18px;object-fit:cover;background:var(--card2);border:1px solid var(--border);flex-shrink:0}
.amount-product-name{font-weight:800;font-size:18px;line-height:1.2}
.amount-product-brand{font-size:14px;color:var(--muted);margin-top:4px}
.amount-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.amount-chip{background:var(--card2);border:1px solid var(--border);border-radius:9999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.amount-chip:active{transform:scale(0.93);}
.amount-chip.active{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 4px 10px var(--accent-glow);}
.macro-preview{background:var(--card2);border-radius:16px;padding:18px;margin:16px 0}
.macro-preview-title{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;text-align:center}
.macro-preview-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;text-align:center}
.macro-preview-val{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.macro-preview-label{font-size:11px;color:var(--muted);margin-top:2px}
.amount-input-row{display:flex;gap:8px;align-items:center}
.amount-input-row input{flex:1;font-size:20px;font-weight:800;text-align:center;letter-spacing:1px}

.barcode-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--card2);border-radius:14px;padding:4px}
.barcode-tab{flex:1;border:none;border-radius:11px;padding:10px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:var(--muted);transition:all .2s}
.barcode-tab:active:not(.active){transform:scale(0.95);background:var(--border)}
.barcode-tab.active{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow);}
#barcode-reader-container{border-radius:20px;overflow:hidden;background:#000;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,0.4);}
#barcode-reader-container video{width:100%!important;object-fit:cover;border-radius:20px;}
#barcode-reader-container img{display:none!important}
#barcode-reader{width:100%}
.barcode-status{text-align:center;padding:12px;font-size:14px;font-weight:600;color:var(--muted)}
.barcode-status.found{color:var(--success)}
.barcode-status.error{color:var(--fat)}

.chat-list-item{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--card);border-radius:20px;margin-bottom:12px;cursor:pointer;border:2px solid transparent;transition:all 0.2s;box-shadow:var(--shadow);}
.chat-list-item:active{transform:scale(0.98);background:var(--card2);}
.chat-list-item.active{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 8px 24px var(--accent-glow);}

/* LOGIN SCREEN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px;background:var(--bg);color:var(--text);text-align:center;position:relative;overflow:hidden;}
.login-screen::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%, var(--accent-dim) 0%, transparent 50%),radial-gradient(circle at 70% 80%, var(--accent-dim) 0%, transparent 50%);opacity:0.3;animation:pulse 8s ease-in-out infinite;pointer-events:none;}
.login-logo{font-size:52px;margin-bottom:12px}
.login-title{font-size:32px;font-weight:800;margin-bottom:6px;letter-spacing:-0.03em}
.login-subtitle{color:var(--muted);font-size:15px;margin-bottom:32px;font-weight:500}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.login-btn{width:100%;border:none;border-radius:14px;cursor:pointer;font-weight:700;padding:14px 20px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.15s;margin-bottom:10px;font-family:'DM Sans',sans-serif}
.login-btn:active{transform:scale(0.97)}
.login-btn-google{background:#FFFFFF;color:#1A1A1A;border:1px solid var(--border)}
.login-btn-google:hover{background:#F5F5F5}
.login-btn-email{background:var(--accent);color:#000}
.login-btn-email:hover{opacity:0.9}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.login-btn.success{background:var(--success)!important;color:#000!important;animation:successPulse 0.6s ease-out}
.login-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px;font-weight:600}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-input{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px 16px;color:var(--text);font-size:14px;width:100%;transition:all 0.2s;font-family:'DM Sans',sans-serif;outline:none}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.login-link{color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;margin-top:8px}
.login-link:hover{text-decoration:underline}
.login-error{background:rgba(248,113,113,0.1);border:1px solid var(--fat);border-radius:12px;padding:10px 14px;color:var(--fat);font-size:13px;font-weight:600;margin-bottom:12px;display:none}
.login-skip{color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;margin-top:20px;padding:8px 16px;border-radius:10px;transition:all 0.2s}
.login-skip:hover{color:var(--text);background:var(--card2)}
.auth-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:12px}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app" style="display:none">
  <div id="views"></div>
  <nav id="nav">
    <button class="nav-btn active" data-view="dashboard" onclick="navigate('dashboard')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      HEUTE
    </button>
    <button class="nav-btn" data-view="chat" onclick="navigate('chat')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      COACH
    </button>
    <button id="add-fab" onclick="openAddModal()">

// ====================== AUTH STATE & SYNC ======================
function syncFromFirebase(uid) {
  if (!fbDB || !uid) return;
  const userRef = fbDB.ref('users/' + uid);
  userRef.once('value').then(snap => {
    const data = snap.val() || {};
    fbSyncing = true;
    Object.entries(data).forEach(([k, v]) => {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
    });
    fbSyncing = false;
  });
  userRef.on('value', snap => {
    if (!snap.exists()) return;
    const data = snap.val() || {};
    fbSyncing = true;
    Object.entries(data).forEach(([k, v]) => {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
    });
    fbSyncing = false;
    if (window.booted && typeof renderView === 'function') {
      S.profile = S.loadProfile();
      renderView(currentView);
    }
  });
}

// Migrate anonymous data to authenticated account
function migrateAnonymousData(oldUid, newUid) {
  if (!fbDB || !oldUid || !newUid || oldUid === newUid) return Promise.resolve();
  const oldRef = fbDB.ref('users/' + oldUid);
  return oldRef.once('value').then(snap => {
    if (snap.exists()) {
      const data = snap.val();
      return fbDB.ref('users/' + newUid).update(data).then(() => {
        return oldRef.remove();
      });
    }
  }).catch(e => console.warn('Migration error:', e));
}

function isAnonymousUser() {
  return fbUser && fbUser.isAnonymous;
}

function getUserDisplayName() {
  if (!fbUser) return '';
  if (fbUser.displayName) return fbUser.displayName;
  if (fbUser.email) return fbUser.email.split('@')[0];
  return 'Nutzer';
}

function getUserEmail() {
  if (!fbUser || !fbUser.email) return '';
  return fbUser.email;
}

function getUserPhotoURL() {
  if (!fbUser || !fbUser.photoURL) return '';
  return fbUser.photoURL;
}

        Mit Google anmelden

}

let authMode = 'register'; // 'register' or 'login'

function toggleAuthMode() {
  authMode = authMode === 'register' ? 'login' : 'register';
  const nameField = document.getElementById('auth-name');
  const submitBtn = document.getElementById('auth-submit-btn');
  const toggleLink = document.getElementById('auth-toggle-link');
  const forgotLink = document.getElementById('auth-forgot-link');
  const errorEl = document.getElementById('login-error');

  if (errorEl) errorEl.style.display = 'none';

  if (authMode === 'login') {
    if (nameField) nameField.style.display = 'none';
    if (submitBtn) submitBtn.textContent = 'Einloggen';
    if (toggleLink) toggleLink.textContent = 'Noch kein Konto? Jetzt registrieren →';
    if (forgotLink) forgotLink.style.display = 'block';
  } else {
    if (nameField) nameField.style.display = 'block';
    if (submitBtn) submitBtn.textContent = 'Konto erstellen';
    if (toggleLink) toggleLink.textContent = 'Bereits ein Konto? Hier einloggen →';
    if (forgotLink) forgotLink.style.display = 'none';
  }
}

async function forgotPassword() {
  const email = document.getElementById('auth-email')?.value?.trim();
  if (!email) {
    showLoginError('Bitte zuerst deine E-Mail-Adresse eingeben.');
    return;
  }
  try {
    await fbAuth.sendPasswordResetEmail(email);
    showLoginError(''); // Clear error
    const errorEl = document.getElementById('login-error');
    if (errorEl) {
      errorEl.textContent = '📧 E-Mail zum Zurücksetzen wurde gesendet! Prüfe dein Postfach.';
      errorEl.style.display = 'block';
      errorEl.style.background = 'rgba(74, 222, 128, 0.1)';
      errorEl.style.borderColor = 'var(--success)';
      errorEl.style.color = 'var(--success)';
    }
  } catch (e) {
    showLoginError('Fehler: ' + (e.message || 'E-Mail konnte nicht gesendet werden.'));
  }
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

async function loginWithGoogle() {
  if (!fbAuth || !googleProvider) return showLoginError('Firebase nicht initialisiert.');
  const btn = document.querySelector('.login-btn-google');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span style="display:inline-block;animation:spin 1s linear infinite;margin-right:6px">⏳</span> Verbinde...'; }
  try {
    const oldUID = fbUID;
    const result = await fbAuth.signInWithPopup(googleProvider);
    fbUser = result.user;
    fbUID = fbUser.uid;
    fbReady = true;

    // Migrate anonymous data if existed
    if (oldUID && oldUID !== fbUID) {
      await migrateAnonymousData(oldUID, fbUID);
    }

    syncFromFirebase(fbUID);
    if (btn) { btn.classList.add('success'); btn.innerHTML = '✓ Angemeldet!'; }
    setTimeout(() => afterLogin(), 600);
  } catch (e) {
    console.error('Google Login Error:', e);
    if (e.code === 'auth/popup-closed-by-user') return;
    if (e.code === 'auth/popup-blocked') showLoginError('Pop-up wurde blockiert. Bitte erlaube Pop-ups für diese Seite.');
    else showLoginError('Google-Login fehlgeschlagen: ' + e.message);
  }
  if (btn) { btn.disabled = false; btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Mit Google anmelden`; }
}

async function handleEmailAuth() {
  const email = document.getElementById('auth-email')?.value?.trim();
  const password = document.getElementById('auth-password')?.value;
  const name = document.getElementById('auth-name')?.value?.trim();

  if (!email || !password) return showLoginError('Bitte E-Mail und Passwort eingeben.');
  if (password.length < 6) return showLoginError('Passwort muss mind. 6 Zeichen lang sein.');
  if (authMode === 'register' && !name) return showLoginError('Bitte einen Namen eingeben.');

  const btn = document.getElementById('auth-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Bitte warten...'; }

  try {
    const oldUID = fbUID;
    let result;

    if (authMode === 'register') {
      result = await fbAuth.createUserWithEmailAndPassword(email, password);
      // Set display name
      await result.user.updateProfile({ displayName: name });
    } else {
      result = await fbAuth.signInWithEmailAndPassword(email, password);
    }

    fbUser = result.user;
    fbUID = fbUser.uid;
    fbReady = true;

    // Migrate anonymous data
    if (oldUID && oldUID !== fbUID) {
      await migrateAnonymousData(oldUID, fbUID);
    }

    syncFromFirebase(fbUID);
    if (btn) { btn.classList.add('success'); btn.textContent = '✓ Erfolgreich!'; }
    setTimeout(() => afterLogin(), 600);
  } catch (e) {
    console.error('Email Auth Error:', e);
    const errorMap = {
      'auth/email-already-in-use': 'Diese E-Mail ist bereits registriert. Bitte einloggen.',
      'auth/invalid-email': 'Ungültige E-Mail-Adresse.',
      'auth/weak-password': 'Passwort ist zu schwach.',
      'auth/user-not-found': 'Kein Konto mit dieser E-Mail gefunden.',
      'auth/wrong-password': 'Falsches Passwort.',
      'auth/invalid-credential': 'E-Mail oder Passwort ist falsch.',
      'auth/too-many-requests': 'Zu viele Versuche. Bitte später erneut versuchen.',
    };
    showLoginError(errorMap[e.code] || 'Fehler: ' + e.message);
  }

  if (btn) { btn.disabled = false; btn.textContent = authMode === 'register' ? 'Konto erstellen' : 'Einloggen'; }
}

function skipLogin() {
  // Sign in anonymously
  if (fbAuth) {
    fbAuth.signInAnonymously().catch(err => console.warn('Anon Auth:', err.message));
  }
  document.getElementById('login-screen').style.display = 'none';
  afterLogin();
}

function afterLogin() {
  document.getElementById('login-screen').style.display = 'none';
  S.profile = S.loadProfile();
  if (!S.profile) {
    document.getElementById('onboarding').style.display = 'flex';
    renderOnboarding();
  } else {
    document.getElementById('app').style.display = 'flex';
    applyTheme(S.profile);
    navigate('dashboard');
    
    // Personalisierte Willkommens-Nachricht
    if (fbUser && !fbUser.isAnonymous && fbUser.displayName) {
      const hour = new Date().getHours();
      let greeting = 'Hallo';
      if (hour < 12) greeting = 'Guten Morgen';
      else if (hour < 18) greeting = 'Guten Tag';
      else greeting = 'Guten Abend';
      setTimeout(() => showToast(`${greeting}, ${fbUser.displayName.split(' ')[0]}! 👋`), 600);
    }
  }
}

function logoutUser() {
  if (!fbAuth) return;
  if (!confirm('Möchtest du dich wirklich abmelden? Deine Daten bleiben in der Cloud gespeichert.')) return;
  localStorage.setItem('kalorify_logged_out', 'true');
  fbAuth.signOut().then(() => {
    fbUser = null;
    fbUID = null;
    fbReady = false;
    showToast('Abgemeldet ✓');
    setTimeout(() => location.reload(), 800);
  });
}

// ====================== STORAGE ======================
function load(k){try{return localStorage.getItem(k)?JSON.parse(localStorage.getItem(k)):null;}catch(e){return null;}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} if(fbReady && fbUID && !fbSyncing && fbDB){ try{ fbDB.ref('users/'+fbUID+'/'+k).set(v); }catch(e){ console.warn('Firebase sync error', e); } }}

const S={
  profile:null,chats:[],activeChatId:null,currentDate:today(),
  get dayKey(){return 'log-'+this.currentDate;},
  get dayLog(){return load(this.dayKey)||{meals:[],activities:[],steps:0,sleep:{hours:null}};},
  saveDayLog(log){store(this.dayKey,log);},
  get geminiKey(){return load('geminiApiKey')||'';},
  setGeminiKey(k){store('geminiApiKey',k);},
  loadProfile(){return load('profile');},
  saveProfile(p){const n=normalizeProfile(p);store('profile',n);this.profile=n;},
  get waterKey(){return 'water-'+this.currentDate;},
  get todayWater(){return load(this.waterKey)||0;},
  addWater(ml){const v=this.todayWater+ml;store(this.waterKey,v);return v;},
  setWater(ml){store(this.waterKey,ml);},
  logWeight(kg){const logs=load('weightLog')||[];const entry={date:this.currentDate,kg};const idx=logs.findIndex(e=>e.date===this.currentDate);if(idx>=0)logs[idx]=entry;else logs.push(entry);store('weightLog',logs);},
  getWeightLog(){return load('weightLog')||[];},
  get favorites(){return load('favorites')||[];},
  saveFavorite(food){const favs=this.favorites;const nameToMatch=getProductName(food);const existingIdx=favs.findIndex(f=>getProductName(f)===nameToMatch);if(existingIdx>=0){favs[existingIdx]=food;}else{favs.push({...food,_favId:uid()});}store('favorites',favs);},
  removeFavorite(id){store('favorites',this.favorites.filter(f=>f._favId!==id));}
};

function today(){return new Date().toISOString().split('T')[0];}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}

// ====================== MULTI-CHAT ======================
function saveChats(){store('chats',S.chats);store('activeChatId',S.activeChatId);}
function createNewChat(title='Neuer Chat'){const newChat={id:uid(),title,messages:[],created:Date.now()};S.chats.unshift(newChat);S.activeChatId=newChat.id;saveChats();return newChat;}
function getCurrentChat(){return S.chats.find(c=>c.id===S.activeChatId);}
function getCurrentMessages(){const chat=getCurrentChat();return chat?chat.messages:[];}
function setCurrentMessages(newMsgs){const chat=getCurrentChat();if(chat){chat.messages=[...newMsgs];saveChats();}}
function switchToChat(id){S.activeChatId=id;saveChats();}
function deleteChat(id){if(!confirm('Diesen Chat wirklich löschen?'))return;S.chats=S.chats.filter(c=>c.id!==id);if(S.activeChatId===id){if(S.chats.length>0){S.activeChatId=S.chats[0].id;}else{createNewChat();}}saveChats();closeModal();renderView('chat');}
function renameChat(id){const chat=S.chats.find(c=>c.id===id);if(!chat)return;const newTitle=prompt('Neuer Chat-Titel:',chat.title);if(newTitle&&newTitle.trim()){chat.title=newTitle.trim();saveChats();closeModal();renderView('chat');}}

function openChatList(){
  const mc=document.getElementById('modal-container');
  let listHTML='';
  S.chats.forEach(chat=>{
    const isActive=chat.id===S.activeChatId;
    const preview=chat.messages.length>0?(chat.messages[chat.messages.length-1].text||'').substring(0,45)+((chat.messages[chat.messages.length-1].text||'').length>45?'...':''):'Noch keine Nachrichten';
    listHTML+=`<div onclick="switchToChat('${chat.id}');closeModal();renderView('chat');" class="chat-list-item ${isActive?'active':''}"><div style="flex:1"><div style="font-weight:700;font-size:15px">${chat.title}</div><div style="font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px">${preview}</div><div style="font-size:11px;color:var(--dim);margin-top:8px">${new Date(chat.created).toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</div></div><div style="display:flex;gap:12px;margin-left:12px;border-left:1px solid var(--border);padding-left:12px;align-items:center;"><span onclick="event.stopImmediatePropagation();renameChat('${chat.id}');" style="font-size:16px;cursor:pointer;padding:8px;background:var(--card2);border-radius:10px">✏️</span><span onclick="event.stopImmediatePropagation();deleteChat('${chat.id}');" style="color:var(--fat);font-size:16px;cursor:pointer;padding:8px;background:var(--card2);border-radius:10px">🗑️</span></div></div>`;
  });
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box scale-in"><h2 style="margin-bottom:20px">💬 Deine Chats (${S.chats.length})</h2><div style="max-height:55vh;overflow-y:auto;padding-right:4px">${listHTML||'<div style="padding:40px;text-align:center;color:var(--muted)">Noch keine Chats!</div>'}</div><button onclick="createNewChatAndRender();closeModal()" class="btn" style="width:100%;margin-top:20px">+ Neuer Chat</button></div></div>`;
}
function createNewChatAndRender(){createNewChat();closeModal();renderView('chat');}

// ====================== THEME ======================
function applyTheme(opts){
  if(typeof opts==='string')opts={theme:opts};
  if(!opts)opts={theme:'light',accentColor:'lime',compactMode:false};
  const theme=opts.theme||'light';
  document.documentElement.className='';
  if(theme!=='dark')document.documentElement.classList.add(`theme-${theme}`);
  if(opts.compactMode)document.documentElement.classList.add('compact-mode');
  const COLORS={
    lime:{accent:'#AADF3C',dim:'rgba(170,223,60,0.12)',glow:'rgba(170,223,60,0.25)'},
    blue:{accent:'#60A5FA',dim:'rgba(96,165,250,0.12)',glow:'rgba(96,165,250,0.25)'},
    teal:{accent:'#2DD4BF',dim:'rgba(45,212,191,0.12)',glow:'rgba(45,212,191,0.25)'},
    purple:{accent:'#A78BFA',dim:'rgba(167,139,250,0.12)',glow:'rgba(167,139,250,0.25)'},
    pink:{accent:'#F472B6',dim:'rgba(244,114,182,0.12)',glow:'rgba(244,114,182,0.25)'},
    rose:{accent:'#FB7185',dim:'rgba(251,113,133,0.12)',glow:'rgba(251,113,133,0.25)'},
    orange:{accent:'#FB923C',dim:'rgba(251,146,60,0.12)',glow:'rgba(251,146,60,0.25)'},
    gold:{accent:'#FBBF24',dim:'rgba(251,191,36,0.12)',glow:'rgba(251,191,36,0.25)'},
    indigo:{accent:'#818CF8',dim:'rgba(129,140,248,0.12)',glow:'rgba(129,140,248,0.25)'},
    cyan:{accent:'#22D3EE',dim:'rgba(34,211,238,0.12)',glow:'rgba(34,211,238,0.25)'},
    emerald:{accent:'#34D399',dim:'rgba(52,211,153,0.12)',glow:'rgba(52,211,153,0.25)'},
    red:{accent:'#F87171',dim:'rgba(248,113,113,0.12)',glow:'rgba(248,113,113,0.25)'}
  };
  const c=COLORS[opts.accentColor||'lime']||COLORS.lime;
  document.documentElement.style.setProperty('--accent',c.accent);
  document.documentElement.style.setProperty('--accent-dim',c.dim);
  document.documentElement.style.setProperty('--accent-glow',c.glow);
}

function updateAndSaveTheme(){
  const themeSel=document.getElementById('prof-theme-sel').value;
  const isCompact=document.getElementById('prof-compact-toggle').checked;
  const color=document.getElementById('prof-color').value;
  const opts={theme:themeSel,compactMode:isCompact,accentColor:color};
  applyTheme(opts);
  if(S.profile){S.profile.theme=opts.theme;S.profile.compactMode=opts.compactMode;S.profile.accentColor=opts.accentColor;S.saveProfile(S.profile);}
}

function selectColor(c,evt){
  document.getElementById('prof-color').value=c;
  document.querySelectorAll('.color-dot').forEach(el=>el.classList.remove('active'));
  const target=evt?.currentTarget||evt?.target||window.event?.target;
  if(target)target.classList.add('active');
  updateAndSaveTheme();
}

function calcBaseTDEE(p){
  if(!p?.weight)return{calories:2800,protein:140,carbs:330,fat:80};
  const bmr=p.gender==='female'?447.593+9.247*p.weight+3.098*p.height-4.33*p.age:88.362+13.397*p.weight+4.799*p.height-5.677*p.age;
  const cal=Math.round(bmr*(ACT[p.activityLevel]?.mult||1.55)+(GOAL_ADJ[p.goal]||0));
  const prot=Math.round(p.weight*1.8);
  const fat=Math.round(cal*0.25/9);
  const carbs=Math.round((cal-prot*4-fat*9)/4);
  return{calories:Math.max(1200,cal),protein:prot,carbs:Math.max(0,carbs),fat};
}

function getDynamicTargets(p,dayLog){
  const base=calcBaseTDEE(p);
  let addKcal=0,addP=0,addC=0,addF=0;
  const stepKcal=Math.round((dayLog.steps||0)*0.04);
  addKcal+=stepKcal;addC+=Math.round(stepKcal*0.5/4);
  (dayLog.activities||[]).forEach(a=>{addKcal+=(a.kcal||0);addP+=(a.protein||0);addC+=(a.carbs||0);addF+=(a.fat||0);});
  return{calories:base.calories+addKcal,protein:base.protein+addP,carbs:base.carbs+addC,fat:base.fat+addF,addedKcal:addKcal};
}

function sumMeals(meals=[]){
  return meals.reduce((a,m)=>({calories:a.calories+(m.calories||0),protein:a.protein+(m.protein||0),carbs:a.carbs+(m.carbs||0),fat:a.fat+(m.fat||0)}),{calories:0,protein:0,carbs:0,fat:0});
}

function localFoodAnalyze(input){
  const lower=input.toLowerCase().trim();
  if(LOCAL_FOODS[lower])return LOCAL_FOODS[lower];
  let bestMatch=null,bestLen=0;
  for(const key of Object.keys(LOCAL_FOODS)){if(lower.includes(key)&&key.length>bestLen){bestMatch=key;bestLen=key.length;}}
  if(bestMatch)return LOCAL_FOODS[bestMatch];
  const gramMatch=lower.match(/(\d+)\s*g\s+(.+)/);
  if(gramMatch){const grams=parseInt(gramMatch[1]);const food=localFoodAnalyze(gramMatch[2].trim());if(food&&food.calories>0){const f=grams/100;return{name:`${food.name} (${grams}g)`,calories:Math.round(food.calories*f),protein:Math.round(food.protein*f*10)/10,carbs:Math.round(food.carbs*f*10)/10,fat:Math.round(food.fat*f*10)/10};}}
  const singular=lower.replace(/en$/,'').replace(/e$/,'').replace(/s$/,'');
  if(singular!==lower&&LOCAL_FOODS[singular])return LOCAL_FOODS[singular];
  return null;
}

function buildDayContext(){
  const log=S.dayLog;
  const targets=getDynamicTargets(S.profile,log);
  const totals=sumMeals(log.meals);
  let wCal=0,dCount=0;
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const l=load('log-'+d.toISOString().split('T')[0]);if(l&&l.meals&&l.meals.length){wCal+=sumMeals(l.meals).calories;dCount++;}}
  const avgCal=dCount?Math.round(wCal/dCount):0;
  const weekInfo=`Wochen-Durchschnitt (letzte 7 Tage): ${avgCal} kcal/Tag.`;
  let activityText='';
  if(log.steps)activityText+=`\n- ${log.steps} Schritte gegangen`;
  if(log.activities&&log.activities.length){activityText+=log.activities.map(a=>`\n- ${a.name} (+${a.kcal} kcal)`).join('');}
  if(!log.meals.length)return`Der Nutzer hat heute (${S.currentDate}) noch nichts gegessen.\n\nAktivität heute:${activityText||' Keine'}\n\n${weekInfo}`;
  const mealList=log.meals.map(m=>`- ${m.name} (${MEAL_TYPES.find(t=>t.id===m.mealType)?.label||'Mahlzeit'}): ${m.calories} kcal | P:${m.protein}g KH:${m.carbs}g F:${m.fat}g`).join('\n');
  return`${weekInfo}\n\nAktivitäten heute (${S.currentDate}):${activityText||' Keine'}\n\nHeutige Mahlzeiten:\n${mealList}\n\nSumme heute: ${totals.calories} kcal | Protein: ${totals.protein}g | KH: ${totals.carbs}g | Fett: ${totals.fat}g\nTages-Ziele (inkl. Sport): ${targets.calories} kcal | P: ${targets.protein}g | KH: ${targets.carbs}g | F: ${targets.fat}g\nRestkapazität: ${targets.calories-totals.calories} kcal | P: ${targets.protein-totals.protein}g | KH: ${targets.carbs-totals.carbs}g | F: ${targets.fat-totals.fat}g`;
}

// -- CLAUDE --
async function callClaude(messages,systemPrompt,maxTokens=800){
  const key=getClaudeKey();
  if(!key)throw new Error('Kein Claude API-Key hinterlegt.');
  const body={model:'claude-3-5-sonnet-20241022',max_tokens:maxTokens,system:systemPrompt||undefined,messages};
  if(!systemPrompt)delete body.system;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(!r.ok){if(r.status===429)throw new Error('Claude: Rate-Limit – kurz warten');if(r.status===401)throw new Error('Claude: Ungültiger API-Key');throw new Error(`Claude Fehler (${r.status})`);}
  const data=await r.json();
  return(data.content?.[0]?.text||'').trim();
}

async function claudeChatCall(userMessage,systemPrompt){
  const history=getCurrentMessages()||[];
  const messages=history.map(msg=>({role:msg.role==='user'?'user':'assistant',content:msg.text}));
  messages.push({role:'user',content:userMessage});
  return await callClaude(messages,systemPrompt,800);
}

// -- GROQ --
async function callGroq(messages){
  const key=getGroqKey();
  if(!key)throw new Error('Kein Groq API-Key.');
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages,max_tokens:600,temperature:0.7})});
  if(!r.ok)throw new Error(r.status===401?'Groq: Ungültiger API-Key':`Groq Fehler (${r.status})`);
  const data=await r.json();
  return data.choices?.[0]?.message?.content||'';
}

async function groqChatCall(userMessage,systemPrompt){
  const history=getCurrentMessages()||[];
  const messages=[{role:'system',content:systemPrompt}];
  history.forEach(msg=>messages.push({role:msg.role==='user'?'user':'assistant',content:msg.text}));
  messages.push({role:'user',content:userMessage});
  return await callGroq(messages);
}

async function callGemini(contents){
  const key=S.geminiKey;
  if(!key)throw new Error('Kein Gemini API-Key.');
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents})});
  if(!r.ok){const errText=await r.text().catch(()=>'');const isQuota=errText.includes('quota')||errText.includes('rate')||r.status===429;throw new Error(isQuota?'Gemini Rate-Limit':`Gemini Fehler (${r.status})`);}
  const data=await r.json();
  return(data.candidates?.[0]?.content?.parts?.[0]?.text||'').replace(/`json\n?|\n?`/g,'').trim();
}

  const contents=[];
  contents.push({role:'user',parts:[{text:systemPrompt}]});

      const dur=parseInt(text.match(/(\d+)/)?.[1]||30);

      else if(lower.includes('kraft')||lower.includes('gym')){kcal=Math.round(dur*5);name='Krafttraining';}
      else if(lower.includes('yoga')){kcal=Math.round(dur*3);name='Yoga';}
      else if(lower.includes('hiit')){kcal=Math.round(dur*10);name='HIIT';}
      else if(lower.includes('spazier')||lower.includes('gehen')){kcal=Math.round(dur*4);name='Spazieren';}

      log.activities.push({name,kcal,id:uid()});S.saveDayLog(log);

async function fetchWithRetry(url,opts={},maxRetries=3,timeoutMs=9000){
  let lastErr;
  for(let attempt=0;attempt<maxRetries;attempt++){
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
    try{const r=await fetch(url,{...opts,signal:ctrl.signal});clearTimeout(timer);if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json();}
    catch(e){clearTimeout(timer);lastErr=e;if(attempt<maxRetries-1)await new Promise(res=>setTimeout(res,900*(attempt+1)));}
  }
  throw lastErr||new Error('Netzwerkfehler');
}

async function _searchOFF(query){
  const url=`${OFF_BASE}/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20&lc=de&fields=${OFF_FIELDS}`;

  let products=(data.products||[]).filter(p=>(p.product_name||p.product_name_de)&&getKcalPer100(p)>0).map(p=>({...p,_source:'off',_srcLabel:'OFF'}));
  if(products.length<5){const enQ=translateQuery(query);if(enQ!==query){const url2=`${OFF_BASE}/cgi/search.pl?search_terms=${encodeURIComponent(enQ)}&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`;try{const data2=await fetchWithRetry(url2);const extra=(data2.products||[]).filter(p=>(p.product_name||p.product_name_de)&&getKcalPer100(p)>0).map(p=>({...p,_source:'off',_srcLabel:'OFF'}));products=[...products,...extra];}catch(e){}}}

}

function _titleCase(s){return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}

async function _searchAPILayer(query){

let _fsToken=null,_fsTokenExp=0;
async function _getFSToken(){
  if(_fsToken&&Date.now()<_fsTokenExp)return _fsToken;
  const id=getFSClientId();const sec=getFSSecret();if(!id||!sec)return null;
  const r=await fetch('https://oauth.fatsecret.com/connect/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=client_credentials&client_id=${encodeURIComponent(id)}&client_secret=${encodeURIComponent(sec)}&scope=basic`});
  if(!r.ok)return null;const d=await r.json();_fsToken=d.access_token;_fsTokenExp=Date.now()+(d.expires_in||3600)*1000-60000;return _fsToken;
}

async function _searchFatSecret(query){
  const token=await _getFSToken();if(!token)return[];
  const enQuery=translateQuery(query);
  const url=`https://platform.fatsecret.com/rest/server.api?method=foods.search&search_expression=${encodeURIComponent(enQuery)}&format=json&max_results=10`;
  let data;try{data=await fetchWithRetry(url,{headers:{'Authorization':'Bearer '+token}});}catch(e){return[];}
  const foods=data.foods?.food||[];
  return(Array.isArray(foods)?foods:[foods]).map(f=>{const desc=f.food_description||'';const cal=parseFloat(desc.match(/Calories:\s*([\d.]+)/i)?.[1]||0);const fat=parseFloat(desc.match(/Fat:\s*([\d.]+)g/i)?.[1]||0);const carbs=parseFloat(desc.match(/Carbs:\s*([\d.]+)g/i)?.[1]||0);const prot=parseFloat(desc.match(/Protein:\s*([\d.]+)g/i)?.[1]||0);return{product_name:f.food_name||'Unbekannt',brands:f.brand_name||'FatSecret',image_thumb_url:'',quantity:f.food_type||'',serving_quantity:100,serving_size:null,_source:'fs',_srcLabel:'FS',nutriments:{'energy-kcal_100g':Math.round(cal),'proteins_100g':Math.round(prot*10)/10,'carbohydrates_100g':Math.round(carbs*10)/10,'fat_100g':Math.round(fat*10)/10}};}).filter(p=>getKcalPer100(p)>0);
}

function _sortByRelevance(results,query){
  const q=query.toLowerCase().trim();
  return results.slice().sort((a,b)=>{
    const na=getProductName(a).toLowerCase();const nb=getProductName(b).toLowerCase();
    const score=n=>{if(n===q)return 0;if(n.startsWith(q+' ')||n.startsWith(q+','))return 1;if(n.startsWith(q))return 2;if(n.includes(q))return 3;return 4+n.length*0.01;};
    return score(na)-score(nb);
  });
}

async function searchFoodDB(query){
  const src=getDBSource();let results=[];
  if(src==='off'){results=await _searchOFF(query);}
  else if(src==='usda'){results=await _searchUSDA(query);}
  else if(src==='apilayer'){results=await _searchAPILayer(query);}
  else if(src==='fs'){results=await _searchFatSecret(query);}
  else{
    const hasAPILayer=!!getAPILayerKey();const hasFS=!!(getFSClientId()&&getFSSecret());
    const all=await Promise.allSettled([_searchOFF(query),_searchUSDA(query),hasAPILayer?_searchAPILayer(query):Promise.resolve([]),hasFS?_searchFatSecret(query):Promise.resolve([])]);
    const[offR,usdaR,apiLayerR,fsR]=all.map(r=>r.status==='fulfilled'?r.value:[]);
    const maxLen=Math.max(usdaR.length,apiLayerR.length,offR.length,fsR.length);
    for(let i=0;i<maxLen;i++){if(i<usdaR.length)results.push(usdaR[i]);if(i<apiLayerR.length)results.push(apiLayerR[i]);if(i<offR.length)results.push(offR[i]);if(i<fsR.length)results.push(fsR[i]);}
  }
  return _sortByRelevance(results,query);
}

// ====================== FIX #2: STREAK (counts water/weight/sleep too) ======================
function calcStreak(){
  let streak=0;
  const d=new Date();
  // Check if today has ANY activity
  function dayHasActivity(dateStr){
    const log=load('log-'+dateStr);
    if(log&&log.meals&&log.meals.length>0)return true;
    if(load('water-'+dateStr)>0)return true;
    const wLog=load('weightLog')||[];
    if(wLog.some(e=>e.date===dateStr))return true;
    if(log&&log.sleep&&log.sleep.hours!==null&&log.sleep.hours!==undefined)return true;
    return false;
  }
  if(dayHasActivity(today()))streak=1;
  const check=new Date();
  for(let i=1;i<=90;i++){
    check.setDate(check.getDate()-1);
    const key=check.toISOString().split('T')[0];
    if(dayHasActivity(key))streak++;
    else break;
  }
  return streak;
}

function getWeeklyCalories(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const key='log-'+d.toISOString().split('T')[0];
    const data=load(key);
    const cal=data&&data.meals?sumMeals(data.meals).calories:0;
    days.push({label:d.toLocaleDateString('de-DE',{weekday:'short'}),cal,isToday:i===0});
  }
  return days;
}

window.copyYesterday=function(mealType){
  const d=new Date(S.currentDate);d.setDate(d.getDate()-1);
  const yLog=load('log-'+d.toISOString().split('T')[0]);
  if(!yLog||!yLog.meals||!yLog.meals.length)return showToast('Keine Einträge von gestern gefunden.');
  const toCopy=yLog.meals.filter(m=>m.mealType===mealType);
  if(!toCopy.length)return showToast('Keine Mahlzeiten dieses Typs von gestern.');
  const log=S.dayLog;toCopy.forEach(m=>log.meals.push({...m,id:uid()}));S.saveDayLog(log);
  renderView('dashboard');showToast(`${toCopy.length} Mahlzeit(en) kopiert! ♻️`);
};

window.toggleDashboardWidget=function(key,checked){

const MEAL_TARGET_SPLITS={breakfast:0.25,lunch:0.35,dinner:0.30,snack:0.10};

function getDashboardMealState(){return load('dashboardMealExpanded')||{};}

function mealTargetForType(type,totalTarget){return Math.max(1,Math.round((totalTarget||0)*(MEAL_TARGET_SPLITS[type]||0.25)));}

// FIX #1: Makro-Donut SVG per meal card
function mealMacroDonut(consumed, target, protein, carbs, fat){
  const size=92,r=31,cx=46,cy=46,stroke=8;
  const circ=2*Math.PI*r;
  const ratio=target>0?consumed/target:0;
  const pct=Math.max(0,Math.min(1,ratio));
  const dash=`${(pct*circ).toFixed(1)} ${circ.toFixed(1)}`;
  const color=ratio>1?'var(--fat)':'var(--accent)';
  const percentText=Math.round(Math.min(999,ratio*100));

  // Macro split arc (protein=blue, carbs=yellow, fat=red) inside the ring
  const total=protein+carbs+fat;
  let macroArcs='';
  if(total>0){
    const pP=protein/total,pC=carbs/total;
    const rInner=20,cInner=2*Math.PI*rInner;
    const dP=pP*cInner,dC=pC*cInner,dF=(1-pP-pC)*cInner;
    const off=cInner*0.25;
    macroArcs=`
      <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="var(--protein)" stroke-width="5"
        stroke-dasharray="${dP.toFixed(1)} ${cInner.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="butt"/>
      <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="var(--carbs)" stroke-width="5"
        stroke-dasharray="${dC.toFixed(1)} ${cInner.toFixed(1)}" stroke-dashoffset="${(off-dP).toFixed(1)}" stroke-linecap="butt"/>
      <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="var(--fat)" stroke-width="5"
        stroke-dasharray="${dF.toFixed(1)} ${cInner.toFixed(1)}" stroke-dashoffset="${(off-dP-dC).toFixed(1)}" stroke-linecap="butt"/>`;
  }

  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${dash}" stroke-dashoffset="${(circ*0.25).toFixed(1)}" stroke-linecap="round" style="transition:stroke-dasharray 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.1)"/>
    ${macroArcs}
    <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text)">${Math.round(consumed)}</text>
    <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--muted)">kcal</text>
    <text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="9" font-weight="800" fill="${color}">${percentText}%</text>
  </svg>`;
}

    <input type="date" value="${S.currentDate}" onchange="window.changeDashboardDate(this.value)" style="background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;outline:none;color-scheme:${isLightScheme?'light':'dark'};cursor:pointer">

  </div>

</div>
<div style="margin-bottom:20px">
  <div style="font-size:15px;color:var(--muted);font-weight:600;margin-bottom:4px">${greeting}, ${userName}!</div>

<div class="card" style="display:flex;align-items:center;gap:16px;padding:16px 20px">

    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${donutColor}" stroke-width="${stroke}" stroke-dasharray="${dashArr}" stroke-dashoffset="${(circ*0.25).toFixed(1)}" stroke-linecap="round" style="transition:stroke-dasharray 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1)"/>
      <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">${totals.calories}</text>
      <text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">kcal</text>
      <text x="${cx}" y="${cy+24}" text-anchor="middle" font-size="10" fill="${isOver?'var(--fat)':'var(--success)'}" font-weight="700">${isOver?'▲ '+(totals.calories-targets.calories)+' über Ziel':remaining+' übrig'}</text>

  <div style="flex:1">

    <div style="font-size:28px;font-weight:800;letter-spacing:-0.5px">${targets.calories} <span style="font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0">kcal</span></div>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:7px">
      <div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--protein);font-weight:600">Protein</span><span style="font-weight:500">${totals.protein}g / ${targets.protein}g</span></div><div class="macro-bar"><div class="macro-fill bg-grad-prot" style="width:${protPct}%"></div></div></div>
      <div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--carbs);font-weight:600">Kohlenhydrate</span><span style="font-weight:500">${totals.carbs}g / ${targets.carbs}g</span></div><div class="macro-bar"><div class="macro-fill bg-grad-carb" style="width:${carbPct}%"></div></div></div>
      <div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--fat);font-weight:600">Fett</span><span style="font-weight:500">${totals.fat}g / ${targets.fat}g</span></div><div class="macro-bar"><div class="macro-fill bg-grad-fat" style="width:${fatPct}%"></div></div></div>
    </div>
  </div>
</div>

${isOver?`<div style="background:rgba(248,113,113,0.12);border:1px solid var(--fat);border-radius:14px;padding:11px 14px;margin-top:10px;font-size:13px;color:var(--fat);font-weight:600">⚠️ Kalorienziel um ${totals.calories-targets.calories} kcal überschritten</div>`:''}

${mealCardsHTML?`<div style="margin-top:14px">${mealCardsHTML}</div>`:''}

// ====================== FIX #4: HISTORY WITH MACRO AVERAGES ======================
function getLastDaysLogs(days=7){
  const logs=[];
  for(let i=0;i<days;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const key='log-'+d.toISOString().split('T')[0];
    const data=load(key);
    if(data&&data.meals&&data.meals.length>0){
      const totals=sumMeals(data.meals);
      logs.unshift({date:key,displayDate:d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'}),totals,meals:data.meals});
    }
  }
  return logs;
}

function renderHistory(el){
  const logs=getLastDaysLogs(14);
  const wLog=S.getWeightLog().slice(-30);

  // FIX #4: Calculate weekly macro averages
  function calcWeeklyAverages(){
    const recent=[];
    for(let i=0;i<7;i++){
      const d=new Date();d.setDate(d.getDate()-i);
      const data=load('log-'+d.toISOString().split('T')[0]);
      if(data&&data.meals&&data.meals.length>0)recent.push(sumMeals(data.meals));
    }
    if(!recent.length)return null;
    const avg=(key)=>Math.round(recent.reduce((s,d)=>s+d[key],0)/recent.length);
    return{calories:avg('calories'),protein:avg('protein'),carbs:avg('carbs'),fat:avg('fat'),days:recent.length};
  }

  const avg=calcWeeklyAverages();
  const targets=getDynamicTargets(S.profile,S.dayLog);

  const avgHTML=avg?`
  <div class="card fade-up" style="margin-bottom:16px;padding:18px">
    <div style="font-size:13px;color:var(--muted);font-weight:700;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.5px">⌀ Ø Letzten ${avg.days} Tage</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="background:var(--card2);border-radius:14px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:var(--accent)">${avg.calories}</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:2px">kcal / Tag</div>
        <div style="font-size:10px;color:${avg.calories>targets.calories?'var(--fat)':'var(--success)'};margin-top:4px;font-weight:700">${avg.calories>targets.calories?`+${avg.calories-targets.calories} über Ziel`:`${targets.calories-avg.calories} unter Ziel`}</div>
      </div>
      <div style="background:var(--card2);border-radius:14px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:var(--protein)">${avg.protein}g</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:2px">Protein / Tag</div>
        <div style="font-size:10px;color:${avg.protein>=targets.protein?'var(--success)':'var(--fat)'};margin-top:4px;font-weight:700">${avg.protein>=targets.protein?'✓ Ziel erreicht':`${targets.protein-avg.protein}g fehlen`}</div>
      </div>
      <div style="background:var(--card2);border-radius:14px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:var(--carbs)">${avg.carbs}g</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:2px">Kohlenh. / Tag</div>
      </div>
      <div style="background:var(--card2);border-radius:14px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:var(--fat)">${avg.fat}g</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:2px">Fett / Tag</div>
      </div>
    </div>
  </div>`:'';

  let weightChartHTML='';
  if(wLog.length>=2){
    const W=320,H=120,pad=28;
    const kgs=wLog.map(e=>e.kg);
    const minK=Math.min(...kgs)-0.5,maxK=Math.max(...kgs)+0.5;
    const xScale=i=>pad+(i/(wLog.length-1))*(W-pad*2);
    const yScale=k=>pad+(1-(k-minK)/(maxK-minK))*(H-pad*1.5);
    const pathD=wLog.map((e,i)=>`${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(e.kg).toFixed(1)}`).join(' ');
    const ma=wLog.map((e,i,arr)=>{let sum=0,count=0;for(let j=Math.max(0,i-6);j<=i;j++){sum+=arr[j].kg;count++;}return sum/count;});
    const maPathD=ma.map((v,i)=>`${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(v).toFixed(1)}`).join(' ');
    const dots=wLog.map((e,i)=>`<circle class="weight-dot" cx="${xScale(i).toFixed(1)}" cy="${yScale(e.kg).toFixed(1)}" r="4.5" fill="var(--accent)"><title>${e.date}: ${e.kg} kg</title></circle>`).join('');
    const lastEntry=wLog[wLog.length-1];const firstEntry=wLog[0];
    const diff=(lastEntry.kg-firstEntry.kg).toFixed(1);
    const diffColor=diff>0?'var(--fat)':'var(--success)';
    weightChartHTML=`<div class="card" style="margin-bottom:12px;padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div><div style="font-size:24px;font-weight:800">${lastEntry.kg} <span style="font-size:14px;color:var(--muted);font-weight:500">kg</span></div><div style="font-size:12px;color:var(--muted);font-weight:600">Aktuell • ${wLog.length} Einträge</div></div><div style="text-align:right"><div style="font-size:18px;font-weight:800;color:${diffColor}">${diff>0?'+':''}${diff} kg</div><div style="font-size:12px;color:var(--muted);font-weight:600">seit ${firstEntry.date}</div></div></div><svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${pathD} L${xScale(wLog.length-1).toFixed(1)},${H} L${pad},${H} Z" fill="url(#wg)"/><path d="${maPathD}" fill="none" stroke="var(--protein)" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/><path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}<text x="${pad}" y="${H-4}" font-size="10" font-weight="600" fill="var(--muted)">${firstEntry.date.slice(5)}</text><text x="${W-pad}" y="${H-4}" font-size="10" font-weight="600" fill="var(--muted)" text-anchor="end">${lastEntry.date.slice(5)}</text></svg><div style="font-size:11px;color:var(--muted);text-align:center;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600"><span style="display:inline-block;width:12px;height:4px;background:var(--protein);opacity:0.6;border-radius:2px"></span> 7-Tage Trendlinie</div></div>`;
  }

  const weightListHTML=wLog.length===0?`<div class="card fade-up" style="padding:50px 20px;text-align:center;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">⚖️</div><p style="font-weight:600">Noch keine Gewichtseinträge</p></div>`:wLog.slice().reverse().slice(0,10).map((e,idx)=>`<div class="card" style="margin-bottom:8px;padding:14px;display:flex;justify-content:space-between;align-items:center;animation:fadeUp ${0.1+idx*0.05}s ease-out forwards;opacity:0;"><div style="color:var(--muted);font-size:13px;font-weight:600">${new Date(e.date+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}</div><div style="font-size:20px;font-weight:800">${e.kg} <span style="font-size:12px;color:var(--muted);font-weight:500">kg</span></div></div>`).join('');

  const essenHTML=logs.length===0?`<div class="card fade-up" style="padding:50px 20px;text-align:center;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">📅</div><p style="font-weight:600">Noch keine Einträge in den letzten 14 Tagen</p></div>`:logs.map((log,idx)=>`<div class="card" style="margin-bottom:12px;padding:16px;animation:fadeUp ${0.1+idx*0.05}s ease-out forwards;opacity:0;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div style="font-weight:700;font-size:15px">${log.displayDate}</div><div style="font-size:12px;color:var(--muted);margin-top:2px;font-weight:500">${log.meals.length} Mahlzeiten</div></div><div style="text-align:right"><div style="font-size:24px;font-weight:800;color:var(--accent);letter-spacing:-0.5px">${log.totals.calories}</div><div style="font-size:12px;color:var(--muted);font-weight:600">kcal</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;text-align:center"><div style="background:var(--card2);border-radius:12px;padding:8px 4px"><span style="color:var(--protein);font-weight:800;font-size:14px">${log.totals.protein}g</span><br><span style="color:var(--muted);font-size:11px">Protein</span></div><div style="background:var(--card2);border-radius:12px;padding:8px 4px"><span style="color:var(--carbs);font-weight:800;font-size:14px">${log.totals.carbs}g</span><br><span style="color:var(--muted);font-size:11px">Kohlenh.</span></div><div style="background:var(--card2);border-radius:12px;padding:8px 4px"><span style="color:var(--fat);font-weight:800;font-size:14px">${log.totals.fat}g</span><br><span style="color:var(--muted);font-size:11px">Fett</span></div></div></div>`).join('');

  el.innerHTML=`<div style="padding:20px 16px"><h1 style="margin-bottom:16px" class="fade-up">Verlauf</h1><div style="display:flex;gap:8px;background:var(--card2);border-radius:16px;padding:5px;margin-bottom:16px" class="fade-up"><button onclick="switchHistoryTab('essen')" style="flex:1;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:13px;cursor:pointer;background:${historyTab==='essen'?'var(--card)':'transparent'};color:${historyTab==='essen'?'var(--text)':'var(--muted)'};transition:all .2s">🍽️ Ernährung</button><button onclick="switchHistoryTab('gewicht')" style="flex:1;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:13px;cursor:pointer;background:${historyTab==='gewicht'?'var(--card)':'transparent'};color:${historyTab==='gewicht'?'var(--text)':'var(--muted)'};transition:all .2s">⚖️ Gewicht</button></div>${historyTab==='essen'?avgHTML+'<div class="card" style="text-align:center;color:var(--muted);padding:20px;line-height:1.5;font-size:13px;margin-bottom:16px">💡 <strong>Tipp:</strong> Nutze den Datums-Picker auf dem Dashboard für alte Mahlzeiten.</div>'+essenHTML:weightChartHTML+weightListHTML}</div>`;
}

function switchHistoryTab(tab){historyTab=tab;renderView('history');}

// ====================== FIX #5+6: CHAT WITH MEAL SUGGESTIONS + DEBOUNCE ======================
function renderChat(el){
  const currentChat=getCurrentChat();

  // FIX #5: Dynamic quick prompts based on remaining macros
  const log=S.dayLog;
  const targets=getDynamicTargets(S.profile,log);
  const totals=sumMeals(log.meals);
  const remKcal=targets.calories-totals.calories;
  const remProt=targets.protein-totals.protein;

  let suggestionPrompt='';
  if(remKcal>400&&remProt>20){
    suggestionPrompt=`Schlage mir eine Mahlzeit vor (~${Math.round(remKcal/2)} kcal, ~${Math.round(remProt/2)}g Protein)`;
  } else if(remKcal>100&&remKcal<=400){
    suggestionPrompt=`Kleiner Snack-Vorschlag für ~${remKcal} kcal`;
  } else if(remKcal<=0){
    suggestionPrompt='Ziel erreicht – was noch erlaubt ist?';
  }

  const quickPrompts=[
    'Was fehlt mir noch?',
    suggestionPrompt||'Bin ich auf Kurs?',
    'Ich habe gerade 200g Hähnchen gegessen',
    'Hab 30 Min Yoga gemacht'
  ].filter(Boolean);

  el.innerHTML=`<div style="padding:16px;display:flex;flex-direction:column;height:calc(100vh - 72px)" class="fade-up">
    <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <div onclick="openChatList()" style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--card2);padding:6px 12px 6px 8px;border-radius:14px;box-shadow:var(--shadow);">
        <span style="font-size:22px">💬</span>
        <div id="current-chat-title" style="font-size:16px;font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${currentChat?currentChat.title:'Kalorify Coach'}</div>
        <span style="color:var(--muted);font-size:12px;margin-left:4px">▾</span>
      </div>
      <button onclick="createNewChatAndRender()" class="btn" style="padding:8px 18px;border-radius:12px;font-size:13px">+ Neu</button>
    </div>
    <div id="chat-msgs" style="flex:1;overflow-y:auto;background:var(--card2);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 2px 10px rgba(0,0,0,0.03);"></div>
    ${getCurrentMessages().length===0?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;animation:fadeUp 0.3s 0.2s both">${quickPrompts.map(q=>`<button onclick="sendQuickPrompt('${q.replace(/'/g,"\\'")}') " style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);transition:transform 0.1s;box-shadow:var(--shadow)">${q}</button>`).join('')}</div>`:''}
    <div style="display:flex;gap:8px;margin-top:16px">
      <button onclick="window.startVoiceChat()" class="btn btn-ghost" style="padding:13px;flex-shrink:0;border-radius:16px;font-size:20px" title="Spracheingabe">🎙️</button>
      <input id="chat-inp" class="inp" placeholder="Frag den Coach oder tracke..." onkeydown="if(event.key==='Enter')sendChat()" style="flex:1;border-radius:16px;">
      <button onclick="sendChat()" class="btn" style="padding:13px 20px;flex-shrink:0;border-radius:16px;font-size:18px">🚀</button>
    </div>
  </div>`;
  renderChatMessages();
}

window.startVoiceChat=function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return showToast('Spracherkennung wird nicht unterstützt.');
  const recognition=new SR();recognition.lang='de-DE';recognition.start();
  showToast('🎙️ Höre zu...');
  recognition.onresult=(event)=>{const text=event.results[0][0].transcript;const input=document.getElementById('chat-inp');if(input){input.value=(input.value+' '+text).trim();}showToast('Text verstanden!');};
  recognition.onerror=()=>showToast('Fehler bei der Spracherkennung');
};

function escapeHTML(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML.replace(/\n/g,'<br>');}
function renderChatMessages(){
  const container=document.getElementById('chat-msgs');
  if(!container)return;
  const msgs=getCurrentMessages();
  container.innerHTML=msgs.map((msg,i)=>`<div class="chat-bubble ${msg.role==='user'?'user':'bot'} ${i===msgs.length-1?'scale-in':''}">${escapeHTML(msg.text)}</div>`).join('');
  container.scrollTop=container.scrollHeight;
}

async function sendChat(){
  const inp=document.getElementById('chat-inp');
  const text=inp.value.trim();if(!text)return;
  let msgs=getCurrentMessages();
  msgs.push({role:'user',text});setCurrentMessages(msgs);renderChatMessages();inp.value='';
  const loading=document.createElement('div');
  loading.className='chat-bubble bot scale-in';
  loading.innerHTML='<span style="display:inline-block;animation:spin 1s linear infinite;margin-right:6px">⚙️</span> Coach denkt nach...';
  const container=document.getElementById('chat-msgs');container.appendChild(loading);container.scrollTop=container.scrollHeight;
  try{
    let reply=await coachChat(text);

    // FIX #3: Robust JSON extraction with regex before JSON.parse
    const mealRegex=/\[TRACK_MEAL:\s*(\{[\s\S]*?\})\s*\]/i;
    const mealMatch=reply.match(mealRegex);
    if(mealMatch){
      try{
        // Extract only the JSON object using regex to be safe
        const jsonStr=mealMatch[1].replace(/[\r\n]/g,' ').trim();
        const mealData=JSON.parse(jsonStr);
        addMeal({name:mealData.name||'KI-Snack',calories:parseInt(mealData.kcal)||0,protein:parseFloat(mealData.p)||0,carbs:parseFloat(mealData.c)||0,fat:parseFloat(mealData.f)||0,mealType:'snack'});
        reply=reply.replace(mealMatch[0],'').trim();
      }catch(err){console.warn('Meal tracking JSON parse error:',err);reply=reply.replace(mealMatch[0],'').trim();}
    }

    const actRegex=/\[TRACK_ACTIVITY:\s*(\{[\s\S]*?\})\s*\]/i;
    const actMatch=reply.match(actRegex);
    if(actMatch){
      try{
        const jsonStr=actMatch[1].replace(/[\r\n]/g,' ').trim();
        const actData=JSON.parse(jsonStr);
        const log=S.dayLog;if(!log.activities)log.activities=[];
        log.activities.push({name:actData.name||'KI-Sport',kcal:parseInt(actData.kcal)||0,id:uid()});
        S.saveDayLog(log);showToast(`Sport eingetragen: +${actData.kcal} kcal`);
        reply=reply.replace(actMatch[0],'').trim();
      }catch(err){console.warn('Activity tracking JSON parse error:',err);reply=reply.replace(actMatch[0],'').trim();}
    }

    msgs=getCurrentMessages();msgs.push({role:'model',text:reply});setCurrentMessages(msgs);
    loading.remove();renderChatMessages();

    const currChat=getCurrentChat();
    if(currChat&&currChat.title==='Neuer Chat'){
      const firstUser=msgs[0].text;
      currChat.title=firstUser.length>32?firstUser.substring(0,29)+'...':firstUser;
      saveChats();const titleEl=document.getElementById('current-chat-title');if(titleEl)titleEl.textContent=currChat.title;
    }
  }catch(e){loading.textContent='❌ '+e.message;}
}

window.exportData=function(){const data={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);data[key]=localStorage.getItem(key);}const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`kalorify_backup_${new Date().toISOString().split('T')[0]}.json`;a.click();};
window.importData=function(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);for(const key in data){localStorage.setItem(key,data[key]);}showToast('Daten importiert! Lade App neu...');setTimeout(()=>location.reload(),1500);}catch(err){showToast('Fehler beim Importieren.');}};reader.readAsText(file);};
window.saveProfileData=function(){const profile=S.profile||{};profile.gender=document.getElementById('prof-gender').value;profile.age=parseInt(document.getElementById('prof-age').value);profile.weight=parseInt(document.getElementById('prof-weight').value);profile.height=parseInt(document.getElementById('prof-height').value);profile.activityLevel=document.getElementById('prof-activity').value;profile.goal=document.getElementById('prof-goal').value;profile.theme=document.getElementById('prof-theme-sel').value;profile.compactMode=document.getElementById('prof-compact-toggle').checked;profile.accentColor=document.getElementById('prof-color').value;S.saveProfile(profile);applyTheme(profile);showToast('Profil gespeichert ✓');renderView('dashboard');};
window.saveClaudeKey=function(){const k=document.getElementById('claude-key-inp')?.value.trim();if(k){store('claudeApiKey',k);showToast('Claude Key gespeichert ✓');}};
window.saveGeminiKey=function(){const k=document.getElementById('gemini-key-inp').value.trim();if(k){S.setGeminiKey(k);showToast('Gemini Key gespeichert ✓');}};
window.saveGroqKey=function(){const k=document.getElementById('groq-key-inp')?.value.trim();if(k){store('groqApiKey',k);showToast('Groq Key gespeichert ✓');}};
window.saveMistralKey=function(){const k=document.getElementById('mistral-key-inp')?.value.trim();if(k){store('mistralApiKey',k);showToast('Mistral Key gespeichert ✓');}};
window.saveUSDAKey=function(){const k=document.getElementById('usda-key-inp')?.value.trim();if(k){store('usdaApiKey',k);showToast('USDA Key gespeichert ✓');}};
window.saveAPILayerKey=function(){const k=document.getElementById('apilayer-key-inp')?.value.trim();if(k){store('apilayerApiKey',k);showToast('APILayer Key gespeichert ✓');}};

function switchAddTab(tab){

  if(cont){_renderAddTabContent();}

function _renderAddTabContent(){

window.startVoiceKI=function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return showToast('Spracherkennung wird nicht unterstützt.');
  const recognition=new SR();recognition.lang='de-DE';recognition.start();showToast('🎙️ Höre zu...');
  recognition.onresult=(event)=>{const text=event.results[0][0].transcript;const input=document.getElementById('ai-text');if(input){input.value=(input.value+' '+text).trim();}showToast('Text eingefügt!');};
  recognition.onerror=()=>showToast('Fehler bei der Spracherkennung');
};

function switchBarcodeSubTab(tab){stopBarcodeScanner();currentBarcodeSubTab=tab;document.querySelectorAll('.barcode-tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='camera')||(i===1&&tab==='manual')));_initBarcodeSubTab();}

function _startBarcodeScanner(){
  const statusEl=document.getElementById('barcode-status');if(!statusEl)return;
  if(typeof Html5Qrcode==='undefined'){statusEl.innerHTML='<span class="error">❌ Scanner-Script fehlt.</span>';return;}
  try{
    html5QrcodeInst=new Html5Qrcode('barcode-reader');
    html5QrcodeInst.start({facingMode:'environment'},{fps:15,qrbox:{width:280,height:160},aspectRatio:1.4},(decodedText)=>{stopBarcodeScanner();if(statusEl)statusEl.innerHTML=`<span class="found">✅ ${decodedText} erfasst. Suche...</span>`;_handleBarcodeDetected(decodedText,statusEl);},()=>{}).then(()=>{if(statusEl)statusEl.textContent='📷 Strichcode in Box platzieren.';}).catch(err=>{if(statusEl)statusEl.innerHTML=`<span style="color:var(--fat)">❌ Keine Kamera-Freigabe.</span>`;});
  }catch(e){if(statusEl)statusEl.innerHTML=`<span style="color:var(--fat)">❌ ${e.message}</span>`;}
}

function stopBarcodeScanner(){if(html5QrcodeInst){try{html5QrcodeInst.stop().catch(()=>{});}catch(e){}html5QrcodeInst=null;}}

async function lookupManualBarcode(){
  const inp=document.getElementById('manual-barcode-inp');const statusEl=document.getElementById('barcode-manual-status');if(!inp||!statusEl)return;
  const code=inp.value.trim().replace(/\s/g,'');if(!code||!/^\d{6,14}$/.test(code))return showToast('Gültige Länge: 6-14 Ziffern');
  statusEl.innerHTML=`<div class="food-loading" style="padding:10px">Suche...</div>`;
  await _handleBarcodeDetected(code,statusEl);
}

async function _handleBarcodeDetected(barcode,statusEl){
  if(statusEl)statusEl.innerHTML=`<div class="food-loading" style="padding:10px">📡 Verbindung zur Datenbank...</div>`;
  try{const product=await fetchByBarcode(barcode);selectedProduct=product;showAmountSelector(product);}
  catch(e){if(statusEl)statusEl.innerHTML=`<div style="text-align:center;padding:16px;color:var(--fat);font-weight:600;background:rgba(248,113,113,0.08);border-radius:12px;margin-top:10px">Nicht in der Datenbank gefunden.</div>`;}
}

function startAICamera(){const mc=document.getElementById('modal-container');mc.innerHTML=`<div class="modal-overlay"><div class="modal-box" style="padding:0;overflow:hidden"><div style="position:relative;background:#000"><video id="camera-video" autoplay playsinline style="width:100%;height:60vh;object-fit:cover;display:block"></video><canvas id="camera-canvas" style="display:none"></canvas><div style="position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(transparent,rgba(0,0,0,0.8));display:flex;align-items:center;justify-content:center;gap:24px;padding:0 20px"><button onclick="closeCameraModal()" style="background:rgba(255,255,255,0.2);color:#fff;border:none;padding:12px 20px;border-radius:14px;font-weight:700;backdrop-filter:blur(8px)">Abbruch</button><button onclick="capturePhoto()" style="width:78px;height:78px;border-radius:50%;background:var(--accent);color:#000;font-size:32px;box-shadow:0 0 36px var(--accent-glow);display:flex;align-items:center;justify-content:center;border:6px solid rgba(170,223,60,0.3)">📸</button></div></div></div></div>`;
