<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kalorify • Personal Coach Edition</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalorify">
<link rel="apple-touch-icon" href="https://placehold.co/192x192/AADF3C/000000.png?text=K">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* Standard-Variablen inkl. Standard “unsichtbarer” Schatten für Dark Mode */
:root{
–bg:#07070F;–card:#0F0F1A;–card2:#161625;–border:#1E1E32;
–accent:#AADF3C;–accent-dim:rgba(170,223,60,0.12);–accent-glow:rgba(170,223,60,0.25);
–text:#EFEFFA;–muted:#52526E;–dim:#8888A8;
–protein:#60A5FA;–carbs:#FBBF24;–fat:#F87171;–success:#4ADE80;
–shadow: none;
}

/* === DUNKLE THEMES === */
.theme-oled{
–bg:#000000;–card:#000000;–card2:#111111;–border:#222222;
–text:#FFFFFF;–muted:#666666;–dim:#999999;
}
.theme-navy{
–bg:#0B1120;–card:#111827;–card2:#1E293B;–border:#374151;
–text:#F8FAFC;–muted:#94A3B8;–dim:#64748B;
}

/* === NEUE HELLE THEMES === */
.theme-light{
–bg:#F4F5F7;–card:#FFFFFF;–card2:#EDF0F3;–border:#DFE3E8;
–text:#1A1A1A;–muted:#6B778C;–dim:#A5B3C8;
–shadow: 0 4px 16px rgba(9, 30, 66, 0.04);
}
.theme-creamy {
–bg:#FAF9F6;–card:#FFFFFF;–card2:#F2F0EA;–border:#E2DFD6;
–text:#1D1C1A;–muted:#6A6863;–dim:#9A9893;
–shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
}
.theme-mint {
–bg:#F2FAF5;–card:#FFFFFF;–card2:#E6F3EA;–border:#CEE5D8;
–text:#112117;–muted:#577464;–dim:#84A593;
–shadow: 0 4px 16px rgba(11, 35, 21, 0.03);
}
.theme-ice {
–bg:#F0F4FA;–card:#FFFFFF;–card2:#E4EAF2;–border:#CBD5E4;
–text:#111928;–muted:#546279;–dim:#8292AD;
–shadow: 0 4px 16px rgba(13, 32, 54, 0.04);
}
.theme-sepia {
–bg:#F7F1E6;–card:#FEFCFA;–card2:#EEE5D6;–border:#DFD4C2;
–text:#382B21;–muted:#806D5E;–dim:#AE9F90;
–shadow: 0 4px 14px rgba(71, 43, 18, 0.05);
}

html,body{height:100%;background:var(–bg);font-family:‘DM Sans’,sans-serif;color:var(–text);overflow:hidden;transition:background-color 0.3s}
::-webkit-scrollbar{display:none}
input,textarea,button,select{font-family:inherit;outline:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{resize:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-up{animation:fadeUp .28s ease-out forwards}
.scale-in{animation:scaleIn .3s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards}

#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;background:var(–bg)}
#views{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:90px;transition: opacity 0.2s}

/* GLASSMORPHISM NAV */
#nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:480px;
background:color-mix(in srgb, var(–card) 85%, transparent);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-top:1px solid var(–border);
display:flex;
align-items:center;
justify-content:space-around;
padding:12px 0 24px;
z-index:50;
transition:background-color 0.3s;
}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 14px;color:var(–muted);font-size:10px;font-weight:700;letter-spacing:.5px;transition:all 0.2s;}
.nav-btn.active{color:var(–accent)}
.nav-btn:active{transform:scale(0.9);}
#add-fab{width:56px;height:56px;border-radius:20px;background:var(–accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px var(–accent-glow);margin-top:-14px;flex-shrink:0;transition:transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);}
#add-fab:active{transform:scale(.92) rotate(-3deg);}

/* SANFTERE KARTEN (mit dynamischen Shadows für hellen Theme Mode) */
.card{background:var(–card);border:1px solid var(–border);border-radius:24px;padding:20px;transition:transform 0.1s, padding 0.2s, box-shadow 0.3s, background-color 0.3s, border-color 0.3s;box-shadow:var(–shadow)}
.card:active {transform: scale(0.99);}

.inp{background:var(–card2);border:1px solid var(–border);border-radius:14px;padding:12px 16px;color:var(–text);font-size:14px;width:100%;transition:all 0.2s;box-shadow:inset 0 1px 3px rgba(0,0,0,0.02)}
.inp:focus{border-color:var(–accent);box-shadow:0 0 0 3px var(–accent-dim);}
.btn{border:none;border-radius:14px;cursor:pointer;font-weight:700;padding:14px 20px;background:var(–accent);color:#000;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.95);}
.btn-ghost{background:var(–card2);color:var(–text);border:1px solid var(–border)}
.btn-ghost:active{transform:scale(.95);background:var(–border)}

/* GLASSMORPHISM MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition: opacity 0.25s;}
.modal-box{background:color-mix(in srgb, var(–card) 95%, transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:28px 28px 0 0;padding:24px;width:100%;max-height:92vh;overflow-y:auto;border:1px solid var(–border);border-bottom:none;box-shadow:0 -10px 40px rgba(0,0,0,0.15);}

#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(–success);color:#000;border-radius:20px;padding:12px 24px;font-weight:700;z-index:300;display:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 12px 36px rgba(0,0,0,0.4);animation:fadeUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);}
.pill{background:var(–card2);border:1px solid var(–border);border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;user-select:none;}
.pill:active{transform:scale(0.93);}
.pill.active{background:var(–accent);color:#000;border-color:var(–accent);box-shadow:0 4px 12px var(–accent-glow);}
.chat-bubble{max-width:85%;padding:14px 18px;border-radius:24px;margin-bottom:8px;line-height:1.5;}
.chat-bubble.user{background:var(–accent);color:#000;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:0 4px 12px var(–accent-glow);}
.chat-bubble.bot{background:var(–card);border:1px solid var(–border);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:var(–shadow);}
.onboarding-screen{display:flex;flex-direction:column;height:100vh;padding:20px;background:var(–bg);color:var(–text)}

/* VERLÄUFE FÜR MAKRO-BALKEN */
.macro-bar{height:8px;background:var(–border);border-radius:9999px;overflow:hidden;margin-top:4px}
.macro-fill{height:100%;transition:width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)}
.bg-grad-prot { background: linear-gradient(90deg, var(–protein), #93C5FD); }
.bg-grad-carb { background: linear-gradient(90deg, var(–carbs), #FDE68A); }
.bg-grad-fat { background: linear-gradient(90deg, var(–fat), #FCA5A5); }

/* Compact Mode */
.compact-mode .card { padding: 14px; border-radius:18px; }
.compact-mode .inp { padding: 10px 14px; font-size: 13px; border-radius:10px; }
.compact-mode .btn { padding: 12px 16px; border-radius:12px; }
.compact-mode h1 { font-size: 24px; margin-bottom: 12px; }

/* Color Picker */
.color-dot { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
.color-dot:active { transform:scale(0.9); }
.color-dot.active { border-color: var(–text); transform: scale(1.15); }

/* Water tracker */
.water-btn{background:var(–card2);border:1px solid var(–border);border-radius:14px;padding:12px 0;font-size:13px;font-weight:700;cursor:pointer;color:var(–text);flex:1;text-align:center;transition:all .15s}
.water-btn:active{transform:scale(0.94);background:var(–accent-dim);border-color:var(–accent)}

/* Weight chart */
.weight-dot{cursor:pointer;transition:all .2s cubic-bezier(0.4, 0, 0.2, 1); transform-origin:center; stroke:var(–card)}
.weight-dot:hover{transform:scale(1.5);}

/* Recipe card */
.recipe-card{background:var(–card2);border:1px solid var(–border);border-radius:16px;overflow:hidden;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:0;transition:transform 0.15s, box-shadow 0.2s;box-shadow:var(–shadow);}
.recipe-card:active{transform:scale(0.98); border-color:var(–accent);}
.recipe-card-img{width:80px;height:80px;object-fit:cover;flex-shrink:0;background:var(–border)}
.recipe-card-info{padding:12px;flex:1;min-width:0}
.recipe-card-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe-card-meta{font-size:12px;color:var(–muted);margin-top:4px}

.toggle-switch{position:relative;display:inline-block;width:52px;height:28px}
.toggle-switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(–border);border-radius:9999px;transition:.3s}
.slider:before{position:absolute;content:””;height:22px;width:22px;left:3px;bottom:3px;background:var(–text);border-radius:50%;transition:.3s}
input:checked + .slider{background:var(–accent)}
input:checked + .slider:before{transform:translateX(24px);background:#000}

/* –– ADD MODAL TABS –– */
.add-tabs{display:flex;gap:6px;margin-bottom:20px;background:var(–card2);border-radius:16px;padding:6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.add-tab{flex-shrink:0;border:none;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:var(–muted);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.add-tab.active{background:var(–accent);color:#000;box-shadow:0 4px 10px var(–accent-glow);}
.add-tab:active:not(.active){transform:scale(0.95); background:var(–border)}

/* –– FOOD DB SEARCH –– */
.search-row{display:flex;gap:8px;margin-bottom:12px}
.food-result-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(–card2);border:1px solid var(–border);border-radius:16px;margin-bottom:8px;cursor:pointer;transition:transform .15s, border-color .15s; box-shadow:var(–shadow)}
.food-result-item:active{transform:scale(0.98); border-color:var(–accent)}
.food-result-img{width:54px;height:54px;border-radius:14px;object-fit:cover;background:var(–border);flex-shrink:0}
.food-result-info{flex:1;min-width:0}
.food-result-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-result-brand{font-size:12px;color:var(–muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-result-kcal{font-size:14px;color:var(–accent);font-weight:800;flex-shrink:0;text-align:right}
.food-loading{text-align:center;padding:30px;color:var(–muted);animation:pulse 1.2s infinite; font-weight:600;}
.food-empty{text-align:center;padding:40px 20px;color:var(–muted)}
.food-empty-icon{font-size:48px;margin-bottom:12px}

/* –– AMOUNT SELECTOR –– */
.amount-header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.amount-product-img{width:68px;height:68px;border-radius:18px;object-fit:cover;background:var(–card2);border:1px solid var(–border);flex-shrink:0}
.amount-product-name{font-weight:800;font-size:18px;line-height:1.2}
.amount-product-brand{font-size:14px;color:var(–muted);margin-top:4px}
.amount-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.amount-chip{background:var(–card2);border:1px solid var(–border);border-radius:9999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.amount-chip:active{transform:scale(0.93);}
.amount-chip.active{background:var(–accent);color:#000;border-color:var(–accent);box-shadow:0 4px 10px var(–accent-glow);}
.macro-preview{background:var(–card2);border:border:1px solid var(–border);border-radius:16px;padding:18px;margin:16px 0}
.macro-preview-title{font-size:12px;color:var(–muted);font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;text-align:center}
.macro-preview-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;text-align:center}
.macro-preview-val{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.macro-preview-label{font-size:11px;color:var(–muted);margin-top:2px}
.amount-input-row{display:flex;gap:8px;align-items:center}
.amount-input-row input{flex:1;font-size:20px;font-weight:800;text-align:center;letter-spacing:1px}

/* –– BARCODE –– */
.barcode-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(–card2);border-radius:14px;padding:4px}
.barcode-tab{flex:1;border:none;border-radius:11px;padding:10px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:var(–muted);transition:all .2s}
.barcode-tab:active:not(.active){transform:scale(0.95);background:var(–border)}
.barcode-tab.active{background:var(–card);color:var(–text);border:1px solid var(–border);box-shadow:var(–shadow);}
#barcode-reader-container{border-radius:20px;overflow:hidden;background:#000;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,0.4);}
#barcode-reader-container video{width:100%!important;object-fit:cover;border-radius:20px;}
#barcode-reader-container img{display:none!important}
#barcode-reader{width:100%}
.barcode-status{text-align:center;padding:12px;font-size:14px;font-weight:600;color:var(–muted)}
.barcode-status.found{color:var(–success)}
.barcode-status.error{color:var(–fat)}

/* CHAT LIST ENHANCEMENTS */
.chat-list-item{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(–card);border-radius:20px;margin-bottom:12px;cursor:pointer;border:2px solid transparent;transition:all 0.2s;box-shadow:var(–shadow);}
.chat-list-item:active{transform:scale(0.98); background:var(–card2);}
.chat-list-item.active{border-color:var(–accent);background:var(–accent-dim);box-shadow:0 8px 24px var(–accent-glow);}
</style>

</head>
<body>
<div id="toast"></div>
<div id="app" style="display:none">
  <div id="views"></div>
  <nav id="nav">
    <button class="nav-btn active" data-view="dashboard" onclick="navigate('dashboard')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      HEUTE
    </button>
    <button class="nav-btn" data-view="chat" onclick="navigate('chat')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      COACH
    </button>
    <button id="add-fab" onclick="openAddModal()">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="nav-btn" data-view="history" onclick="navigate('history')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      VERLAUF
    </button>
    <button class="nav-btn" data-view="profile" onclick="navigate('profile')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      PROFIL
    </button>
  </nav>
</div>
<div id="onboarding" class="onboarding-screen" style="display:none"></div>
<div id="modal-container"></div>

<script>
// ====================== SICHERER STORAGE ======================
function load(k) {
  try { return localStorage.getItem(k) ? JSON.parse(localStorage.getItem(k)) : null; }
  catch(e) { return null; }
}
function store(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}

const S = {
  profile: null,
  chats:[],
  activeChatId: null,
  currentDate: today(), 

  get dayKey(){ 
    return 'log-' + this.currentDate; 
  },
  get dayLog(){ 
    return load(this.dayKey) || {meals:[], activities:[], steps: 0}; 
  },
  saveDayLog(log){ 
    store(this.dayKey, log); 
  },
  
  get geminiKey(){ 
    return load('geminiApiKey') || ''; 
  },
  setGeminiKey(k){ 
    store('geminiApiKey', k); 
  },
  
  loadProfile(){ 
    return load('profile'); 
  },
  saveProfile(p){ 
    store('profile', p); this.profile = p; 
  },
  
  get waterKey(){ 
    return 'water-' + this.currentDate; 
  },
  get todayWater(){ 
    return load(this.waterKey) || 0; 
  },
  addWater(ml){ 
    const v = this.todayWater + ml; store(this.waterKey, v); return v; 
  },
  setWater(ml){ 
    store(this.waterKey, ml); 
  },
  
  logWeight(kg){ 
    const logs = load('weightLog') ||[]; 
    const entry = {date:this.currentDate, kg}; 
    const idx = logs.findIndex(e=>e.date===this.currentDate); 
    if(idx>=0) logs[idx]=entry; else logs.push(entry); 
    store('weightLog',logs); 
  },
  getWeightLog(){ 
    return load('weightLog') ||[]; 
  },

  get favorites(){ 
    return load('favorites') ||[]; 
  },
  saveFavorite(food){
    const favs = this.favorites;
    const nameToMatch = getProductName(food);
    const existingIdx = favs.findIndex(f => getProductName(f) === nameToMatch);
    if(existingIdx >= 0) { 
      favs[existingIdx] = food; 
    } else { 
      favs.push({...food, _favId: uid()}); 
    }
    store('favorites', favs);
  },
  removeFavorite(id){
    store('favorites', this.favorites.filter(f=>f._favId !== id));
  }
};

function today(){ return new Date().toISOString().split('T')[0]; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ====================== MULTI-CHAT SUPPORT ======================
function saveChats() {
  store('chats', S.chats);
  store('activeChatId', S.activeChatId);
}

function createNewChat(title = 'Neuer Chat') {
  const newChat = {
    id: uid(),
    title: title,
    messages:[],
    created: Date.now()
  };
  S.chats.unshift(newChat);
  S.activeChatId = newChat.id;
  saveChats();
  return newChat;
}

function getCurrentChat() {
  return S.chats.find(c => c.id === S.activeChatId);
}

function getCurrentMessages() {
  const chat = getCurrentChat();
  return chat ? chat.messages :[];
}

function setCurrentMessages(newMsgs) {
  const chat = getCurrentChat();
  if (chat) {
    chat.messages =[...newMsgs];
    saveChats(); 
  }
}

function switchToChat(id) {
  S.activeChatId = id;
  saveChats();
}

function deleteChat(id) {
  if (!confirm('Dieser Chat und alle Nachrichten wirklich löschen?')) return;
  S.chats = S.chats.filter(c => c.id !== id);
  if (S.activeChatId === id) {
    if (S.chats.length > 0) {
      S.activeChatId = S.chats[0].id;
    } else {
      createNewChat();
    }
  }
  saveChats();
  closeModal();
  renderView('chat');
}

function renameChat(id) {
  const chat = S.chats.find(c => c.id === id);
  if (!chat) return;
  const newTitle = prompt('Neuer Chat-Titel:', chat.title);
  if (newTitle && newTitle.trim()) {
    chat.title = newTitle.trim();
    saveChats();
    closeModal();
    renderView('chat');
  }
}

function openChatList() {

function applyTheme(opts) {

  if (!opts) opts = { theme: 'dark', accentColor: 'lime', compactMode: false };

  const theme = opts.theme || 'dark';
  const compact = opts.compactMode || false;
  const color = opts.accentColor || 'lime';

  // CSS Klassen aufräumen
  document.documentElement.className = '';
  if (theme !== 'dark') document.documentElement.classList.add(`theme-${theme}`);
  if (compact) document.documentElement.classList.add('compact-mode');

// ====================== CALCULATIONS & DYNAMISCHE ZIELE ======================
const ACT = {
  sedentary:{label:'Kaum aktiv (kein Sport)',mult:1.2},
  light:{label:'Leicht aktiv (1–2×/Woche)',mult:1.375},
  moderate:{label:'Moderat aktiv (3–5×/Woche)',mult:1.55},
  active:{label:'Sehr aktiv (6–7×/Woche)',mult:1.725}
};
const GOAL_ADJ = {lose:-500, maintain:0, muscle:300};
const MEAL_TYPES =[
  {id:'breakfast',label:'Frühstück',emoji:'🌅'},
  {id:'lunch',label:'Mittagessen',emoji:'☀️'},
  {id:'dinner',label:'Abendessen',emoji:'🌙'},
  {id:'snack',label:'Snack',emoji:'🍎'}
];

function calcBaseTDEE(p){
  if(!p?.weight) return {calories:2800,protein:140,carbs:330,fat:80};
  const bmr = p.gender==='female'
    ? 447.593 + 9.247*p.weight + 3.098*p.height - 4.33*p.age
    : 88.362 + 13.397*p.weight + 4.799*p.height - 5.677*p.age;
  const cal = Math.round(bmr * (ACT[p.activityLevel]?.mult || 1.55) + (GOAL_ADJ[p.goal] || 0));
  const prot = Math.round(p.weight * 1.8);
  const fat = Math.round(cal * 0.25 / 9);
  const carbs = Math.round((cal - prot*4 - fat*9) / 4);
  return { calories: Math.max(1200, cal), protein: prot, carbs: Math.max(0, carbs), fat: fat };
}

function getDynamicTargets(p, dayLog) {
    const base = calcBaseTDEE(p);
    let addKcal = 0;
    let addP = 0;
    let addC = 0;
    let addF = 0;
    
    // Schritte umrechnen
    const stepKcal = Math.round((dayLog.steps || 0) * 0.04);
    addKcal += stepKcal;
    addC += Math.round(stepKcal * 0.5 / 4);
    
    // KI Sport Aktivitäten addieren
    (dayLog.activities ||[]).forEach(a => {
        addKcal += (a.kcal || 0);
        addP += (a.protein || 0);
        addC += (a.carbs || 0);
        addF += (a.fat || 0);
    });

    return {
        calories: base.calories + addKcal,
        protein: base.protein + addP,
        carbs: base.carbs + addC,
        fat: base.fat + addF,
        addedKcal: addKcal
    };
}

function sumMeals(meals=[]){
  return meals.reduce((a,m)=>({
    calories: a.calories + (m.calories||0),
    protein: a.protein + (m.protein||0),
    carbs: a.carbs + (m.carbs||0),
    fat: a.fat + (m.fat||0)
  }),{calories:0,protein:0,carbs:0,fat:0});
}

// ====================== AI ENGINE (INKL. AUTOTRACKING) ======================
function getAIProvider(){ return (S.profile && S.profile.aiProvider) || 'gemini'; }
function getGroqKey(){ return load('groqApiKey') || ''; }
function getMistralKey(){ return load('mistralApiKey') || ''; }

function buildDayContext() {
  const log = S.dayLog;
  const targets = getDynamicTargets(S.profile, log);
  const totals = sumMeals(log.meals);
  
  let wCal = 0;
  let dCount = 0;
  for(let i=0; i<7; i++){
    const d = new Date(); 
    d.setDate(d.getDate()-i);
    const l = load('log-' + d.toISOString().split('T')[0]);
    if(l && l.meals && l.meals.length) { 
      wCal += sumMeals(l.meals).calories; 
      dCount++; 
    }
  }
  const avgCal = dCount ? Math.round(wCal/dCount) : 0;
  const weekInfo = `Wochen-Durchschnitt (letzte 7 Tage): ${avgCal} kcal/Tag.`;

  let activityText = '';
  if(log.steps) activityText += `\n- ${log.steps} Schritte gegangen`;
  if(log.activities && log.activities.length) {
    activityText += log.activities.map(a=>`\n- ${a.name} (+${a.kcal} kcal)`).join('');
  }

  if (!log.meals.length) {
    return `Der Nutzer hat heute (${S.currentDate}) noch nichts gegessen.\n\nAktivität heute:${activityText||' Keine'}\n\n${weekInfo}`;
  }
  
  const mealList = log.meals.map(m =>
    `- ${m.name} (${MEAL_TYPES.find(t=>t.id===m.mealType)?.label||'Mahlzeit'}): ${m.calories} kcal | P:${m.protein}g KH:${m.carbs}g F:${m.fat}g`
  ).join('\n');
  
  return `${weekInfo}\n\nAktivitäten heute (${S.currentDate}):${activityText||' Keine extra eingetragen'}\n\nHeutige Mahlzeiten:\n${mealList}\n\nSumme heute: ${totals.calories} kcal | Protein: ${totals.protein}g | Kohlenhydrate: ${totals.carbs}g | Fett: ${totals.fat}g\nTages-Ziele (inkl. Sport): ${targets.calories} kcal | P: ${targets.protein}g | KH: ${targets.carbs}g | F: ${targets.fat}g\nRestkapazität: ${targets.calories - totals.calories} kcal | P: ${targets.protein - totals.protein}g | KH: ${targets.carbs - totals.carbs}g | F: ${targets.fat - totals.fat}g`;
}

// -- GEMINI --
async function callGemini(contents) {
  const key = S.geminiKey;
  if (!key) throw new Error('Kein Gemini API-Key. Bitte im Profil eintragen.');
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ contents })
  });
  if (!r.ok) {
    let errText = ''; try { errText = await r.text(); } catch(e){}
    const isQuota = errText.includes('quota') || errText.includes('rate') || r.status === 429;
    throw new Error(isQuota ? 'Gemini Rate-Limit – warte kurz' : `Gemini Fehler (${r.status})`);
  }
  const data = await r.json();
  return (data.candidates?.[0]?.content?.parts?.[0]?.text || '').replace(/`json\n?|\n?`/g, '').trim();
}

async function geminiChatCall(userMessage, systemPrompt) {
  const history = getCurrentMessages() || [];
  const contents =[];
  contents.push({ role:'user',  parts:[{ text: systemPrompt }] });
  contents.push({ role:'model', parts:[{ text: 'Verstanden! Ich bin dein Kalorify Coach. 🍏' }] });
  history.forEach(msg => contents.push({ role: msg.role==='user'?'user':'model', parts:[{ text: msg.text }] }));
  contents.push({ role:'user', parts:[{ text: userMessage }] });
  return await callGemini(contents);
}

// -- GROQ --
async function callGroq(messages) {
  const key = getGroqKey();
  if (!key) throw new Error('Kein Groq API-Key. Bitte im Profil eintragen.');
  const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify({ model:'llama-3.3-70b-versatile', messages, max_tokens:600, temperature:0.7 })
  });
  if (!r.ok) {
    let errText = ''; try { errText = await r.text(); } catch(e){}
    throw new Error(r.status === 401 ? 'Groq: Ungültiger API-Key' : `Groq Fehler (${r.status})`);
  }
  const data = await r.json();
  return data.choices?.[0]?.message?.content || '';
}

async function groqChatCall(userMessage, systemPrompt) {

  history.forEach(msg => messages.push({ role: msg.role==='user'?'user':'assistant', content: msg.text }));
  messages.push({ role:'user', content: userMessage });
  return await callGroq(messages);
}

async function coachChat(userMessage) {
  const provider = getAIProvider();
  const sysPrompt = buildCoachSystemPrompt();

  if (provider === 'gemini')  return await geminiChatCall(userMessage, sysPrompt);
  if (provider === 'groq')    return await groqChatCall(userMessage, sysPrompt);
  if (provider === 'mistral') return await mistralChatCall(userMessage, sysPrompt);

  const[gRes, rRes, mRes] = await Promise.allSettled([
    geminiChatCall(userMessage, sysPrompt),
    groqChatCall(userMessage, sysPrompt),
    mistralChatCall(userMessage, sysPrompt)
  ]);

  const gText = gRes.status === 'fulfilled' ? gRes.value : `*(Gemini Fehler: ${gRes.reason?.message || 'Unbekannt'})*`;
  const rText = rRes.status === 'fulfilled' ? rRes.value : `*(Groq Fehler: ${rRes.reason?.message || 'Unbekannt'})*`;
  const mText = mRes.status === 'fulfilled' ? mRes.value : `*(Mistral Fehler: ${mRes.reason?.message || 'Unbekannt'})*`;

  let finalAnswer = `${gText}\n\n${rText}\n\n${mText}`;

  if (getGroqKey()) {
    try {
      const combineMessages =[
        { role: 'system', content: sysPrompt },
        { role: 'user', content: `Kombiniere diese Antworten zu **einer einzigen** kohärenten Antwort. Erhalte zwingend alle [TRACK_MEAL...] oder [TRACK_ACTIVITY...] Blöcke falls vorhanden.\n\nGemini:\n${gText}\n\nGroq:\n${rText}\n\nMistral:\n${mText}` }
      ];
      finalAnswer = await callGroq(combineMessages);
    } catch (combineErr) {
      console.warn('Zusammenfassung mit Groq fehlgeschlagen', combineErr);
    }
  }

  return finalAnswer;
}

async function fetchWithRetry(url, opts = {}, maxRetries = 3, timeoutMs = 9000) {
  let lastErr;
  for (let attempt = 0; attempt < maxRetries; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(url, { ...opts, signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch(e) {
      clearTimeout(timer);
      lastErr = e;
      if (attempt < maxRetries - 1) await new Promise(res => setTimeout(res, 900*(attempt+1)));
    }
  }
  throw lastErr || new Error('Netzwerkfehler');
}

function translateQuery(q) {
  const lower = q.toLowerCase().trim();
  return DE_EN[lower] || q;
}

async function _searchOFF(query) {
  const url = `${OFF_BASE}/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20&lc=de&fields=${OFF_FIELDS}`;
  let data;
  try { data = await fetchWithRetry(url); } catch(e) { return[]; }
  let products = (data.products ||[])
    .filter(p => (p.product_name || p.product_name_de) && getKcalPer100(p) > 0)
    .map(p => ({ ...p, _source:'off', _srcLabel:'OFF' }));
  if (products.length < 5) {
    const enQ = translateQuery(query);
    if (enQ !== query) {
      const url2 = `${OFF_BASE}/cgi/search.pl?search_terms=${encodeURIComponent(enQ)}&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`;
      try {
        const data2 = await fetchWithRetry(url2);
        const extra = (data2.products||[])
          .filter(p=>(p.product_name||p.product_name_de)&&getKcalPer100(p)>0)
          .map(p=>({...p,_source:'off',_srcLabel:'OFF'}));
        products =[...products, ...extra];
      } catch(e){}
    }
  }
  return products;
}

async function _searchUSDA(query) {
  const key = getUSDAKey();
  const enQuery = translateQuery(query);
  const url = `${USDA_BASE}/foods/search?query=${encodeURIComponent(enQuery)}&api_key=${encodeURIComponent(key)}&pageSize=12&dataType=Foundation,SR%20Legacy`;
  let data;
  try { data = await fetchWithRetry(url); } catch(e) { return []; }
  return (data.foods||[])
    .filter(f => f.description && (f.foodNutrients||[]).length > 0)
    .map(f => {
      const get = id => Math.round(((f.foodNutrients||[]).find(n=>n.nutrientId===id)?.value||0)*10)/10;
      return {
        product_name: _titleCase(f.description),
        product_name_de: null,
        brands: 'USDA',
        image_thumb_url: '',
        quantity: '',
        serving_quantity: f.servingSize || null,
        serving_size: f.servingSizeUnit ? `${Math.round(f.servingSize||0)}${f.servingSizeUnit}` : null,
        _source: 'usda', _srcLabel: 'USDA',
        nutriments: {
          'energy-kcal_100g':    get(1008),
          'proteins_100g':       get(1003),
          'carbohydrates_100g':  get(1005),
          'fat_100g':            get(1004)
        }
      };
    })
    .filter(p => getKcalPer100(p) > 0);
}
function _titleCase(s){ return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()); }

async function _searchAPILayer(query) {

  if (!key) return[];

let _fsToken = null; let _fsTokenExp = 0;
async function _getFSToken() {
  if (_fsToken && Date.now() < _fsTokenExp) return _fsToken;
  const id = getFSClientId(); const sec = getFSSecret();
  if (!id || !sec) return null;
  const r = await fetch(FS_TOKEN_URL, {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`grant_type=client_credentials&client_id=${encodeURIComponent(id)}&client_secret=${encodeURIComponent(sec)}&scope=basic`
  });
  if (!r.ok) return null;
  const d = await r.json();
  _fsToken = d.access_token; _fsTokenExp = Date.now() + (d.expires_in||3600)*1000 - 60000;
  return _fsToken;
}

async function _searchFatSecret(query) {
  const token = await _getFSToken();
  if (!token) return[];
  const enQuery = translateQuery(query);
  const url = `${FS_API_URL}?method=foods.search&search_expression=${encodeURIComponent(enQuery)}&format=json&max_results=10`;
  let data;
  try {
    data = await fetchWithRetry(url, { headers:{ 'Authorization':'Bearer '+token } });
  } catch(e) { return[]; }
  const foods = data.foods?.food ||[];
  return (Array.isArray(foods)?foods:[foods]).map(f => {
    const desc = f.food_description || '';
    const cal  = parseFloat(desc.match(/Calories:\s*([\d.]+)/i)?.[1]||0);
    const fat  = parseFloat(desc.match(/Fat:\s*([\d.]+)g/i)?.[1]||0);
    const carbs= parseFloat(desc.match(/Carbs:\s*([\d.]+)g/i)?.[1]||0);
    const prot = parseFloat(desc.match(/Protein:\s*([\d.]+)g/i)?.[1]||0);
    return {
      product_name: f.food_name || 'Unbekannt',
      brands: f.brand_name || 'FatSecret',
      image_thumb_url: '',
      quantity: f.food_type || '',
      serving_quantity: 100,
      serving_size: null,
      _source:'fs', _srcLabel:'FS',
      nutriments:{
        'energy-kcal_100g': Math.round(cal),
        'proteins_100g': Math.round(prot*10)/10,
        'carbohydrates_100g': Math.round(carbs*10)/10,
        'fat_100g': Math.round(fat*10)/10
      }
    };
  }).filter(p => getKcalPer100(p) > 0);
}

function _sortByRelevance(results, query) {
  const q = query.toLowerCase().trim();
  return results.slice().sort((a,b) => {
    const na = getProductName(a).toLowerCase();
    const nb = getProductName(b).toLowerCase();
    const score = n => {
      if (n === q)             return 0;
      if (n.startsWith(q+' ') || n.startsWith(q+',')) return 1;
      if (n.startsWith(q))     return 2;
      if (n.includes(q))       return 3;
      return 4 + n.length * 0.01;
    };
    return score(na) - score(nb);
  });
}

async function searchFoodDB(query) {
  const src = getDBSource();
  let results =[];

  if (src === 'off')           { results = await _searchOFF(query); }
  else if (src === 'usda')     { results = await _searchUSDA(query); }
  else if (src === 'apilayer') { results = await _searchAPILayer(query); }
  else if (src === 'fs')       { results = await _searchFatSecret(query); }
  else {
    const hasAPILayer = !!getAPILayerKey();
    const hasFS = !!(getFSClientId() && getFSSecret());
    const promises =[
      _searchOFF(query),
      _searchUSDA(query),
      hasAPILayer ? _searchAPILayer(query) : Promise.resolve([]),
      hasFS ? _searchFatSecret(query) : Promise.resolve([])
    ];
    const all = await Promise.allSettled(promises);
    const [offR, usdaR, apiLayerR, fsR] = all.map(r => r.status==='fulfilled' ? r.value :[]);
    const maxLen = Math.max(usdaR.length, apiLayerR.length, offR.length, fsR.length);
    for (let i = 0; i < maxLen; i++) {
      if (i < usdaR.length) results.push(usdaR[i]);
      if (i < apiLayerR.length) results.push(apiLayerR[i]);
      if (i < offR.length)  results.push(offR[i]);
      if (i < fsR.length)   results.push(fsR[i]);
    }
  }

  return _sortByRelevance(results, query);
}

async function fetchByBarcode(barcode) {
  const url = `${OFF_BASE}/api/v0/product/${barcode}.json?fields=${OFF_FIELDS}`;
  const data = await fetchWithRetry(url);
  if (data.status !== 1 || !data.product) throw new Error('Produkt nicht gefunden (Barcode: ' + barcode + ')');
  return { ...data.product, _source:'off', _srcLabel:'OFF' };
}

function getProductName(p) {
  return p.product_name_de || p.product_name || 'Unbekanntes Produkt';
}

function getKcalPer100(p) {
  const n = p.nutriments || {};
  return Math.round(n['energy-kcal_100g'] || (n['energy_100g'] ? n['energy_100g'] / 4.184 : 0));
}

function getNutrientsPer100(p) {
  const n = p.nutriments || {};
  return {
    calories: Math.round(n['energy-kcal_100g'] || (n['energy_100g'] ? n['energy_100g'] / 4.184 : 0)),
    protein:  Math.round((n['proteins_100g']       || 0) * 10) / 10,
    carbs:    Math.round((n['carbohydrates_100g']   || 0) * 10) / 10,
    fat:      Math.round((n['fat_100g']             || 0) * 10) / 10
  };
}

function calcForGrams(p, grams) {
  const per100 = getNutrientsPer100(p);
  const ratio = grams / 100;
  return {
    calories: Math.round(per100.calories * ratio),
    protein:  Math.round(per100.protein  * ratio * 10) / 10,
    carbs:    Math.round(per100.carbs    * ratio * 10) / 10,
    fat:      Math.round(per100.fat      * ratio * 10) / 10
  };
}

function getServingGrams(p) {
  if (p.serving_quantity && parseFloat(p.serving_quantity) > 0) {
    return parseFloat(p.serving_quantity);
  }
  if (p.serving_size) {
    const match = p.serving_size.match(/(\d+(?:[.,]\d+)?)\s*g/i);
    if (match) return parseFloat(match[1].replace(',','.'));
  }
  return null;
}

// ====================== STREAK & KOPIEREN ======================
function calcStreak() {
  let streak = 0;
  const d = new Date();
  const todayLog = load('log-' + today());
  if (todayLog && todayLog.meals && todayLog.meals.length > 0) streak = 1;
  for (let i = 1; i <= 365; i++) {
    d.setDate(d.getDate() - 1);
    const key = 'log-' + d.toISOString().split('T')[0];
    const data = load(key);
    if (data && data.meals && data.meals.length > 0) streak++;
    else break;
  }
  return streak;
}

function getWeeklyCalories() {
  const days =[];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = 'log-' + d.toISOString().split('T')[0];
    const data = load(key);
    const cal = data && data.meals ? sumMeals(data.meals).calories : 0;
    days.push({ label: d.toLocaleDateString('de-DE',{weekday:'short'}), cal, isToday: i === 0 });
  }
  return days;
}

window.copyYesterday = function(mealType) {
  const d = new Date(S.currentDate); 
  d.setDate(d.getDate() - 1);
  const yKey = 'log-' + d.toISOString().split('T')[0];
  const yLog = load(yKey);
  
  if(!yLog || !yLog.meals || !yLog.meals.length) return showToast('Keine Einträge von gestern gefunden.');
  
  const toCopy = yLog.meals.filter(m => m.mealType === mealType);
  if(!toCopy.length) return showToast('Keine Mahlzeiten dieses Typs von gestern gefunden.');
  
  const log = S.dayLog;
  toCopy.forEach(m => log.meals.push({...m, id:uid()}));
  S.saveDayLog(log);
  renderView('dashboard');
  showToast(`${toCopy.length} Mahlzeit(en) kopiert! ♻️`);
};

function getLastDaysLogs(days = 7){
  const logs =[];
  for(let i = 0; i < days; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = 'log-' + d.toISOString().split('T')[0];
    const data = load(key);
    if(data && data.meals && data.meals.length > 0){
      const totals = sumMeals(data.meals);
      logs.unshift({ date:key, displayDate:d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'}), totals, meals:data.meals });
    }
  }
  return logs;
}

window.startVoiceChat = function() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        return showToast('Spracherkennung wird leider in diesem Browser/Gerät nicht unterstützt.');
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'de-DE';
    recognition.start();
    showToast('🎙️ Höre zu... Bitte sprich jetzt.');
    
    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        const input = document.getElementById('chat-inp');
        if(input) { 
            input.value = (input.value + ' ' + text).trim(); 
        }
        showToast('Text verstanden!');
    };
    recognition.onerror = (e) => {
        showToast('Fehler bei der Spracherkennung');
    };
};

function renderChatMessages(){
  const container = document.getElementById('chat-msgs');
  if(!container) return;
  const msgs = getCurrentMessages();
  container.innerHTML = msgs.map((msg, i) => `<div class="chat-bubble ${msg.role === 'user' ? 'user' : 'bot'} ${i === msgs.length -1 ? 'scale-in' : ''}">${msg.text.replace(/\n/g, '<br>')}</div>`).join('');
  container.scrollTop = container.scrollHeight;
}

async function sendChat(){
  const inp = document.getElementById('chat-inp');
  const text = inp.value.trim();
  if(!text) return;
  
  let msgs = getCurrentMessages();
  msgs.push({role:'user', text});
  setCurrentMessages(msgs); 
  renderChatMessages();
  inp.value = '';
  
  const loading = document.createElement('div');
  loading.className = 'chat-bubble bot scale-in';
  loading.innerHTML = '<span style="display:inline-block;animation:spin 1s linear infinite;margin-right:6px">⚙️</span> Coach denkt nach...';
  const container = document.getElementById('chat-msgs');
  container.appendChild(loading);
  container.scrollTop = container.scrollHeight;
  
  try {
    let reply = await coachChat(text);
    
    // KI AUTO-TRACKING MAGIE
    const mealRegex = /\[TRACK_MEAL:\s*({[\s\S]*?})\s*\]/is;
    const mealMatch = reply.match(mealRegex);
    if(mealMatch) {
        try {
            const mealData = JSON.parse(mealMatch[1]);
            addMeal({
                name: mealData.name || 'KI-Snack',
                calories: parseInt(mealData.kcal) || 0,
                protein: parseFloat(mealData.p) || 0,
                carbs: parseFloat(mealData.c) || 0,
                fat: parseFloat(mealData.f) || 0,
                mealType: 'snack' 
            });
            reply = reply.replace(mealMatch[0], '').trim();
        } catch(err) { console.error('JSON Fehler Meal-Tracking', err); }
    }

    const actRegex = /\[TRACK_ACTIVITY:\s*({[\s\S]*?})\s*\]/is;
    const actMatch = reply.match(actRegex);
    if(actMatch) {
        try {
            const actData = JSON.parse(actMatch[1]);
            const log = S.dayLog;
            if(!log.activities) log.activities =[];
            log.activities.push({
                name: actData.name || 'KI-Sport',
                kcal: parseInt(actData.kcal) || 0,
                id: uid()
            });
            S.saveDayLog(log);
            showToast(`Sport eingetragen: +${actData.kcal} kcal zum Ziel!`);
            reply = reply.replace(actMatch[0], '').trim();
        } catch(err) { console.error('JSON Fehler Activity-Tracking', err); }
    }
    
    msgs = getCurrentMessages();
    msgs.push({role:'model', text: reply});
    setCurrentMessages(msgs); 
    loading.remove();
    renderChatMessages();

    const currChat = getCurrentChat();
    if (currChat && currChat.title === 'Neuer Chat') {
      const firstUser = msgs[0].text;
      currChat.title = firstUser.length > 32 ? firstUser.substring(0, 29) + '...' : firstUser;
      saveChats();
      const titleEl = document.getElementById('current-chat-title');
      if (titleEl) titleEl.textContent = currChat.title;
    }
  } catch(e){
    loading.textContent = '❌ ' + e.message;
  }
}

function sendQuickPrompt(text){
  const inp = document.getElementById('chat-inp');
  if(inp) { inp.value = text; sendChat(); }
}

  return `<div onclick="${onclick}('${id}')"

<div style="width:22px;height:22px;border-radius:50%;border:2px solid ${active?'var(--accent)':'var(--muted)'};background:${active?'var(--accent)':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;">

}

window.exportData = function() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    data[key] = localStorage.getItem(key);
  }
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kalorify_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
};

window.importData = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      for (const key in data) {
        localStorage.setItem(key, data[key]);
      }
      showToast('Daten erfolgreich importiert! Lade App neu...');
      setTimeout(() => location.reload(), 1500);
    } catch(err) {
      showToast('Fehler beim Importieren der JSON Datei.');
    }
  };
  reader.readAsText(file);
};

  profile.activityLevel = document.getElementById('prof-activity').value;

  const color = document.getElementById('prof-color').value;
  const themeSel = document.getElementById('prof-theme-sel').value;

function _renderAddModal(){
  const mc = document.getElementById('modal-container');
  mc.innerHTML = ` 
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()"> 
    <div class="modal-box scale-in" id="main-modal-box"> 
      <h2 style="margin-bottom:16px">Hinzufügen</h2> 
      <div class="add-tabs"> 
        <button class="add-tab ${currentAddTab==='ki'?'active':''}" onclick="switchAddTab('ki')">✨ KI Foto</button> 
        <button class="add-tab ${currentAddTab==='fav'?'active':''}" onclick="switchAddTab('fav')">⭐ Favoriten</button> 
        <button class="add-tab ${currentAddTab==='suche'?'active':''}" onclick="switchAddTab('suche')">🔍 Suche</button> 
        <button class="add-tab ${currentAddTab==='barcode'?'active':''}" onclick="switchAddTab('barcode')">📊 Barcode</button> 
        <button class="add-tab ${currentAddTab==='rezepte'?'active':''}" onclick="switchAddTab('rezepte')">🍳 Rezepte</button> 
        <button class="add-tab ${currentAddTab==='manuell'?'active':''}" onclick="switchAddTab('manuell')">✏️ Manuell</button> 
      </div> 
      <div id="add-tab-content"></div> 
    </div> 
  </div>`;
  _renderAddTabContent();
}

function switchAddTab(tab){
  if(tab !== 'barcode') stopBarcodeScanner();
  currentAddTab = tab;
  document.querySelectorAll('.add-tab').forEach((b,i) => {
    const tabs =['ki','fav','suche','barcode','rezepte','manuell'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  
  const cont = document.getElementById('add-tab-content');
  if(cont) {
      cont.style.opacity = '0';
      setTimeout(() => { _renderAddTabContent(); cont.style.opacity = '1'; }, 120);
  } else {
      _renderAddTabContent();
  }
}

function _renderAddTabContent(){
  const el = document.getElementById('add-tab-content');
  if(!el) return;
  el.style.transition = 'opacity 0.2s';
  if(currentAddTab === 'ki') el.innerHTML = _buildKITabHTML();
  else if(currentAddTab === 'fav') el.innerHTML = _buildFavTabHTML();
  else if(currentAddTab === 'suche') el.innerHTML = _buildSucheTabHTML();
  else if(currentAddTab === 'barcode') { el.innerHTML = _buildBarcodeTabHTML(); _initBarcodeSubTab(); }
  else if(currentAddTab === 'rezepte') el.innerHTML = _buildRezepteTabHTML();
  else if(currentAddTab === 'manuell') el.innerHTML = _buildManuellTabHTML();
}

    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'de-DE';
    recognition.start();
    showToast('🎙️ Höre zu...');
    
    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        const input = document.getElementById('ai-text');
        if(input) { 
            input.value = (input.value + ' ' + text).trim(); 
        }
        showToast('Text eingefügt!');
    };
    recognition.onerror = () => showToast('Fehler bei der Spracherkennung');
};

{ facingMode: ‘environment’ },
{ fps: 15, qrbox: { width: 280, height: 160 }, aspectRatio: 1.4 },
(decodedText) => {
stopBarcodeScanner();
if(statusEl) statusEl.innerHTML = `<span class="found">✅ ${decodedText} erfasst. Suche...</span>`;
_handleBarcodeDetected(decodedText, statusEl);
},
() => {}
).then(() => {
if(statusEl) statusEl.textContent = ‘📷 Platziere den Strichcode exakt in der Box.’;
}).catch(err => {
if(statusEl) statusEl.innerHTML = `<span style="color:var(--fat)">❌ Keine Kamera-Freigabe gefunden.</span>`;
});
} catch(e) {
if(statusEl) statusEl.innerHTML = `<span style="color:var(--fat)">❌ ${e.message}</span>`;
}
}

function stopBarcodeScanner(){
if(html5QrcodeInst){
try { html5QrcodeInst.stop().catch(()=>{}); } catch(e){}
html5QrcodeInst = null;
}
}

function setAmountChip(grams, idx){

function updateMacroPreview(){
const inp = document.getElementById(‘amount-grams-inp’);
if(!inp || !selectedProduct) return;
const grams = parseFloat(inp.value) || 0;
const n = calcForGrams(selectedProduct, grams);
const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
set(‘prev-kcal’, n.calories);
set(‘prev-prot’, n.protein + ‘g’);
set(‘prev-carbs’, n.carbs + ‘g’);
set(‘prev-fat’, n.fat + ‘g’);
const chipGrams = (window._amountChips ||[]).map(c => c.grams);
const matched = chipGrams.indexOf(grams);
document.querySelectorAll(’.amount-chip’).forEach((el, i) => el.classList.toggle(‘active’, i === matched));
}

function confirmAddDBMeal(){

const n = calcForGrams(selectedProduct, grams);
const name = getProductName(selectedProduct);
const brand = selectedProduct.brands ? ’ – ’ + selectedProduct.brands.split(’,’)[0].trim() : ‘’;
addMeal({
name: name + (brand && brand.length < 24 ? brand : ‘’),
calories: n.calories,
protein: n.protein,
carbs: n.carbs,
fat: n.fat,
mealType: tempMealType
});
closeModal();
}

function addRecipeMeal(){
if(!_currentRecipe) return;
const kcal = parseInt(document.getElementById(‘recipe-kcal-inp’)?.value) || 400;

calories: kcal,
protein: Math.round(kcal * 0.20 / 4),

mealType: tempMealType
});
_currentRecipe = null;
closeModal();

setTimeout(() => {
document.getElementById(‘modal-container’).innerHTML = ‘’;

} else {
document.getElementById(‘modal-container’).innerHTML = ‘’;
}

function showToast(msg){
const t = document.getElementById(‘toast’);
t.textContent = msg;
t.style.display = ‘block’;

// Animation reset
t.style.animation = ‘none’;
void t.offsetWidth;
t.style.animation = ‘fadeUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2)’;

clearTimeout(window._toastTimer);
window._toastTimer = setTimeout(() => {
t.style.animation = ‘fadeUp 0.25s reverse forwards’;
setTimeout(()=> {t.style.display = ‘none’;}, 250);
}, 2800);
}

function addMeal(meal){
const log = S.dayLog;
log.meals =[…log.meals, {…meal, id: uid()}];
S.saveDayLog(log);
if(currentView === ‘dashboard’) renderView(‘dashboard’);
showToast(`Eintrag gelistet: ${meal.calories} kcal 🔥`);
}

function removeMeal(id){
const log = S.dayLog;
log.meals = log.meals.filter(m => m.id !== id);
S.saveDayLog(log);
renderView(currentView);
}

function saveEditedMeal(id) {
const log = S.dayLog;
const idx = log.meals.findIndex(m => m.id === id);
if (idx < 0) return;
const activePill = document.querySelector(’#edit-meal-pills .pill.active’);
log.meals[idx] = {
…log.meals[idx],
calories: parseInt(document.getElementById(‘edit-cal’)?.value) || 0,
protein:  parseFloat(document.getElementById(‘edit-prot’)?.value) || 0,
carbs:    parseFloat(document.getElementById(‘edit-carbs’)?.value) || 0,
fat:      parseFloat(document.getElementById(‘edit-fat’)?.value) || 0,
mealType: activePill?.dataset?.id || log.meals[idx].mealType
};
S.saveDayLog(log);
closeModal();
renderView(‘dashboard’);
showToast(‘Sollten die Werte stimmen – Top! Wurde eingepflegt.’);
}
