<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kalorify • Gemini, Groq & Manus</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalorify">
<link rel="apple-touch-icon" href="https://placehold.co/192x192/AADF3C/000000.png?text=K">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07070F;--card:#0F0F1A;--card2:#161625;--border:#1E1E32;
  --accent:#AADF3C;--accent-dim:rgba(170,223,60,0.12);--accent-glow:rgba(170,223,60,0.25);
  --text:#EFEFFA;--muted:#52526E;--dim:#8888A8;
  --protein:#60A5FA;--carbs:#FBBF24;--fat:#F87171;--success:#4ADE80;
}
.light-mode{
  --bg:#F8F9FA;--card:#FFFFFF;--card2:#F1F3F5;--border:#E0E0E0;
  --text:#1A1A1A;--muted:#666666;--dim:#999999;
}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow:hidden}
::-webkit-scrollbar{display:none}
input,textarea,button,select{font-family:inherit;outline:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{resize:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-up{animation:fadeUp .28s ease forwards}
.scale-in{animation:scaleIn .25s ease forwards}
button:active{transform:scale(.95);transition:transform .08s}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;background:var(--bg)}
#views{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:72px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:8px 0 20px;z-index:50}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 14px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.5px}
.nav-btn.active{color:var(--accent)}
#add-fab{width:56px;height:56px;border-radius:18px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px var(--accent-glow);margin-top:-10px;flex-shrink:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;transition:padding 0.2s}
.inp{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:14px;width:100%;transition:all 0.2s}
.btn{border:none;border-radius:14px;cursor:pointer;font-weight:700;padding:13px 20px;background:var(--accent);color:#000;transition:all 0.2s}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end}
.modal-box{background:var(--card);border-radius:24px 24px 0 0;padding:22px;width:100%;max-height:92vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--success);color:#000;border-radius:20px;padding:9px 20px;font-weight:700;z-index:300;display:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--card2);border:1px solid var(--border);border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
.pill.active{background:var(--accent);color:#000;border-color:var(--accent)}
.chat-bubble{max-width:80%;padding:12px 16px;border-radius:20px;margin-bottom:8px}
.chat-bubble.user{background:var(--accent);color:#000;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.bot{background:var(--card2);align-self:flex-start;border-bottom-left-radius:4px}
.onboarding-screen{display:flex;flex-direction:column;height:100vh;padding:20px;background:var(--bg);color:var(--text)}
.macro-bar{height:8px;background:var(--border);border-radius:9999px;overflow:hidden;margin-top:4px}
.macro-fill{height:100%;transition:width .4s}

/* Compact Mode */
.compact-mode .card { padding: 14px; border-radius:16px; }
.compact-mode .inp { padding: 9px 12px; font-size: 13px; }
.compact-mode .btn { padding: 11px 16px; border-radius:12px; }
.compact-mode h1 { font-size: 24px; margin-bottom: 12px; }
.compact-mode .macro-preview { padding: 10px; margin: 10px 0; }
.compact-mode .food-result-item { padding: 10px; margin-bottom: 6px; }
.compact-mode .nav-btn { padding: 2px 10px; }

/* Color Picker */
.color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.color-dot.active { border-color: var(--text); transform: scale(1.15); }

/* Water tracker */
.water-btn{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px 0;font-size:13px;font-weight:700;cursor:pointer;color:var(--text);flex:1;text-align:center;transition:all .15s}
.water-btn:active{background:var(--accent-dim);border-color:var(--accent)}
/* Weight chart */
.weight-dot{cursor:pointer;transition:r .15s}
/* Recipe card */
.recipe-card{background:var(--card2);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:0}
.recipe-card-img{width:72px;height:72px;object-fit:cover;flex-shrink:0;background:var(--border)}
.recipe-card-info{padding:10px 12px;flex:1;min-width:0}
.recipe-card-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe-card-meta{font-size:12px;color:var(--muted);margin-top:3px}
.toggle-switch{position:relative;display:inline-block;width:52px;height:28px}
.toggle-switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:9999px;transition:.3s}
.slider:before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background:var(--text);border-radius:50%;transition:.3s}
input:checked + .slider{background:var(--accent)}
input:checked + .slider:before{transform:translateX(24px);background:#000}

/* –– ADD MODAL TABS –– */
.add-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--card2);border-radius:16px;padding:4px}
.add-tab{flex:1;border:none;border-radius:12px;padding:10px 6px;font-weight:700;font-size:12px;cursor:pointer;background:transparent;color:var(--muted);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px}
.add-tab.active{background:var(--accent);color:#000}

/* –– FOOD DB SEARCH –– */
.search-row{display:flex;gap:8px;margin-bottom:12px}
.food-result-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.food-result-item:active{border-color:var(--accent)}
.food-result-img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--border);flex-shrink:0}
.food-result-info{flex:1;min-width:0}
.food-result-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-result-brand{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-result-kcal{font-size:13px;color:var(--accent);font-weight:700;flex-shrink:0}
.food-loading{text-align:center;padding:30px;color:var(--muted);animation:pulse 1.2s infinite}
.food-empty{text-align:center;padding:30px;color:var(--muted)}
.food-empty-icon{font-size:40px;margin-bottom:8px}

/* –– AMOUNT SELECTOR –– */
.amount-header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.amount-product-img{width:60px;height:60px;border-radius:14px;object-fit:cover;background:var(--card2);border:1px solid var(--border);flex-shrink:0}
.amount-product-name{font-weight:700;font-size:16px;line-height:1.3}
.amount-product-brand{font-size:13px;color:var(--muted);margin-top:2px}
.amount-chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.amount-chip{background:var(--card2);border:1px solid var(--border);border-radius:9999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.amount-chip.active{background:var(--accent);color:#000;border-color:var(--accent)}
.macro-preview{background:var(--card2);border-radius:14px;padding:14px;margin:14px 0}
.macro-preview-title{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.macro-preview-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;text-align:center}
.macro-preview-val{font-size:18px;font-weight:800}
.macro-preview-label{font-size:10px;color:var(--muted);margin-top:2px}
.amount-input-row{display:flex;gap:8px;align-items:center}
.amount-input-row input{flex:1;font-size:18px;font-weight:700;text-align:center}

/* –– BARCODE –– */
.barcode-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--card2);border-radius:14px;padding:3px}
.barcode-tab{flex:1;border:none;border-radius:11px;padding:9px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:var(--muted);transition:all .18s}
.barcode-tab.active{background:var(--card);color:var(--text);border:1px solid var(--border)}
#barcode-reader-container{border-radius:16px;overflow:hidden;background:#000;margin-bottom:12px}
#barcode-reader-container video{width:100%!important;object-fit:cover}
#barcode-reader-container img{display:none!important}
#barcode-reader{width:100%}
.barcode-status{text-align:center;padding:10px;font-size:13px;color:var(--muted)}
.barcode-status.found{color:var(--success)}
.barcode-status.error{color:var(--fat)}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app" style="display:none">
  <div id="views"></div>
  <nav id="nav">
    <button class="nav-btn active" data-view="dashboard" onclick="navigate('dashboard')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      HEUTE
    </button>
    <button class="nav-btn" data-view="chat" onclick="navigate('chat')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      COACH
    </button>
    <button id="add-fab" onclick="openAddModal()">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="nav-btn" data-view="history" onclick="navigate('history')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      VERLAUF
    </button>
    <button class="nav-btn" data-view="profile" onclick="navigate('profile')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      PROFIL
    </button>
  </nav>
</div>
<div id="onboarding" class="onboarding-screen" style="display:none"></div>
<div id="modal-container"></div>

<script>
// ====================== SICHERER STORAGE ======================
function load(k) {
  try { return localStorage.getItem(k) ? JSON.parse(localStorage.getItem(k)) : null; }
  catch(e) { return null; }
}
function store(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}
const S = {
  profile: null,
  chatHistory: [],
  get todayKey(){ return 'log-' + today(); },
  get todayLog(){ return load(this.todayKey) || {meals:[]}; },
  saveTodayLog(log){ store(this.todayKey, log); },
  get geminiKey(){ return load('geminiApiKey') || ''; },
  setGeminiKey(k){ store('geminiApiKey', k); },
  loadProfile(){ return load('profile'); },
  saveProfile(p){ store('profile', p); this.profile = p; },
  get waterKey(){ return 'water-' + today(); },
  get todayWater(){ return load(this.waterKey) || 0; },
  addWater(ml){ const v = this.todayWater + ml; store(this.waterKey, v); return v; },
  setWater(ml){ store(this.waterKey, ml); },
  logWeight(kg){ const logs = load('weightLog') || []; const entry = {date:today(), kg}; const idx = logs.findIndex(e=>e.date===today()); if(idx>=0) logs[idx]=entry; else logs.push(entry); store('weightLog',logs); },
  getWeightLog(){ return load('weightLog') || []; }
};
function today(){ return new Date().toISOString().split('T')[0]; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ====================== THEME & DESIGN ======================
function applyTheme(opts) {
  if (typeof opts === 'string') opts = { theme: opts };
  if (!opts) opts = { theme: 'dark', accentColor: 'lime', compactMode: false };

  const theme = opts.theme || 'dark';
  const compact = opts.compactMode || false;
  const color = opts.accentColor || 'lime';

  document.documentElement.classList.toggle('light-mode', theme === 'light');
  document.documentElement.classList.toggle('compact-mode', compact);

  const COLORS = {
    lime: { accent: '#AADF3C', dim: 'rgba(170,223,60,0.12)', glow: 'rgba(170,223,60,0.25)' },
    blue: { accent: '#60A5FA', dim: 'rgba(96,165,250,0.12)', glow: 'rgba(96,165,250,0.25)' },
    purple: { accent: '#A78BFA', dim: 'rgba(167,139,250,0.12)', glow: 'rgba(167,139,250,0.25)' },
    orange: { accent: '#FB923C', dim: 'rgba(251,146,60,0.12)', glow: 'rgba(251,146,60,0.25)' },
    pink: { accent: '#F472B6', dim: 'rgba(244,114,182,0.12)', glow: 'rgba(244,114,182,0.25)' }
  };

  const c = COLORS[color] || COLORS.lime;
  document.documentElement.style.setProperty('--accent', c.accent);
  document.documentElement.style.setProperty('--accent-dim', c.dim);
  document.documentElement.style.setProperty('--accent-glow', c.glow);
}

// Direktes Aktualisieren und dauerhaftes Speichern der Design-Einstellungen
function updateAndSaveTheme() {
  const isLight = document.getElementById('prof-theme-toggle').checked;
  const isCompact = document.getElementById('prof-compact-toggle').checked;
  const color = document.getElementById('prof-color').value;

  const opts = { theme: isLight ? 'light' : 'dark', compactMode: isCompact, accentColor: color };
  applyTheme(opts);

  if (S.profile) {
    S.profile.theme = opts.theme;
    S.profile.compactMode = opts.compactMode;
    S.profile.accentColor = opts.accentColor;
    S.saveProfile(S.profile);
  }
}

function selectColor(c) {
  document.getElementById('prof-color').value = c;
  document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  updateAndSaveTheme();
}

// ====================== CALCULATIONS ======================
const ACT = {
  sedentary:{label:'Kaum aktiv (kein Sport)',mult:1.2},
  light:{label:'Leicht aktiv (1–2×/Woche)',mult:1.375},
  moderate:{label:'Moderat aktiv (3–5×/Woche)',mult:1.55},
  active:{label:'Sehr aktiv (6–7×/Woche)',mult:1.725}
};
const GOAL_ADJ = {lose:-500, maintain:0, muscle:300};
const MEAL_TYPES = [
  {id:'breakfast',label:'Frühstück',emoji:'🌅'},
  {id:'lunch',label:'Mittagessen',emoji:'☀️'},
  {id:'dinner',label:'Abendessen',emoji:'🌙'},
  {id:'snack',label:'Snack',emoji:'🍎'}
];
function calcTDEE(p){
  if(!p?.weight) return {calories:2800,protein:140,carbs:330,fat:80};
  const bmr = p.gender==='female'
    ? 447.593 + 9.247*p.weight + 3.098*p.height - 4.33*p.age
    : 88.362 + 13.397*p.weight + 4.799*p.height - 5.677*p.age;
  const cal = Math.round(bmr * (ACT[p.activityLevel]?.mult || 1.55) + (GOAL_ADJ[p.goal] || 0));
  const prot = Math.round(p.weight * 1.8);
  const fat = Math.round(cal * 0.25 / 9);
  const carbs = Math.round((cal - prot*4 - fat*9) / 4);
  return { calories: Math.max(1200, cal), protein: prot, carbs: Math.max(0, carbs), fat: fat };
}
function sumMeals(meals=[]){
  return meals.reduce((a,m)=>({
    calories: a.calories + (m.calories||0),
    protein: a.protein + (m.protein||0),
    carbs: a.carbs + (m.carbs||0),
    fat: a.fat + (m.fat||0)
  }),{calories:0,protein:0,carbs:0,fat:0});
}

// ====================== AI ENGINE ======================
function getAIProvider(){ return (S.profile && S.profile.aiProvider) || 'gemini'; }
function getGroqKey(){ return load('groqApiKey') || ''; }
function getManusKey(){ return load('manusApiKey') || ''; }

function buildDayContext() {
  const log = S.todayLog;
  const targets = calcTDEE(S.profile);
  const totals = sumMeals(log.meals);
  if (!log.meals.length) return 'Der Nutzer hat heute noch nichts gegessen.';
  const mealList = log.meals.map(m =>
    `- ${m.name} (${MEAL_TYPES.find(t=>t.id===m.mealType)?.label||'Mahlzeit'}): ${m.calories} kcal | P:${m.protein}g KH:${m.carbs}g F:${m.fat}g`
  ).join('\n');
  return `Heutige Mahlzeiten des Nutzers:\n${mealList}\n\nSumme heute: ${totals.calories} kcal | Protein: ${totals.protein}g | Kohlenhydrate: ${totals.carbs}g | Fett: ${totals.fat}g\nTages-Ziele: ${targets.calories} kcal | P: ${targets.protein}g | KH: ${targets.carbs}g | F: ${targets.fat}g\nRestkapazität: ${targets.calories - totals.calories} kcal | P: ${targets.protein - totals.protein}g | KH: ${targets.carbs - totals.carbs}g | F: ${targets.fat - totals.fat}g`;
}

function buildCoachSystemPrompt() {
  const p = S.profile || {};
  const dayCtx = buildDayContext();
  return `Du bist “Kalorify Coach” – ein intelligenter, motivierender deutscher Ernährungscoach.

NUTZERPROFIL:
- Geschlecht: ${p.gender === 'male' ? 'Männlich' : 'Weiblich'}, Alter: ${p.age||'?'} Jahre
- Gewicht: ${p.weight||'?'} kg, Größe: ${p.height||'?'} cm
- Aktivität: ${ACT[p.activityLevel]?.label || '?'}
- Ziel: ${p.goal === 'lose' ? 'Abnehmen' : p.goal === 'muscle' ? 'Muskelaufbau' : 'Gewicht halten'}

HEUTIGE ERNÄHRUNG:
${dayCtx}

ANWEISUNGEN:
- Antworte IMMER auf Deutsch, freundlich und konkret.
- Beziehe dich auf die heutigen Mahlzeiten und Makros wenn relevant.
- Gib spezifische, umsetzbare Tipps – keine leeren Phrasen.
- Erwähne bei Bedarf konkrete Lebensmittel die noch fehlen.
- Halte Antworten kompakt (3–6 Sätze).`;
}

// -- GEMINI --
async function callGemini(contents) {
  const key = S.geminiKey;
  if (!key) throw new Error('Kein Gemini API-Key. Bitte im Profil eintragen.');
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ contents })
  });
  if (!r.ok) {
    let errText = ''; try { errText = await r.text(); } catch(e){}
    const isQuota = errText.includes('quota') || errText.includes('rate') || r.status === 429;
    throw new Error(isQuota ? 'Gemini Rate-Limit – warte kurz' : `Gemini Fehler (${r.status})`);
  }
  const data = await r.json();
  return (data.candidates?.[0]?.content?.parts?.[0]?.text || '').replace(/`json\n?|\n?`/g, '').trim();
}

async function geminiChatCall(userMessage, systemPrompt) {
  const history = S.chatHistory || [];
  const contents = [];
  contents.push({ role:'user',  parts:[{ text: systemPrompt }] });
  contents.push({ role:'model', parts:[{ text: 'Verstanden! Ich bin dein Kalorify Coach. 🍏' }] });
  history.forEach(msg => contents.push({ role: msg.role==='user'?'user':'model', parts:[{ text: msg.text }] }));
  contents.push({ role:'user', parts:[{ text: userMessage }] });
  return await callGemini(contents);
}

// -- GROQ --
async function callGroq(messages) {
  const key = getGroqKey();
  if (!key) throw new Error('Kein Groq API-Key. Bitte im Profil eintragen.');
  const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },

async function fetchWithRetry(url, opts = {}, maxRetries = 3, timeoutMs = 9000) {
  let lastErr;
  for (let attempt = 0; attempt < maxRetries; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(url, { ...opts, signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch(e) {
      clearTimeout(timer);
      lastErr = e;
      if (attempt < maxRetries - 1) await new Promise(res => setTimeout(res, 900*(attempt+1)));
    }
  }
  throw lastErr || new Error('Netzwerkfehler');
}

async function _searchOFF(query) {
  const url = `${OFF_BASE}/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20&lc=de&fields=${OFF_FIELDS}`;
  let data;
  try { data = await fetchWithRetry(url); } catch(e) { return []; }
  let products = (data.products || [])
    .filter(p => (p.product_name || p.product_name_de) && getKcalPer100(p) > 0)
    .map(p => ({ ...p, _source:'off', _srcLabel:'OFF' }));
  if (products.length < 5) {
    const enQ = translateQuery(query);
    if (enQ !== query) {
      const url2 = `${OFF_BASE}/cgi/search.pl?search_terms=${encodeURIComponent(enQ)}&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`;
      try {
        const data2 = await fetchWithRetry(url2);
        const extra = (data2.products||[])
          .filter(p=>(p.product_name||p.product_name_de)&&getKcalPer100(p)>0)
          .map(p=>({...p,_source:'off',_srcLabel:'OFF'}));
        products = [...products, ...extra];
      } catch(e){}
    }
  }
  return products;
}

let _fsToken = null; let _fsTokenExp = 0;
async function _getFSToken() {
  if (_fsToken && Date.now() < _fsTokenExp) return _fsToken;
  const id = getFSClientId(); const sec = getFSSecret();
  if (!id || !sec) return null;
  const r = await fetch(FS_TOKEN_URL, {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`grant_type=client_credentials&client_id=${encodeURIComponent(id)}&client_secret=${encodeURIComponent(sec)}&scope=basic`
  });
  if (!r.ok) return null;
  const d = await r.json();
  _fsToken = d.access_token; _fsTokenExp = Date.now() + (d.expires_in||3600)*1000 - 60000;
  return _fsToken;
}
async function _searchFatSecret(query) {
  const token = await _getFSToken();
  if (!token) return [];
  const enQuery = translateQuery(query);
  const url = `${FS_API_URL}?method=foods.search&search_expression=${encodeURIComponent(enQuery)}&format=json&max_results=10`;
  let data;
  try {
    data = await fetchWithRetry(url, { headers:{ 'Authorization':'Bearer '+token } });
  } catch(e) { return []; }
  const foods = data.foods?.food || [];
  return (Array.isArray(foods)?foods:[foods]).map(f => {
    const desc = f.food_description || '';
    const cal  = parseFloat(desc.match(/Calories:\s*([\d.]+)/i)?.[1]||0);
    const fat  = parseFloat(desc.match(/Fat:\s*([\d.]+)g/i)?.[1]||0);
    const carbs= parseFloat(desc.match(/Carbs:\s*([\d.]+)g/i)?.[1]||0);
    const prot = parseFloat(desc.match(/Protein:\s*([\d.]+)g/i)?.[1]||0);
    return {
      product_name: f.food_name || 'Unbekannt',
      brands: f.brand_name || 'FatSecret',
      image_thumb_url: '',
      quantity: f.food_type || '',
      serving_quantity: 100,
      serving_size: null,
      _source:'fs', _srcLabel:'FS',
      nutriments:{
        'energy-kcal_100g': Math.round(cal),
        'proteins_100g': Math.round(prot*10)/10,
        'carbohydrates_100g': Math.round(carbs*10)/10,
        'fat_100g': Math.round(fat*10)/10
      }
    };
  }).filter(p => getKcalPer100(p) > 0);
}

function _sortByRelevance(results, query) {
  const q = query.toLowerCase().trim();
  return results.slice().sort((a,b) => {
    const na = getProductName(a).toLowerCase();
    const nb = getProductName(b).toLowerCase();
    const score = n => {
      if (n === q)             return 0;
      if (n.startsWith(q+' ') || n.startsWith(q+',')) return 1;
      if (n.startsWith(q))     return 2;
      if (n.includes(q))       return 3;
      return 4 + n.length * 0.01;
    };
    return score(na) - score(nb);
  });
}

async function searchFoodDB(query) {
  const src = getDBSource();
  let results = [];

  if (src === 'off')           { results = await _searchOFF(query); }
  else if (src === 'usda')     { results = await _searchUSDA(query); }
  else if (src === 'apilayer') { results = await _searchAPILayer(query); }
  else if (src === 'fs')       { results = await _searchFatSecret(query); }
  else {
    const hasAPILayer = !!getAPILayerKey();
    const hasFS = !!(getFSClientId() && getFSSecret());
    const promises = [
      _searchOFF(query),
      _searchUSDA(query),
      hasAPILayer ? _searchAPILayer(query) : Promise.resolve([]),
      hasFS ? _searchFatSecret(query) : Promise.resolve([])
    ];
    const all = await Promise.allSettled(promises);
    const [offR, usdaR, apiLayerR, fsR] = all.map(r => r.status==='fulfilled' ? r.value : []);
    const maxLen = Math.max(usdaR.length, apiLayerR.length, offR.length, fsR.length);
    for (let i = 0; i < maxLen; i++) {
      if (i < usdaR.length) results.push(usdaR[i]);
      if (i < apiLayerR.length) results.push(apiLayerR[i]);
      if (i < offR.length)  results.push(offR[i]);
      if (i < fsR.length)   results.push(fsR[i]);
    }
  }

  return _sortByRelevance(results, query);
}

function getProductName(p) {
  return p.product_name_de || p.product_name || 'Unbekanntes Produkt';
}

function getKcalPer100(p) {
  const n = p.nutriments || {};
  return Math.round(n['energy-kcal_100g'] || (n['energy_100g'] ? n['energy_100g'] / 4.184 : 0));
}

function getNutrientsPer100(p) {
  const n = p.nutriments || {};
  return {
    calories: Math.round(n['energy-kcal_100g'] || (n['energy_100g'] ? n['energy_100g'] / 4.184 : 0)),
    protein:  Math.round((n['proteins_100g']       || 0) * 10) / 10,
    carbs:    Math.round((n['carbohydrates_100g']   || 0) * 10) / 10,
    fat:      Math.round((n['fat_100g']             || 0) * 10) / 10
  };
}

function calcForGrams(p, grams) {
  const per100 = getNutrientsPer100(p);
  const ratio = grams / 100;
  return {
    calories: Math.round(per100.calories * ratio),
    protein:  Math.round(per100.protein  * ratio * 10) / 10,
    carbs:    Math.round(per100.carbs    * ratio * 10) / 10,
    fat:      Math.round(per100.fat      * ratio * 10) / 10
  };
}

function getServingGrams(p) {
  if (p.serving_quantity && parseFloat(p.serving_quantity) > 0) {
    return parseFloat(p.serving_quantity);
  }
  if (p.serving_size) {
    const match = p.serving_size.match(/(\d+(?:[.,]\d+)?)\s*g/i);
    if (match) return parseFloat(match[1].replace(',','.'));
  }
  return null;
}

// ====================== STREAK ======================
function calcStreak() {
  let streak = 0;
  const d = new Date();
  // Don't count today unless there are meals
  const todayLog = load('log-' + today());
  if (todayLog && todayLog.meals && todayLog.meals.length > 0) streak = 1;
  for (let i = 1; i <= 365; i++) {
    d.setDate(d.getDate() - 1);
    const key = 'log-' + d.toISOString().split('T')[0];
    const data = load(key);
    if (data && data.meals && data.meals.length > 0) streak++;
    else break;
  }
  return streak;
}

function getWeeklyCalories() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = 'log-' + d.toISOString().split('T')[0];
    const data = load(key);
    const cal = data && data.meals ? sumMeals(data.meals).calories : 0;
    days.push({ label: d.toLocaleDateString('de-DE',{weekday:'short'}), cal, isToday: i === 0 });
  }
  return days;
}

// ====================== HISTORY ======================
function getLastDaysLogs(days = 7){
  const logs = [];
  for(let i = 0; i < days; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = 'log-' + d.toISOString().split('T')[0];
    const data = load(key);
    if(data && data.meals && data.meals.length > 0){
      const totals = sumMeals(data.meals);
      logs.unshift({ date:key, displayDate:d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'}), totals, meals:data.meals });
    }
  }
  return logs;
}

function renderHistory(el){
  const logs = getLastDaysLogs(14);

  if(wLog.length >= 2){

    const xScale = i => pad + (i/(wLog.length-1))*(W-pad*2);
    const yScale = k => pad + (1-(k-minK)/(maxK-minK))*(H-pad*1.5);
    const pathD = wLog.map((e,i) => `${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(e.kg).toFixed(1)}`).join(' ');

    const lastEntry = wLog[wLog.length-1];
    const firstEntry = wLog[0];
    const diff = (lastEntry.kg - firstEntry.kg).toFixed(1);

  }

  const weightListHTML = wLog.length === 0
    ? `<div class="card" style="padding:50px 20px;text-align:center;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">⚖️</div><p>Noch keine Gewichtseinträge</p><p style="font-size:13px;margin-top:4px">Trage dein Gewicht auf dem Dashboard ein</p></div>`
    : wLog.slice().reverse().slice(0,10).map(e=>` <div class="card" style="margin-bottom:8px;padding:14px;display:flex;justify-content:space-between;align-items:center"> <div style="color:var(--muted);font-size:13px">${new Date(e.date+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}</div> <div style="font-size:20px;font-weight:800">${e.kg} <span style="font-size:12px;color:var(--muted);font-weight:400">kg</span></div> </div>`).join('');

  const essenHTML = logs.length === 0
    ? `<div class="card" style="padding:50px 20px;text-align:center;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">📅</div><p>Noch keine Einträge</p></div>`
    : logs.map(log=>` <div class="card" style="margin-bottom:10px;padding:14px"> <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"> <div><div style="font-weight:700">${log.displayDate}</div><div style="font-size:12px;color:var(--muted)">${log.meals.length} Mahlzeiten</div></div> <div style="text-align:right"><div style="font-size:22px;font-weight:800;color:var(--accent)">${log.totals.calories}</div><div style="font-size:12px;color:var(--muted)">kcal</div></div> </div> <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;color:var(--muted);text-align:center"> <div style="background:var(--card2);border-radius:8px;padding:5px"><span style="color:var(--protein);font-weight:700">${log.totals.protein}g</span><br>Protein</div> <div style="background:var(--card2);border-radius:8px;padding:5px"><span style="color:var(--carbs);font-weight:700">${log.totals.carbs}g</span><br>Kohlenhydr.</div> <div style="background:var(--card2);border-radius:8px;padding:5px"><span style="color:var(--fat);font-weight:700">${log.totals.fat}g</span><br>Fett</div> </div> </div>`).join('');

  ];
  el.innerHTML = `<div style="padding:16px;display:flex;flex-direction:column;height:calc(100vh - 72px)">

        <div style="font-size:12px;color:var(--muted);margin-top:2px">
          ${totals.calories} / ${targets.calories} kcal • P${totals.protein}g KH${totals.carbs}g F${totals.fat}g
        </div>
      </div>
      <button onclick="clearChat()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--card2)">Leeren</button>
    </div>
    <div id="chat-msgs" style="flex:1;overflow-y:auto;background:var(--card2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px"></div>
    ${S.chatHistory.length === 0 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
      ${quickPrompts.map(q => `<button onclick="sendQuickPrompt('${q}')" style="background:var(--card2);border:1px solid var(--border);border-radius:9999px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text)">${q}</button>`).join('')}
    </div>` : ''}
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="chat-inp" class="inp" placeholder="Frag den Coach..." onkeydown="if(event.key==='Enter')sendChat()" style="flex:1">
      <button onclick="sendChat()" class="btn" style="padding:13px 20px;flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>`;
  renderChatMessages();
}
function clearChat(){
  S.chatHistory = [];
  store('chatHistory', []);
  renderView('chat');
}
function sendQuickPrompt(text){
  const inp = document.getElementById('chat-inp');
  if(inp) { inp.value = text; sendChat(); }
  else { S.chatHistory.push({role:'user', text}); sendChat(); }
}
function renderChatMessages(){
  const container = document.getElementById('chat-msgs');
  if(!container) return;
  container.innerHTML = S.chatHistory.map(msg => `<div class="chat-bubble ${msg.role === 'user' ? 'user' : 'bot'}">${msg.text}</div>`).join('');
  container.scrollTop = container.scrollHeight;
}
async function sendChat(){
  const inp = document.getElementById('chat-inp');
  const text = inp.value.trim();
  if(!text) return;
  S.chatHistory.push({role:'user', text});
  renderChatMessages();
  inp.value = '';
  const loading = document.createElement('div');
  loading.className = 'chat-bubble bot';
  loading.textContent = 'Coach denkt nach…';
  const container = document.getElementById('chat-msgs');
  container.appendChild(loading);
  container.scrollTop = container.scrollHeight;
  try {
    const reply = await coachChat(text);
    S.chatHistory.push({role:'model', text: reply});
    store('chatHistory', S.chatHistory);
    loading.remove();
    renderChatMessages();
  } catch(e){
    loading.textContent = '❌ ' + e.message;
  }
}

function openAddModal(){
  aiPhoto = null;

  currentAddTab = 'ki';
  _renderAddModal();
}

function _renderAddModal(){
  const mc = document.getElementById('modal-container');
  mc.innerHTML = ` <div class="modal-overlay" onclick="if(event.target===this)closeModal()"> <div class="modal-box scale-in" id="main-modal-box"> <h2 style="margin-bottom:16px">Essen hinzufügen</h2> <div class="add-tabs"> <button class="add-tab ${currentAddTab==='ki'?'active':''}" onclick="switchAddTab('ki')">✨ KI</button> <button class="add-tab ${currentAddTab==='suche'?'active':''}" onclick="switchAddTab('suche')">🔍 DB</button> <button class="add-tab ${currentAddTab==='barcode'?'active':''}" onclick="switchAddTab('barcode')">📊 Scan</button> <button class="add-tab ${currentAddTab==='rezepte'?'active':''}" onclick="switchAddTab('rezepte')">🍳 Rezepte</button> </div> <div id="add-tab-content"></div> </div> </div>`;
  _renderAddTabContent();
}

function switchAddTab(tab){
  if(tab !== 'barcode') stopBarcodeScanner();
  currentAddTab = tab;
  document.querySelectorAll('.add-tab').forEach((b,i) => {
    const tabs = ['ki','suche','barcode','rezepte'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  _renderAddTabContent();
}

function _renderAddTabContent(){
  const el = document.getElementById('add-tab-content');
  if(!el) return;
  if(currentAddTab === 'ki') el.innerHTML = _buildKITabHTML();
  else if(currentAddTab === 'suche') el.innerHTML = _buildSucheTabHTML();
  else if(currentAddTab === 'barcode') { el.innerHTML = _buildBarcodeTabHTML(); _initBarcodeSubTab(); }
  else if(currentAddTab === 'rezepte') el.innerHTML = _buildRezepteTabHTML();
}

function _buildKITabHTML(){
  const previewHTML = aiPhoto ? `<div style="margin-bottom:16px;text-align:center"><img src="${aiPhoto}" style="max-height:200px;border-radius:16px;width:100%;object-fit:contain"></div>` : '';
  return ` ${previewHTML} <textarea id="ai-text" class="inp" rows="3" placeholder="Beschreibe das Essen (z. B. 200g Hähnchen mit Reis)"></textarea> <div style="margin:16px 0;display:flex;gap:6px;flex-wrap:wrap" id="meal-pills"></div> <div style="display:flex;gap:8px;margin-bottom:16px"> <button onclick="startAICamera()" class="btn btn-ghost" style="flex:1">📷 Kamera</button> <button onclick="openMediathek()" class="btn btn-ghost" style="flex:1">🖼️ Mediathek</button> <input type="file" id="mediathek-inp" accept="image/*" style="display:none" onchange="handleMediathekFile(this)"> </div> <button onclick="analyzeAI()" class="btn" style="width:100%" id="ai-analyze-btn">✨ Mit KI analysieren</button> <button onclick="closeModal()" class="btn btn-ghost" style="width:100%;margin-top:8px">Abbrechen</button>`;
}

function _renderMealPills(){
  const mp = document.getElementById('meal-pills');
  if(!mp) return;
  mp.innerHTML = MEAL_TYPES.map(t => `<div onclick="selectMealType('${t.id}')" class="pill ${tempMealType === t.id ? 'active' : ''}">${t.emoji} ${t.label}</div>`).join('');
}

function selectMealType(id){
  tempMealType = id;
  _renderMealPills();
}

function openMediathek(){
  const inp = document.getElementById('mediathek-inp');
  if(inp) inp.click();
}
function handleMediathekFile(input){
  const file = input.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    aiPhoto = e.target.result;
    currentAddTab = 'ki';
    _renderAddModal();
    setTimeout(_renderMealPills, 50);
  };
  reader.readAsDataURL(file);
}

function startAICamera(){
  const mc = document.getElementById('modal-container');
  mc.innerHTML = ` <div class="modal-overlay"> <div class="modal-box" style="padding:0"> <div style="position:relative;background:#000"> <video id="camera-video" autoplay playsinline style="width:100%;height:420px;object-fit:cover"></video> <canvas id="camera-canvas" style="display:none"></canvas> <div style="position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:16px;padding:0 20px"> <button onclick="capturePhoto()" style="width:72px;height:72px;border-radius:50%;background:var(--accent);color:#000;font-size:32px;box-shadow:0 0 30px var(--accent-glow);display:flex;align-items:center;justify-content:center">📸</button> <button onclick="closeCameraModal()" class="btn btn-ghost" style="padding:0 32px;height:72px;border-radius:9999px">Abbrechen</button> </div> </div> </div> </div>`;
  const video = document.getElementById('camera-video');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
    cameraStream = stream;
    video.srcObject = stream;
  }).catch(() => {
    showToast('Kamera nicht verfügbar');
    closeModal();
  });
}
function capturePhoto(){
  const video = document.getElementById('camera-video');
  const canvas = document.getElementById('camera-canvas');
  canvas.width = video.videoWidth || 1080;
  canvas.height = video.videoHeight || 1080;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  aiPhoto = canvas.toDataURL('image/jpeg', 0.85);
  stopCamera();
  currentAddTab = 'ki';
  _renderAddModal();
  setTimeout(_renderMealPills, 50);
}
function closeCameraModal(){ stopCamera(); currentAddTab = 'ki'; _renderAddModal(); setTimeout(_renderMealPills, 50); }
function stopCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
}

async function analyzeAI(){
  const text = document.getElementById('ai-text')?.value?.trim();
  const b64 = aiPhoto ? aiPhoto.split(',')[1] : null;
  if(!text && !b64) return showToast('Bitte Text eingeben oder Foto machen');
  const btn = document.getElementById('ai-analyze-btn');
  if(btn){ btn.disabled = true; btn.innerHTML = `<span style="display:inline-block;animation:spin 1.5s linear infinite">⟳</span> Analysiere...`; }
  try {
    const result = await geminiAnalyze(text, b64);
    addMeal({ name: result.name || "Unbekanntes Gericht", calories: result.calories||0, protein: result.protein||0, carbs: result.carbs||0, fat: result.fat||0, mealType: tempMealType });
    closeModal();
  } catch(e) {
    showToast(e.message);
    if(btn){ btn.disabled = false; btn.textContent = '✨ Mit KI analysieren'; }
  }
}

async function runDBSearch(){
  const inp = document.getElementById('db-search-inp');
  if(!inp) return;
  const q = inp.value.trim();
  if(!q) return showToast('Bitte Suchbegriff eingeben');
  const resultsEl = document.getElementById('db-results');
  if(!resultsEl) return;
  resultsEl.innerHTML = `<div class="food-loading">🔍 Suche läuft... (Versuch 1/3)</div>`;
  try {
    const products = await searchFoodDB(q);
    window._dbSearchResults = products;
    if(!products.length){
      resultsEl.innerHTML = `<div class="food-empty"><div class="food-empty-icon">😕</div><p>Keine Ergebnisse für <strong>"${q}"</strong></p><p style="font-size:13px;margin-top:6px;color:var(--muted)">Versuche einen einfacheren Begriff (z. B. nur "Banane")</p></div>`;
      return;
    }
    resultsEl.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">${products.length} Ergebnisse</div>` +
      products.map((p,i) => {
        const kcal = getKcalPer100(p);
        const n100 = getNutrientsPer100(p);
        const name = getProductName(p);
        const brand = p.brands && p.brands !== 'USDA' ? p.brands.split(',')[0].trim() : '';
        const imgSrc = p.image_thumb_url || '';
        return `<div class="food-result-item" onclick="selectDBProduct(${i})"> ${imgSrc ? `<img class="food-result-img" src="${imgSrc}" onerror="this.style.display='none'">`:`<div class="food-result-img" style="display:flex;align-items:center;justify-content:center;font-size:22px">🥗</div>`} <div class="food-result-info"> <div class="food-result-name">${name}</div> ${brand ? `<div class="food-result-brand">${brand}</div>` : ''} <div style="font-size:11px;color:var(--muted);margin-top:2px">pro 100g: P${n100.protein}g KH${n100.carbs}g F${n100.fat}g</div> </div> <div class="food-result-kcal">${kcal}<br><span style="font-size:10px;font-weight:400;color:var(--muted)">kcal</span></div> </div>`;
      }).join('');
  } catch(e) {
    resultsEl.innerHTML = `<div class="food-empty"><div class="food-empty-icon">❌</div><p style="font-weight:600">${e.message}</p><p style="font-size:13px;margin-top:8px;color:var(--muted)">Tippe erneut auf 🔍 um es nochmal zu versuchen</p></div>`;
  }
}

function selectDBProduct(idx){
  const p = window._dbSearchResults?.[idx];
  if(!p) return;
  selectedProduct = p;
  showAmountSelector(p);
}

function _buildBarcodeTabHTML(){
  return ` <div class="barcode-tabs"> <button class="barcode-tab ${currentBarcodeSubTab==='camera'?'active':''}" onclick="switchBarcodeSubTab('camera')">📷 Kamera</button> <button class="barcode-tab ${currentBarcodeSubTab==='manual'?'active':''}" onclick="switchBarcodeSubTab('manual')">⌨️ Manuell</button> </div> <div id="barcode-sub-content"></div> <button onclick="closeModal()" class="btn btn-ghost" style="width:100%;margin-top:8px">Abbrechen</button>`;
}

function _initBarcodeSubTab(){
  const el = document.getElementById('barcode-sub-content');
  if(!el) return;
  if(currentBarcodeSubTab === 'camera'){
    el.innerHTML = ` <div id="barcode-reader-container" style="min-height:260px"> <div id="barcode-reader"></div> </div> <div id="barcode-status" class="barcode-status">📷 Kamera wird gestartet...</div>`;
    setTimeout(_startBarcodeScanner, 200);
  } else {
    el.innerHTML = ` <div style="text-align:center;padding:20px 0"> <div style="font-size:40px;margin-bottom:12px">🔢</div> <p style="color:var(--muted);font-size:14px;margin-bottom:16px">Barcode manuell eingeben (EAN-8, EAN-13, UPC-A)</p> </div> <div class="search-row"> <input id="manual-barcode-inp" class="inp" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="z. B. 4005808227624" onkeydown="if(event.key==='Enter')lookupManualBarcode()" style="flex:1;letter-spacing:2px"> <button onclick="lookupManualBarcode()" class="btn" style="padding:11px 18px;flex-shrink:0">→</button> </div> <div id="barcode-manual-status" style="margin-top:8px"></div>`;
  }
}

function switchBarcodeSubTab(tab){
  stopBarcodeScanner();
  currentBarcodeSubTab = tab;
  document.querySelectorAll('.barcode-tab').forEach((b,i) => b.classList.toggle('active', (i===0 && tab==='camera')||(i===1 && tab==='manual')));
  _initBarcodeSubTab();
}

function _startBarcodeScanner(){
  const statusEl = document.getElementById('barcode-status');
  if(!statusEl) return;
  if(typeof Html5Qrcode === 'undefined'){
    statusEl.innerHTML = '<span class="error">❌ Scanner-Bibliothek nicht geladen</span>';
    return;
  }
  try {
    html5QrcodeInst = new Html5Qrcode('barcode-reader');
    html5QrcodeInst.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 140 }, aspectRatio: 1.6 },
      (decodedText) => {
        stopBarcodeScanner();
        if(statusEl) statusEl.innerHTML = `<span class="found">✅ Barcode erkannt: ${decodedText}</span>`;
        _handleBarcodeDetected(decodedText, statusEl);
      },
      () => {}
    ).then(() => {
      if(statusEl) statusEl.textContent = '📷 Halte den Barcode in den Rahmen';
    }).catch(err => {
      if(statusEl) statusEl.innerHTML = `<span style="color:var(--fat)">❌ Kamera nicht verfügbar: ${err}</span>`;
    });
  } catch(e) {
    if(statusEl) statusEl.innerHTML = `<span style="color:var(--fat)">❌ ${e.message}</span>`;
  }
}

function stopBarcodeScanner(){
  if(html5QrcodeInst){
    try { html5QrcodeInst.stop().catch(()=>{}); } catch(e){}
    html5QrcodeInst = null;
  }
}

async function lookupManualBarcode(){
  const inp = document.getElementById('manual-barcode-inp');
  const statusEl = document.getElementById('barcode-manual-status');
  if(!inp || !statusEl) return;
  const code = inp.value.trim().replace(/\s/g,'');
  if(!code || !/^\d{6,14}$/.test(code)) return showToast('Bitte gültigen Barcode eingeben (6–14 Ziffern)');
  statusEl.innerHTML = `<div class="food-loading" style="padding:10px">🔍 Suche Produkt...</div>`;
  await _handleBarcodeDetected(code, statusEl);
}

async function _handleBarcodeDetected(barcode, statusEl){
  if(statusEl) statusEl.innerHTML = `<div class="food-loading" style="padding:10px">🔍 Suche Produkt...</div>`;
  try {
    const product = await fetchByBarcode(barcode);
    selectedProduct = product;
    showAmountSelector(product);
  } catch(e) {
    if(statusEl) statusEl.innerHTML = `<div style="text-align:center;padding:12px;color:var(--fat)">❌ ${e.message}</div>`;
  }
}

function showAmountSelector(product){
  stopBarcodeScanner();
  const mc = document.getElementById('modal-container');
  const name = getProductName(product);
  const brand = product.brands ? product.brands.split(',')[0].trim() : '';

  let chips = [];
  chips.push({ label:'100g', grams:100 });
  if(servingG && servingG !== 100) chips.push({ label: `1 Portion (${Math.round(servingG)}g)`, grams: Math.round(servingG) });
  chips.push({ label:'50g', grams:50 });

  chips.push({ label:'200g', grams:200 });

  const chipsHTML = chips.map((c,i) => `<div onclick="setAmountChip(${c.grams},${i})" class="amount-chip ${i===0?'active':''}" data-chip-idx="${i}">${c.label}</div>`).join('');
  const mealPillsHTML = MEAL_TYPES.map(t => `<div onclick="selectMealType('${t.id}')" class="pill ${tempMealType===t.id?'active':''}" style="font-size:13px;padding:7px 12px">${t.emoji} ${t.label}</div>`).join('');

  mc.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"> <div class="modal-box scale-in"> <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"> <button onclick="backToAddModal()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0">←</button> <h2 style="flex:1">Menge anpassen</h2> </div> <div class="amount-header"> ${imgSrc ?`<img class="amount-product-img" src="${imgSrc}" onerror="this.style.display='none'">`:`<div class="amount-product-img" style="display:flex;align-items:center;justify-content:center;font-size:28px">🥗</div>`} <div style="flex:1;min-width:0"> <div class="amount-product-name">${name}</div> ${brand ? `<div class="amount-product-brand">${brand}</div>`: ''} ${qty ?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${qty}</div>` : ''}
<div style="font-size:12px;color:var(--muted);margin-top:2px">pro 100g: ${per100.calories} kcal | P${per100.protein}g KH${per100.carbs}g F${per100.fat}g</div>
</div>
</div>

    <div style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px">Schnellauswahl</div>
    <div class="amount-chips">${chipsHTML}</div>

    <div style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px">Individuelle Menge</div>
    <div class="amount-input-row">
      <input type="number" id="amount-grams-inp" class="inp" value="100" min="1" max="9999" oninput="updateMacroPreview()" style="flex:1;font-size:20px;font-weight:700;text-align:center">
      <div style="background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:11px 16px;font-weight:700;color:var(--dim)">g</div>
    </div>

    <div class="macro-preview">
      <div class="macro-preview-title">Nährwerte für diese Menge</div>
      <div class="macro-preview-grid" id="macro-preview-grid">
        <div><div class="macro-preview-val" id="prev-kcal" style="color:var(--accent)">-</div><div class="macro-preview-label">kcal</div></div>
        <div><div class="macro-preview-val" id="prev-prot" style="color:var(--protein)">-</div><div class="macro-preview-label">Protein</div></div>
        <div><div class="macro-preview-val" id="prev-carbs" style="color:var(--carbs)">-</div><div class="macro-preview-label">Kohlenhydr.</div></div>
        <div><div class="macro-preview-val" id="prev-fat" style="color:var(--fat)">-</div><div class="macro-preview-label">Fett</div></div>
      </div>
    </div>

    <div style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px">Mahlzeit</div>

    <button onclick="confirmAddDBMeal()" class="btn" style="width:100%" id="confirm-add-btn">+ Zur Tagesübersicht hinzufügen</button>

  </div>
</div>`;
  window._amountChips = chips;
  updateMacroPreview();
}

function setAmountChip(grams, idx){
  document.querySelectorAll('.amount-chip').forEach((el, i) => el.classList.toggle('active', i === idx));
  const inp = document.getElementById('amount-grams-inp');
  if(inp){ inp.value = grams; updateMacroPreview(); }
}

function updateMacroPreview(){
  const inp = document.getElementById('amount-grams-inp');
  if(!inp || !selectedProduct) return;
  const grams = parseFloat(inp.value) || 0;
  const n = calcForGrams(selectedProduct, grams);
  const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  set('prev-kcal', n.calories);
  set('prev-prot', n.protein + 'g');
  set('prev-carbs', n.carbs + 'g');
  set('prev-fat', n.fat + 'g');
  const chipGrams = (window._amountChips || []).map(c => c.grams);
  const matched = chipGrams.indexOf(grams);
  document.querySelectorAll('.amount-chip').forEach((el, i) => el.classList.toggle('active', i === matched));
}

function confirmAddDBMeal(){
  if(!selectedProduct) return;
  const grams = parseFloat(document.getElementById('amount-grams-inp')?.value) || 100;
  const n = calcForGrams(selectedProduct, grams);
  const name = getProductName(selectedProduct);
  const brand = selectedProduct.brands ? ' – ' + selectedProduct.brands.split(',')[0].trim() : '';
  addMeal({
    name: name + (brand && brand.length < 20 ? brand : ''),
    calories: n.calories,
    protein: n.protein,
    carbs: n.carbs,
    fat: n.fat,
    mealType: tempMealType
  });
  closeModal();
}

function backToAddModal(){
  stopBarcodeScanner();
  selectedProduct = null;
  _renderAddModal();
  if(currentAddTab === 'ki') setTimeout(_renderMealPills, 50);
}

// ====================== REZEPTE ======================
const MEALDB_BASE = 'https://www.themealdb.com/api/json/v1/1';
let _currentRecipe = null;

function _buildRezepteTabHTML(){
  return ` <div class="search-row"> <input id="recipe-search-inp" class="inp" placeholder="z. B. Pasta, Chicken, Salad..." onkeydown="if(event.key==='Enter')runRecipeSearch()" style="flex:1"> <button onclick="runRecipeSearch()" class="btn" style="padding:11px 16px;flex-shrink:0">🔍</button> </div> <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="recipe-category-pills"> ${['Chicken','Beef','Pasta','Vegetarian','Seafood','Dessert','Breakfast'].map(c=>`<div onclick="searchRecipeByCategory('${c}')" class="pill" style="font-size:12px;padding:6px 12px">${c}</div>`).join('')} </div> <div id="recipe-results"><div class="food-empty" style="padding:24px 0"><div class="food-empty-icon">🍳</div><p style="color:var(--muted)">Rezept suchen oder Kategorie wählen</p></div></div> <button onclick="closeModal()" class="btn btn-ghost" style="width:100%;margin-top:8px">Abbrechen</button>`;
}

async function runRecipeSearch(){
  const q = document.getElementById('recipe-search-inp')?.value.trim();
  if(!q) return showToast('Bitte Suchbegriff eingeben');
  const el = document.getElementById('recipe-results');
  if(!el) return;
  el.innerHTML = `<div class="food-loading">🔍 Suche Rezepte...</div>`;
  try {
    const data = await fetchWithRetry(`${MEALDB_BASE}/search.php?s=${encodeURIComponent(q)}`);
    _renderRecipeResults(data.meals || []);
  } catch(e) { el.innerHTML = `<div class="food-empty"><div class="food-empty-icon">❌</div><p>${e.message}</p></div>`; }
}

async function searchRecipeByCategory(cat){
  const el = document.getElementById('recipe-results');
  if(!el) return;
  el.innerHTML = `<div class="food-loading">🔍 Lade ${cat}-Rezepte...</div>`;
  try {
    const data = await fetchWithRetry(`${MEALDB_BASE}/filter.php?c=${encodeURIComponent(cat)}`);
    const meals = (data.meals||[]).slice(0,12);
    _renderRecipeResults(meals, true);
  } catch(e) { el.innerHTML = `<div class="food-empty"><p>${e.message}</p></div>`; }
}

function _renderRecipeResults(meals, minimal=false){
  const el = document.getElementById('recipe-results');
  if(!el) return;
  if(!meals.length){ el.innerHTML = `<div class="food-empty"><div class="food-empty-icon">😕</div><p>Keine Rezepte gefunden</p></div>`; return; }
  el.innerHTML = meals.map((m,i)=>` <div class="recipe-card" onclick="openRecipeDetail('${m.idMeal}')"> <img class="recipe-card-img" src="${m.strMealThumb||''}${minimal?'/preview':''}" onerror="this.style.display='none'" loading="lazy"> <div class="recipe-card-info"> <div class="recipe-card-name">${m.strMeal||'Rezept'}</div> <div class="recipe-card-meta">${m.strCategory||''} ${m.strArea?'• '+m.strArea:''}</div> <div style="font-size:11px;color:var(--accent);margin-top:4px;font-weight:600">Antippen für Details →</div> </div> </div>`).join('');
}

async function openRecipeDetail(id){
  const mc = document.getElementById('modal-container');
  mc.innerHTML = `<div class="modal-overlay"><div class="modal-box"><div class="food-loading" style="padding:40px 0">🍳 Lade Rezept...</div></div></div>`;
  try {
    const data = await fetchWithRetry(`${MEALDB_BASE}/lookup.php?i=${id}`);
    const m = data.meals?.[0];
    if(!m) throw new Error('Rezept nicht gefunden');
    _currentRecipe = m;

    const ingredients = [];
    for(let i=1;i<=20;i++){
      const ing = m[`strIngredient${i}`]?.trim();
      const measure = m[`strMeasure${i}`]?.trim();
      if(ing) ingredients.push({ name:ing, measure:measure||'' });
    }

    const estKcal = m.strCategory === 'Dessert' ? 280 : m.strCategory === 'Breakfast' ? 350 : 480;

    const ingHTML = ingredients.map(ing=>`
      <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px">
        <span>${ing.name}</span><span style="color:var(--muted)">${ing.measure}</span>
      </div>`).join('');

    const mealPillsHTML = MEAL_TYPES.map(t=>`<div onclick="selectMealType('${t.id}')" class="pill ${tempMealType===t.id?'active':''}" style="font-size:12px;padding:6px 10px">${t.emoji} ${t.label}</div>`).join('');

    mc.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this){currentAddTab='rezepte';_renderAddModal()}">
        <div class="modal-box scale-in">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <button onclick="currentAddTab='rezepte';_renderAddModal()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">←</button>
            <h3 style="flex:1;font-size:16px;line-height:1.3">${m.strMeal}</h3>
          </div>
          ${m.strMealThumb?`<img src="${m.strMealThumb}" style="width:100%;border-radius:16px;max-height:200px;object-fit:cover;margin-bottom:14px">`: ''}
          <div style="display:flex;gap:8px;margin-bottom:14px;font-size:12px">
            ${m.strCategory?`<span style="background:var(--card2);border:1px solid var(--border);border-radius:9999px;padding:4px 10px">${m.strCategory}</span>`:''}
            ${m.strArea?`<span style="background:var(--card2);border:1px solid var(--border);border-radius:9999px;padding:4px 10px">${m.strArea}</span>`:''}
          </div>
          <div style="font-weight:700;margin-bottom:8px">🧂 Zutaten (${ingredients.length})</div>
          <div style="max-height:160px;overflow-y:auto;margin-bottom:14px">${ingHTML}</div>
          <div style="background:var(--card2);border-radius:14px;padding:12px;margin-bottom:14px">
            <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Geschätzte Kalorien pro Portion</div>
            <div style="display:flex;align-items:center;gap:10px">
              <input type="number" id="recipe-kcal-inp" class="inp" value="${estKcal}" style="flex:1;font-size:18px;font-weight:700;text-align:center">
              <span style="color:var(--muted);font-size:13px">kcal</span>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:6px">Schätzung. Du kannst den Wert anpassen.</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${mealPillsHTML}</div>
          <button onclick="addRecipeMeal()" class="btn" style="width:100%">+ Zu Heute hinzufügen</button>
          <button onclick="currentAddTab='rezepte';_renderAddModal()" class="btn btn-ghost" style="width:100%;margin-top:8px">Zurück</button>
        </div>
      </div>`;
  } catch(e) {
    showToast(e.message);
    currentAddTab = 'rezepte';
    _renderAddModal();
  }
}

function addRecipeMeal(){
  if(!_currentRecipe) return;
  const kcal = parseInt(document.getElementById('recipe-kcal-inp')?.value) || 400;
  addMeal({
    name: _currentRecipe.strMeal,
    calories: kcal,
    protein: Math.round(kcal * 0.20 / 4),
    carbs:   Math.round(kcal * 0.50 / 4),
    fat:     Math.round(kcal * 0.30 / 9),
    mealType: tempMealType
  });
  _currentRecipe = null;
  closeModal();
}

// ====================== MODALS & TOAST ======================
function closeModal(){
  stopBarcodeScanner();
  stopCamera();
  aiPhoto = null;
  selectedProduct = null;
  document.getElementById('modal-container').innerHTML = '';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2800);
}

// ====================== MEAL MANAGEMENT ======================
function addMeal(meal){
  const log = S.todayLog;
  log.meals = [...log.meals, {...meal, id: uid()}];
  S.saveTodayLog(log);
  if(currentView === 'dashboard') renderView('dashboard');
  showToast(`+${meal.calories} kcal • ${meal.name.substring(0,30)}`);
}
function removeMeal(id){
  const log = S.todayLog;
  log.meals = log.meals.filter(m => m.id !== id);
  S.saveTodayLog(log);
  renderView(currentView);
}

function saveEditedMeal(id) {
  const log = S.todayLog;
  const idx = log.meals.findIndex(m => m.id === id);
  if (idx < 0) return;
  const activePill = document.querySelector('#edit-meal-pills .pill.active');
  log.meals[idx] = {
    ...log.meals[idx],
    calories: parseInt(document.getElementById('edit-cal')?.value) || 0,
    protein:  parseFloat(document.getElementById('edit-prot')?.value) || 0,
    carbs:    parseFloat(document.getElementById('edit-carbs')?.value) || 0,
    fat:      parseFloat(document.getElementById('edit-fat')?.value) || 0,
    mealType: activePill?.dataset?.id || log.meals[idx].mealType
  };
  S.saveTodayLog(log);
  closeModal();
  renderView('dashboard');
  showToast('Mahlzeit aktualisiert ✓');
}

// ====================== BOOT ======================
function boot(){
  S.profile = S.loadProfile();
  if(!S.profile){
    document.getElementById('onboarding').style.display = 'flex';
    renderOnboarding();
  } else {
    document.getElementById('app').style.display = 'flex';
    applyTheme(S.profile);
    navigate('dashboard');
  }
  const savedChat = load('chatHistory');
  if(savedChat) S.chatHistory = savedChat;
  
  // Registrierung des Service Workers für die PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((registration) => console.log('ServiceWorker erfolgreich registriert!', registration.scope))
        .catch((error) => console.log('ServiceWorker Registrierung fehlgeschlagen:', error));
    });
  }
  
  console.log('%c✅ Kalorify vollständig geladen!', 'color:#AADF3C;font-weight:700');
}
boot();
</script>
</body>
</html>
