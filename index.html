window.exportData=function(){profileBackupExpanded=true;const data={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);data[key]=localStorage.getItem(key);}const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`kalorify_backup_${today()}.json`;a.click();};
window.importData=function(input){profileBackupExpanded=true;const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);for(const key in data){localStorage.setItem(key,data[key]);}showToast('Daten importiert! Lade App neu...');setTimeout(()=>location.reload(),1500);}catch(err){showToast('Fehler beim Importieren.');}};reader.readAsText(file);};

window.saveProfileData=function(){profileDataExpanded=true;const profile=S.profile||{};const v=id=>document.getElementById(id);if(v('prof-gender'))profile.gender=v('prof-gender').value;if(v('prof-age'))profile.age=parseInt(v('prof-age').value)||profile.age;if(v('prof-weight'))profile.weight=parseInt(v('prof-weight').value)||profile.weight;if(v('prof-height'))profile.height=parseInt(v('prof-height').value)||profile.height;if(v('prof-activity'))profile.activityLevel=v('prof-activity').value;if(v('prof-goal'))profile.goal=v('prof-goal').value;if(v('prof-theme-sel'))profile.theme=v('prof-theme-sel').value;if(v('prof-compact-toggle'))profile.compactMode=v('prof-compact-toggle').checked;if(v('prof-color'))profile.accentColor=v('prof-color').value;S.saveProfile(profile);applyTheme(profile);};
window.autoSaveConnectionSettings=function(){profileConnectionsExpanded=true;clearTimeout(window._connectionAutoSaveTimer);window._connectionAutoSaveTimer=setTimeout(()=>{const val=id=>document.getElementById(id)?.value?.trim()||'';if(document.getElementById('claude-key-inp'))store('claudeApiKey',val('claude-key-inp'));if(document.getElementById('groq-key-inp'))store('groqApiKey',val('groq-key-inp'));if(document.getElementById('gemini-key-inp'))S.setGeminiKey(val('gemini-key-inp'));if(document.getElementById('mistral-key-inp'))store('mistralApiKey',val('mistral-key-inp'));if(document.getElementById('usda-key-inp'))store('usdaApiKey',val('usda-key-inp'));if(document.getElementById('apilayer-key-inp'))store('apilayerApiKey',val('apilayer-key-inp'));if(document.getElementById('fs-id-inp'))store('fsClientId',val('fs-id-inp'));if(document.getElementById('fs-sec-inp'))store('fsClientSecret',val('fs-sec-inp'));_fsToken=null;},350);};

function openAddModal(mealType='lunch'){aiPhoto=null;tempMealType=mealType||'lunch';selectedProduct=null;currentAddTab='ki';_renderAddModal();}

function _renderAddModal(){
  const mc=document.getElementById('modal-container');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box scale-in" id="main-modal-box"><h2 style="margin-bottom:16px">Hinzufügen</h2><div class="add-tabs"><button class="add-tab ${currentAddTab==='ki'?'active':''}" onclick="switchAddTab('ki')">${ico('spark',16)} KI Foto</button><button class="add-tab ${currentAddTab==='fav'?'active':''}" onclick="switchAddTab('fav')">${ico('star',16)} Favoriten</button><button class="add-tab ${currentAddTab==='suche'?'active':''}" onclick="switchAddTab('suche')">${ico('search',16)} Suche</button><button class="add-tab ${currentAddTab==='barcode'?'active':''}" onclick="switchAddTab('barcode')">${ico('barcode',16)} Barcode</button><button class="add-tab ${currentAddTab==='rezepte'?'active':''}" onclick="switchAddTab('rezepte')">${ico('chef',16)} Rezepte</button><button class="add-tab ${currentAddTab==='manuell'?'active':''}" onclick="switchAddTab('manuell')">${ico('edit',16)} Manuell</button></div><div id="add-tab-content"></div></div></div>`;
  _renderAddTabContent();
}

function switchAddTab(tab){
  if(tab!=='barcode')stopBarcodeScanner();
  currentAddTab=tab;
  document.querySelectorAll('.add-tab').forEach((b,i)=>{const tabs=['ki','fav','suche','barcode','rezepte','manuell'];b.classList.toggle('active',tabs[i]===tab);});
  const cont=document.getElementById('add-tab-content');
  if(cont){_renderAddTabContent();}
  else _renderAddTabContent();
}

function _renderAddTabContent(){
  const el=document.getElementById('add-tab-content');if(!el)return;
  if(currentAddTab==='ki')el.innerHTML=_buildKITabHTML();
  else if(currentAddTab==='fav')el.innerHTML=_buildFavTabHTML();
  else if(currentAddTab==='suche')el.innerHTML=_buildSucheTabHTML();
  else if(currentAddTab==='barcode'){el.innerHTML=_buildBarcodeTabHTML();_initBarcodeSubTab();}
  else if(currentAddTab==='rezepte')el.innerHTML=_buildRezepteTabHTML();
  else if(currentAddTab==='manuell')el.innerHTML=_buildManuellTabHTML();
}

window.startVoiceKI=function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

// ====================== BARCODE HELPERS (Torch, Beep, Validation, Scan Cache) ======================
let _torchOn = false;

// Audio beep via Web Audio API
let _beepCtx = null;
function _playBeep(){
  try{
    if(!_beepCtx) _beepCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = _beepCtx.createOscillator();
    const gain = _beepCtx.createGain();
    osc.connect(gain);
    gain.connect(_beepCtx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.25, _beepCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, _beepCtx.currentTime + 0.15);
    osc.start();
    osc.stop(_beepCtx.currentTime + 0.15);
  }catch(e){}
}
function _barcodeFeedback(){
  _playBeep();
  try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){}
}

// Barcode checksum validation (EAN-8, EAN-13, UPC-A)
function _isValidBarcode(code){
  if(!/^\d+$/.test(code)) return false;
  const len = code.length;
  if(len === 13 || len === 8){
    const checkLen = len - 1;
    const parity = (len === 13) ? [1,3] : [3,1];
    let sum = 0;
    for(let i = 0; i < checkLen; i++) sum += parseInt(code[i]) * parity[i % 2];
    return (10 - (sum % 10)) % 10 === parseInt(code[checkLen]);
  }
  if(len === 12){
    let sum = 0;
    for(let i = 0; i < 11; i++) sum += parseInt(code[i]) * (i % 2 === 0 ? 3 : 1);
    return (10 - (sum % 10)) % 10 === parseInt(code[11]);
  }
  return len >= 6 && len <= 14;
}

// Torch toggle – greift direkt auf den MediaStreamTrack zu
window._toggleTorch = function(){
  if(!html5QrcodeInst) return;
  try{
    const video = document.querySelector('#barcode-reader video');
    if(!video || !video.srcObject){ showToast('Kamera nicht aktiv'); return; }
    const tracks = video.srcObject.getVideoTracks();
    if(!tracks.length) return;
    const track = tracks[0];
    const caps = (track.getCapabilities && track.getCapabilities()) || {};
    if(!caps.torch){ showToast('Taschenlampe von diesem Gerät nicht unterstützt'); return; }
    _torchOn = !_torchOn;
    track.applyConstraints({ advanced: [{ torch: _torchOn }] }).then(()=>{
      const btn = document.getElementById('torch-btn');
      if(btn) btn.classList.toggle('active', _torchOn);
    }).catch(()=>{ showToast('Taschenlampe fehlgeschlagen'); _torchOn = false; });
  }catch(e){ showToast('Taschenlampe nicht verfügbar'); }
};

// Scan cache – merkt sich zuletzt gewählte Gramm + Mahlzeit pro Barcode
function getScanCache(){ return load('scanCache') || {}; }
function saveScanCacheEntry(barcode, product, grams, mealType){
  if(!barcode) return;
  const cache = getScanCache();
  cache[barcode] = { name: getProductName(product), grams, mealType, source: product._source || 'off', ts: Date.now() };
  const sorted = Object.entries(cache).sort((a,b) => (b[1].ts||0) - (a[1].ts||0));
  store('scanCache', Object.fromEntries(sorted.slice(0, 30)));
}
function getScanCacheEntry(barcode){ return getScanCache()[barcode] || null; }

// Multi-Database Barcode Fallback Chain
async function _fetchByBarcodeOFF(barcode){
  const url = `${OFF_BASE}/api/v0/product/${barcode}.json?fields=${OFF_FIELDS}`;
  let data;
  try{ data = await fetchWithRetry(url); }catch(e){ return null; }
  if(data.status !== 1 || !data.product) return null;
  return { ...data.product, _source:'off', _srcLabel:'OFF' };
}

async function _fetchByBarcodeFatSecret(barcode){
  const token = await _getFSToken();
  if(!token) return null;
  const findUrl = `https://platform.fatsecret.com/rest/server.api?method=food.find_id_for_barcode&barcode=${encodeURIComponent(barcode)}&format=json`;
  let findData;
  try{ findData = await fetchWithRetry(findUrl, { headers: { 'Authorization': 'Bearer ' + token } }); }catch(e){ return null; }
  const foodId = findData.food_id?.value || findData.food_id;
  if(!foodId) return null;
  const getUrl = `https://platform.fatsecret.com/rest/server.api?method=food.get&food_id=${foodId}&format=json`;
  let foodData;
  try{ foodData = await fetchWithRetry(getUrl, { headers: { 'Authorization': 'Bearer ' + token } }); }catch(e){ return null; }
  const food = foodData.food || {};
  const rawServ = food.servings?.serving;
  const serving = Array.isArray(rawServ) ? rawServ[0] : rawServ;
  if(!serving) return null;
  const grams = parseFloat(serving.metric_serving_amount) || 100;
  const ratio = 100 / grams;
  return {
    product_name: food.food_name || 'Unbekannt', product_name_de: null,
    brands: food.brand_name || 'FatSecret', image_thumb_url: '', quantity: '',
    serving_quantity: grams, serving_size: 'g',
    _source: 'fs', _srcLabel: 'FS',
    nutriments: {
      'energy-kcal_100g': Math.round(parseFloat(serving.calories || 0) * ratio),
      'proteins_100g': Math.round(parseFloat(serving.protein || 0) * ratio * 10) / 10,
      'carbohydrates_100g': Math.round(parseFloat(serving.carbohydrate || 0) * ratio * 10) / 10,
      'fat_100g': Math.round(parseFloat(serving.fat || 0) * ratio * 10) / 10
    }
  };
}

async function _fetchByBarcodeAPILayer(barcode){
  const key = getAPILayerKey();
  if(!key) return null;
  const url = `https://api.apilayer.com/edamam/api/food-database/v2/parser?upc=${encodeURIComponent(barcode)}`;
  let data;
  try{ data = await fetchWithRetry(url, { headers: { 'apikey': key } }); }catch(e){ return null; }
  const hint = data.hints?.[0]?.food;
  if(!hint) return null;
  const n = hint.nutrients || {};
  return {
    product_name: hint.label || 'Unbekannt', product_name_de: null,
    brands: hint.brand || 'APILayer', image_thumb_url: hint.image || '', quantity: '',
    serving_quantity: 100, serving_size: null,
    _source: 'apilayer', _srcLabel: 'API L.',
    nutriments: {
      'energy-kcal_100g': Math.round(n.ENERC_KCAL || 0),
      'proteins_100g': Math.round((n.PROCNT || 0) * 10) / 10,
      'carbohydrates_100g': Math.round((n.CHOCDF || 0) * 10) / 10,
      'fat_100g': Math.round((n.FAT || 0) * 10) / 10
    }
  };
}

function _startBarcodeScanner(){
  const statusEl=document.getElementById('barcode-status');
  if(!statusEl)return;
  if(typeof Html5Qrcode==='undefined'){statusEl.innerHTML='<span class="error">Scanner-Script fehlt.</span>';return;}
  _torchOn=false;
  try{
    html5QrcodeInst=new Html5Qrcode('barcode-reader');
    html5QrcodeInst.start(
      {facingMode:'environment'},
      {fps:30,qrbox:{width:250,height:150},aspectRatio:1.4,experimentalFeatures:{useBarCodeDetectorIfSupported:true}},
      (decodedText)=>{
        stopBarcodeScanner();
        _barcodeFeedback();
        if(statusEl)statusEl.innerHTML=`<span class="found">${decodedText} erfasst. Suche...</span>`;
        _handleBarcodeDetected(decodedText,statusEl);
      },
      ()=>{}
    ).then(()=>{
      if(statusEl)statusEl.textContent='Barcode in den Rahmen halten';
      // Prüfe Torch-Support und zeige Button falls verfügbar
      setTimeout(()=>{
        try{
          const video=document.querySelector('#barcode-reader video');
          if(video&&video.srcObject){
            const tracks=video.srcObject.getVideoTracks();
            if(tracks.length){
              const caps=(tracks[0].getCapabilities&&tracks[0].getCapabilities())||{};
              const btn=document.getElementById('torch-btn');
              if(btn&&caps.torch)btn.style.display='flex';
            }
          }
        }catch(e){}
      },600);
    }).catch(err=>{
      if(statusEl)statusEl.innerHTML=`<span style="color:var(--fat)">Keine Kamera-Freigabe. Bitte Browser-Zugriff erlauben.</span>`;
    });
  }catch(e){
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--fat)">${e.message}</span>`;
  }
}

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{cameraStream=stream;video.srcObject=stream;}).catch(()=>{showToast('Kamera konnte nicht gestartet werden.');closeModal();});

function capturePhoto(){const video=document.getElementById('camera-video');const canvas=document.getElementById('camera-canvas');canvas.width=video.videoWidth||1080;canvas.height=video.videoHeight||1080;canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);aiPhoto=canvas.toDataURL('image/jpeg',0.85);stopCamera();currentAddTab='ki';_renderAddModal();setTimeout(_renderMealPills,50);}
function closeCameraModal(){stopCamera();currentAddTab='ki';_renderAddModal();setTimeout(_renderMealPills,50);}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}}

async function analyzeAI(){
  const text=document.getElementById('ai-text')?.value?.trim();
  const b64=aiPhoto?aiPhoto.split(',')[1]:null;
  if(!text&&!b64)return showToast('Foto aufnehmen oder Text eingeben.');
  const btn=document.getElementById('ai-analyze-btn');
  if(btn){btn.disabled=true;btn.innerHTML=`<span style="display:inline-block;animation:spin 1s linear infinite;margin-right:6px">${ico('spark',16)}</span> Analysiere...`;}
  let result=null,source='';
  try{
    if(getClaudeKey()){try{result=await analyzeWithClaude(text,b64);source='Claude';}catch(e){if(e.message!=='no_claude_key')console.warn(e.message);}}
    if(!result&&S.geminiKey){try{result=await analyzeWithGemini(text,b64);source='Gemini';}catch(e){console.warn(e.message);}}
    if(!result&&!b64&&getGroqKey()){try{result=await analyzeWithGroq(text);source='Groq';}catch(e){console.warn(e.message);}}
    if(!result&&text){const local=analyzeLocally(text);if(local){result=local;source='Lokal';}}
    if(!result){if(btn){btn.disabled=false;btn.innerHTML='KI Analyse erneut starten';}showToast('Kein API-Key – nutze "Manuell" oder hinterlege einen Key im Profil.');return;}
    addMeal({name:result.name||'Mein Gericht',calories:result.calories||0,protein:result.protein||0,carbs:result.carbs||0,fat:result.fat||0,mealType:tempMealType});
    closeModal();const note=source==='Lokal'?'(Lokale DB – ggf. anpassen)':`(${source} Schätzung)`;setTimeout(()=>{showToast(`✓ Eingetragen! ${note}`);},400);
  }catch(e){showToast('Fehler: '+e.message);if(btn){btn.disabled=false;btn.innerHTML='KI Analyse erneut starten';}}
}

  resultsEl.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;padding:20px 0;">
    ${[1,2,3,4,5].map(()=>`<div class="skeleton" style="height:74px;border-radius:16px;"></div>`).join('')}
  </div>`;
  try{
    const products=await searchFoodDB(q);

    if(!products.length){resultsEl.innerHTML=`<div class="food-empty fade-up"><div class="food-empty-icon" style="color:var(--accent)">${ico('search',42)}</div><p style="font-weight:600;color:var(--text)">Nichts zu "<strong>${q}</strong>" gefunden.</p></div>`;return;}
    resultsEl.innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;padding-left:4px">${products.length} Ergebnisse</div>`+products.map((p,i)=>{const kcal=getKcalPer100(p);const n100=getNutrientsPer100(p);const name=getProductName(p);const brand=p.brands&&p.brands!=='USDA'?p.brands.split(',')[0].trim():'';const imgSrc=p.image_thumb_url||'';return`<div class="food-result-item" onclick="selectDBProduct(${i})" style="animation:fadeUp ${0.05+i*0.02}s ease-out both">${imgSrc?`<img class="food-result-img" src="${imgSrc}" onerror="this.style.display='none'" loading="lazy">`:`<div class="food-result-img" style="display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--card2)">${ico('cart',24)}</div>`}<div class="food-result-info"><div class="food-result-name">${name}</div>${brand?`<div class="food-result-brand">${brand}</div>`:''}<div style="font-size:11px;color:var(--muted);margin-top:4px">P ${n100.protein}g | C ${n100.carbs}g | F ${n100.fat}g / 100g</div></div><div class="food-result-kcal" style="padding-left:12px;border-left:1px solid var(--border)">${kcal}<br><span style="font-size:11px;font-weight:600;color:var(--muted)">kcal</span></div></div>`;}).join('');
  }catch(e){resultsEl.innerHTML=`<div class="food-empty fade-up"><div class="food-empty-icon" style="color:var(--fat)">${ico('database',42)}</div><p style="font-weight:700;color:var(--fat)">${e.message}</p></div>`;}

function selectDBProduct(idx){const p=window._dbSearchResults?.[idx];if(!p)return;selectedProduct=p;showAmountSelector(p);}

function showAmountSelector(product, cachedEntry){
  stopBarcodeScanner();
  const mc=document.getElementById('modal-container');
  const name=getProductName(product);
  const brand=product.brands?product.brands.split(',')[0].trim():'';
  const imgSrc=product.image_thumb_url||'';
  const per100=getNutrientsPer100(product);
  const servingG=getServingGrams(product);
  const qty=product.quantity||'';
  let defaultGrams=100,activeChipIdx=0;
  if(cachedEntry&&cachedEntry.grams){defaultGrams=cachedEntry.grams;if(cachedEntry.mealType)tempMealType=cachedEntry.mealType;}
  let chips=[{label:'100g Standard',grams:100}];
  if(servingG&&servingG!==100)chips.push({label:`1 Portion (${Math.round(servingG)}g)`,grams:Math.round(servingG)});
  chips.push({label:'50g',grams:50},{label:'150g',grams:150},{label:'250g',grams:250});
  chips.forEach((c,i)=>{if(c.grams===defaultGrams)activeChipIdx=i;});
  const chipsHTML=chips.map((c,i)=>`<div onclick="setAmountChip(${c.grams},${i})" class="amount-chip ${i===activeChipIdx?'active':''}" data-chip-idx="${i}">${c.label}</div>`).join('');
  const mealPillsHTML=MEAL_TYPES.map(t=>`<div onclick="selectMealType('${t.id}')" class="pill ${tempMealType===t.id?'active':''}" style="font-size:13px;padding:8px 14px">${mealIcon(t,16)} ${t.label}</div>`).join('');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box scale-in"><div style="display:flex;align-items:center;gap:10px;margin-bottom:24px"><button onclick="backToAddModal()" style="background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:18px;font-weight:800;cursor:pointer;padding:4px 10px">←</button><h2 style="flex:1">Feinanpassung</h2></div><div class="amount-header">${imgSrc?`<img class="amount-product-img" src="${imgSrc}" onerror="this.style.display='none'">`:`<div class="amount-product-img" style="display:flex;align-items:center;justify-content:center;font-size:32px">${ico('cart',24)}</div>`}<div style="flex:1;min-width:0"><div class="amount-product-name">${name}</div>${brand?`<div class="amount-product-brand">${brand}</div>`:''} ${qty?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${qty}</div>`:''}<div style="font-size:11px;color:var(--dim);margin-top:4px;font-weight:600;display:inline-block;padding:3px 8px;background:var(--card2);border-radius:6px;border:1px solid var(--border)">Je 100g • ${per100.calories} kcal</div></div></div><div style="font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px">Vorlagen</div><div class="amount-chips">${chipsHTML}</div><div style="font-size:13px;color:var(--muted);font-weight:700;margin-top:8px;margin-bottom:8px">Individuelles Gewicht</div><div class="amount-input-row"><input type="number" id="amount-grams-inp" class="inp" value="${defaultGrams}" min="1" max="9999" oninput="updateMacroPreview()" style="flex:1;font-size:24px;font-weight:800;text-align:center;border-radius:16px;"><div style="background:var(--card);border:2px solid var(--border);border-radius:16px;padding:12px 18px;font-weight:800;font-size:16px;color:var(--dim)">g</div></div><div class="macro-preview"><div class="macro-preview-title">Tatsächliche Makros</div><div class="macro-preview-grid" id="macro-preview-grid"><div><div class="macro-preview-val" id="prev-kcal" style="color:var(--accent)">-</div><div class="macro-preview-label">kcal</div></div><div><div class="macro-preview-val" id="prev-prot" style="color:var(--protein)">-</div><div class="macro-preview-label">Protein</div></div><div><div class="macro-preview-val" id="prev-carbs" style="color:var(--carbs)">-</div><div class="macro-preview-label">Carbs</div></div><div><div class="macro-preview-val" id="prev-fat" style="color:var(--fat)">-</div><div class="macro-preview-label">Fett</div></div></div></div><div style="font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px">Mahlzeit</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px" id="amount-meal-pills">${mealPillsHTML}</div><button onclick="confirmAddDBMeal()" class="btn" style="width:100%;font-size:16px" id="confirm-add-btn">+ Übernehmen</button><button onclick="window.saveAsFavorite()" class="btn btn-ghost" style="width:100%;margin-top:10px;font-size:14px">${ico('star',16)} Favorisieren</button></div></div>`;
  window._amountChips=chips;updateMacroPreview();
}

window.saveAsFavorite=function(){if(!selectedProduct)return;S.saveFavorite(selectedProduct);showToast('Favorit gespeichert');};
function setAmountChip(grams,idx){document.querySelectorAll('.amount-chip').forEach((el,i)=>el.classList.toggle('active',i===idx));const inp=document.getElementById('amount-grams-inp');if(inp){inp.value=grams;updateMacroPreview();}}
function updateMacroPreview(){const inp=document.getElementById('amount-grams-inp');if(!inp||!selectedProduct)return;const grams=parseFloat(inp.value)||0;const n=calcForGrams(selectedProduct,grams);const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};set('prev-kcal',n.calories);set('prev-prot',n.protein+'g');set('prev-carbs',n.carbs+'g');set('prev-fat',n.fat+'g');const chipGrams=(window._amountChips||[]).map(c=>c.grams);const matched=chipGrams.indexOf(grams);document.querySelectorAll('.amount-chip').forEach((el,i)=>el.classList.toggle('active',i===matched));}
function confirmAddDBMeal(){if(!selectedProduct)return;const grams=parseFloat(document.getElementById('amount-grams-inp')?.value)||100;if(grams<=0)return showToast('Mehr als 0g eingeben.');const n=calcForGrams(selectedProduct,grams);const name=getProductName(selectedProduct);const brandRaw=selectedProduct.brands?selectedProduct.brands.split(',')[0].trim():'';const brand=brandRaw&&brandRaw!=='USDA'&&brandRaw.length<24?' – '+brandRaw:'';addMeal({name:name+brand,calories:n.calories,protein:n.protein,carbs:n.carbs,fat:n.fat,mealType:tempMealType});if(selectedProduct._barcode)saveScanCacheEntry(selectedProduct._barcode,selectedProduct,grams,tempMealType);closeModal();}
function backToAddModal(){stopBarcodeScanner();selectedProduct=null;_renderAddModal();if(currentAddTab==='ki')setTimeout(_renderMealPills,50);}

const MEALDB_BASE='https://www.themealdb.com/api/json/v1/1';
let _currentRecipe=null;

function _buildRezepteTabHTML(){return`<div class="search-row"><input id="recipe-search-inp" class="inp" placeholder="Rezept suchen (Englisch z.B. Chicken...)" onkeydown="if(event.key==='Enter')runRecipeSearch()" style="flex:1;border-radius:18px;"><button onclick="runRecipeSearch()" class="btn" style="padding:12px 18px;flex-shrink:0;border-radius:16px;">${ico('search',18)}</button></div><div style="display:flex;gap:8px;flex-wrap:nowrap;margin-bottom:14px;overflow-x:auto;padding-bottom:6px" id="recipe-category-pills">${['Chicken','Beef','Pasta','Vegetarian','Seafood','Dessert','Breakfast'].map(c=>`<div onclick="searchRecipeByCategory('${c}')" class="pill" style="font-size:12px;padding:6px 14px;white-space:nowrap">${c}</div>`).join('')}</div><div id="recipe-results" style="max-height:45vh;overflow-y:auto;padding-right:4px"><div class="food-empty" style="padding:24px 0"><div class="food-empty-icon" style="color:var(--accent)">${ico('utensils',42)}</div><p style="color:var(--text);font-weight:600">Kategorie wählen oder suchen</p></div></div><button onclick="closeModal()" class="btn btn-ghost" style="width:100%;margin-top:10px">Schließen</button>`;}

async function runRecipeSearch(){const q=document.getElementById('recipe-search-inp')?.value.trim();if(!q)return showToast('Bitte etwas eingeben.');const el=document.getElementById('recipe-results');if(!el)return;el.innerHTML=`<div class="food-loading" style="padding:40px 0">Suche...</div>`;try{const data=await fetchWithRetry(`${MEALDB_BASE}/search.php?s=${encodeURIComponent(q)}`);_renderRecipeResults(data.meals||[]);}catch(e){el.innerHTML=`<div class="food-empty"><div class="food-empty-icon" style="color:var(--fat)">${ico('search',42)}</div><p>${e.message}</p></div>`;}}
async function searchRecipeByCategory(cat){const el=document.getElementById('recipe-results');if(!el)return;el.innerHTML=`<div class="food-loading" style="padding:40px 0">Lade ${cat} Rezepte...</div>`;try{const data=await fetchWithRetry(`${MEALDB_BASE}/filter.php?c=${encodeURIComponent(cat)}`);_renderRecipeResults((data.meals||[]).slice(0,25),true);}catch(e){el.innerHTML=`<div class="food-empty"><p>${e.message}</p></div>`;}}
function _renderRecipeResults(meals,minimal=false){const el=document.getElementById('recipe-results');if(!el)return;if(!meals.length){el.innerHTML=`<div class="food-empty"><div class="food-empty-icon" style="color:var(--muted)">${ico('search',42)}</div><p style="font-weight:700">Nichts gefunden.</p></div>`;return;}el.innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;padding-left:4px">${meals.length} Rezepte</div>`+meals.map((m,i)=>`<div class="recipe-card" onclick="openRecipeDetail('${m.idMeal}')" style="animation:fadeUp ${0.05+i*0.03}s ease-out both"><img class="recipe-card-img" src="${m.strMealThumb||''}${minimal?'/preview':''}" onerror="this.style.display='none'" loading="lazy"><div class="recipe-card-info"><div class="recipe-card-name">${m.strMeal||'Gericht'}</div><div class="recipe-card-meta">${m.strCategory||''} ${m.strArea?'• '+m.strArea:''}</div><div style="font-size:11px;color:var(--accent);margin-top:6px;font-weight:700">Details &rarr;</div></div></div>`).join('');}

async function openRecipeDetail(id){
  const mc=document.getElementById('modal-container');
  mc.innerHTML=`<div class="modal-overlay"><div class="modal-box"><div class="food-loading" style="padding:40px 0">${ico('chef',18)} Lade Rezept...</div></div></div>`;
  try{
    const data=await fetchWithRetry(`${MEALDB_BASE}/lookup.php?i=${id}`);
    const m=data.meals?.[0];if(!m)throw new Error('Rezept nicht gefunden.');
    _currentRecipe=m;
    const ingredients=[];
    for(let i=1;i<=20;i++){const ing=m[`strIngredient${i}`]?.trim();const measure=m[`strMeasure${i}`]?.trim();if(ing)ingredients.push({name:ing,measure:measure||''});}
    const estKcal=m.strCategory==='Dessert'?280:m.strCategory==='Breakfast'?350:550;
    const ingHTML=ingredients.map(ing=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="font-weight:600">${ing.name}</span><span style="color:var(--muted)">${ing.measure}</span></div>`).join('');
    const mealPillsHTML=MEAL_TYPES.map(t=>`<div onclick="selectMealType('${t.id}')" class="pill ${tempMealType===t.id?'active':''}" style="font-size:13px;padding:8px 12px">${mealIcon(t,16)} ${t.label}</div>`).join('');
    mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this){currentAddTab='rezepte';_renderAddModal()}"><div class="modal-box scale-in"><div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><button onclick="currentAddTab='rezepte';_renderAddModal()" style="background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:18px;font-weight:800;cursor:pointer;padding:4px 10px">←</button><h3 style="flex:1;font-size:17px;line-height:1.3">${m.strMeal}</h3></div>${m.strMealThumb?`<img src="${m.strMealThumb}" style="width:100%;border-radius:20px;max-height:220px;object-fit:cover;margin-bottom:18px">`:''}<div style="font-weight:800;font-size:15px;margin-bottom:8px">${ico('utensils',16)} Zutaten (${ingredients.length})</div><div style="max-height:160px;overflow-y:auto;margin-bottom:20px">${ingHTML}</div><div style="background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:16px"><div style="font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600">Kalorien Schätzung pro Portion</div><div style="display:flex;align-items:center;gap:10px"><input type="number" id="recipe-kcal-inp" class="inp" value="${estKcal}" style="flex:1;font-size:24px;font-weight:800;text-align:center;border-radius:14px"><span style="color:var(--muted);font-size:15px;font-weight:700">kcal</span></div></div><div style="font-size:13px;font-weight:600;margin-bottom:8px">Mahlzeit</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">${mealPillsHTML}</div><button onclick="addRecipeMeal()" class="btn" style="width:100%;font-size:16px;padding:15px">Ins Tagebuch</button><button onclick="currentAddTab='rezepte';_renderAddModal()" class="btn btn-ghost" style="width:100%;margin-top:10px">Zurück</button></div></div>`;
  }catch(e){showToast(e.message);currentAddTab='rezepte';_renderAddModal();}
}

function addRecipeMeal(){if(!_currentRecipe)return;const kcal=parseInt(document.getElementById('recipe-kcal-inp')?.value)||400;if(kcal<=0)return showToast('Kalorien eingeben.');addMeal({name:'Rezept '+_currentRecipe.strMeal,calories:kcal,protein:Math.round(kcal*0.20/4),carbs:Math.round(kcal*0.45/4),fat:Math.round(kcal*0.35/9),mealType:tempMealType});_currentRecipe=null;closeModal();}

// ====================== MODALS & TOAST ======================
function closeModal(){
  stopBarcodeScanner();stopCamera();aiPhoto=null;selectedProduct=null;_currentRecipe=null;currentBarcodeSubTab='camera';
  const overlay=document.querySelector('.modal-overlay');
  if(overlay){overlay.style.opacity='0';const box=document.querySelector('.modal-box');if(box)box.style.transform='translateY(100px)';setTimeout(()=>{document.getElementById('modal-container').innerHTML='';},250);}
  else document.getElementById('modal-container').innerHTML='';
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  t.style.animation='none';void t.offsetWidth;t.style.animation='fadeUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2)';
  clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>{t.style.animation='fadeOut 0.25s ease-out forwards';setTimeout(()=>{t.style.display='none';t.style.animation='';},250);},2800);
}

function addMeal(meal){const log=S.dayLog;log.meals=[...log.meals,{...meal,id:uid()}];S.saveDayLog(log);if(currentView==='dashboard')renderView('dashboard');const msgs=['Klasse!','Top!','Gespeichert!','Eingetragen!','Super!'];const randomMsg=msgs[Math.floor(Math.random()*msgs.length)];showToast(`${randomMsg} +${meal.calories} kcal`);}
function removeMeal(id){const log=S.dayLog;log.meals=log.meals.filter(m=>m.id!==id);S.saveDayLog(log);renderView(currentView);}

  const mc=document.getElementById('modal-container');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box scale-in"><h2 style="margin-bottom:18px;display:flex;align-items:center;gap:10px"><span>${ico('edit',20)}</span> Bearbeiten</h2><div style="font-weight:700;margin-bottom:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px;background:var(--card2);border-radius:12px">${meal.name}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px"><div style="background:var(--card2);padding:10px;border-radius:14px"><label style="font-size:12px;color:var(--accent);display:block;margin-bottom:4px;font-weight:700">Kalorien</label><input type="number" id="edit-cal" class="inp" value="${meal.calories}" style="text-align:center;font-weight:800;font-size:20px;border-color:var(--accent);padding:10px"></div><div style="background:var(--card2);padding:10px;border-radius:14px"><label style="font-size:12px;color:var(--protein);display:block;margin-bottom:4px;font-weight:700">Protein (g)</label><input type="number" id="edit-prot" class="inp" value="${meal.protein}" style="text-align:center;font-weight:600;padding:10px"></div><div style="background:var(--card2);padding:10px;border-radius:14px"><label style="font-size:12px;color:var(--carbs);display:block;margin-bottom:4px;font-weight:700">Kohlenhydrate (g)</label><input type="number" id="edit-carbs" class="inp" value="${meal.carbs}" style="text-align:center;font-weight:600;padding:10px"></div><div style="background:var(--card2);padding:10px;border-radius:14px"><label style="font-size:12px;color:var(--fat);display:block;margin-bottom:4px;font-weight:700">Fett (g)</label><input type="number" id="edit-fat" class="inp" value="${meal.fat}" style="text-align:center;font-weight:600;padding:10px"></div></div><div style="margin-bottom:20px"><label style="font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:8px">Mahlzeit-Kategorie</label><div style="display:flex;gap:8px;flex-wrap:wrap" id="edit-meal-pills">${MEAL_TYPES.map(t=>`<div onclick="document.querySelectorAll('#edit-meal-pills .pill').forEach(p=>p.classList.remove('active'));this.classList.add('active');this.dataset.id='${t.id}'" class="pill ${meal.mealType===t.id?'active':''}" data-id="${t.id}" style="font-size:13px;padding:8px 14px">${mealIcon(t,16)} ${t.label}</div>`).join('')}</div></div><button onclick="saveEditedMeal('${id}')" class="btn" style="width:100%;font-size:16px;padding:14px">Speichern</button><button onclick="closeModal()" class="btn btn-ghost" style="width:100%;margin-top:10px">Abbrechen</button></div></div>`;
}

function saveEditedMeal(id){
  const log=S.dayLog;const idx=log.meals.findIndex(m=>m.id===id);if(idx<0)return;
  const activePill=document.querySelector('#edit-meal-pills .pill.active');
  log.meals[idx]={...log.meals[idx],calories:parseInt(document.getElementById('edit-cal')?.value)||0,protein:parseFloat(document.getElementById('edit-prot')?.value)||0,carbs:parseFloat(document.getElementById('edit-carbs')?.value)||0,fat:parseFloat(document.getElementById('edit-fat')?.value)||0,mealType:activePill?.dataset?.id||log.meals[idx].mealType};
  S.saveDayLog(log);closeModal();renderView('dashboard');showToast('Gespeichert ✓');
}

// ====================== SHORTCUT / URL IMPORT ======================
let pendingShortcutImport=null;
function readShortcutImportFromURL(){
  const params=new URLSearchParams(window.location.search);
  const data={};
  if(params.has('steps')){
    const steps=parseInt(params.get('steps'));
    if(Number.isFinite(steps)&&steps>=0)data.steps=steps;
  }
  pendingShortcutImport=Object.keys(data).length?data:null;
}
function clearShortcutImportParams(){
  const url=new URL(window.location.href);
  ['steps'].forEach(k=>url.searchParams.delete(k));
  window.history.replaceState({},document.title,url.pathname+(url.search?url.search:'')+url.hash);
}
function applyPendingShortcutImport(){
  if(!pendingShortcutImport)return Promise.resolve(false);
  const data=pendingShortcutImport;
  pendingShortcutImport=null;
  const log=S.dayLog;
  if(typeof data.steps==='number')log.steps=data.steps;
  S.saveDayLog(log);
  const writes=[];
  if(fbReady&&fbUID&&fbDB){
    try{writes.push(fbDB.ref('users/'+fbUID+'/'+S.dayKey).set(log));}catch(e){}
  }
  return Promise.allSettled(writes).then(()=>{
    clearShortcutImportParams();
    if(currentView==='dashboard')renderView('dashboard');
    if(typeof data.steps==='number')showToast(`${data.steps} Schritte synchronisiert`);
    return true;
  });
}

// ====================== BOOT ======================
function boot(){
  readShortcutImportFromURL();

  S.chats=load('chats')||[];S.activeChatId=load('activeChatId')||null;
  if(S.chats.length===0)createNewChat('Willkommen zur KI Session!');
  if(!S.activeChatId||!getCurrentChat()){S.activeChatId=S.chats[0].id;saveChats();}

  const oldHistory=load('chatHistory');
  if(oldHistory&&Array.isArray(oldHistory)&&oldHistory.length>0){const currentChat=getCurrentChat();if(currentChat&&currentChat.messages.length===0){currentChat.messages=oldHistory.map(m=>({...m}));if(oldHistory[0]&&oldHistory[0].text){currentChat.title=(oldHistory[0].text||'').substring(0,30)+'...';}saveChats();}store('chatHistory',null);}

  function updateNavProfile(){
  const btn=document.getElementById('nav-profile-btn');
  if(!btn)return;
  const content=fbUser && !fbUser.isAnonymous && fbUser.photoURL 
    ? `<img src="${fbUser.photoURL}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);margin-bottom:2px">PROFIL`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>PROFIL`;
  btn.innerHTML=content;
}

// Auth state listener – runs after firebase is initialized
if (fbAuth) {
  fbAuth.onAuthStateChanged(user => {
    fbUser = user;
    updateNavProfile();
    if (user) {
        fbUID = user.uid;
        fbReady = true;
        console.log('Auth State:', user.isAnonymous ? 'Anonym' : 'Angemeldet als ' + (user.email || user.displayName), 'UID:', fbUID);
        syncFromFirebase(fbUID).then(() => applyPendingShortcutImport()).then(() => {
          startFirebaseLiveSync(fbUID);
        });

        document.getElementById('login-screen').style.display = 'none';
        S.profile = S.loadProfile();
        if (!S.profile) {
          document.getElementById('onboarding').style.display = 'flex';
          renderOnboarding();
        } else {
          document.getElementById('app').style.display = 'flex';
          applyTheme(S.profile);
          if (!window.booted) navigate('dashboard');
        }
        window.booted = true;

      } else {
        fbReady = false;
        fbUID = null;
        window.booted = true;
        renderLoginScreen();
      }
    });
  } else {
    window.booted = true;
    S.profile = S.loadProfile();
    if (!S.profile) {
      document.getElementById('onboarding').style.display = 'flex';
      renderOnboarding();
    } else {
      document.getElementById('app').style.display = 'flex';
      applyTheme(S.profile);
      applyPendingShortcutImport();
      navigate('dashboard');
    }
  }

  if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(r=>console.log('SW aktiv',r.scope)).catch(e=>console.log('SW Info:',e));});}
}
boot();

</script>
